# Intafaced gitleaks — entropy/pattern layer beside tooling/ci/secret-scan.mjs (assignment law).
# Law: docs/INTERNET-LEVERAGE-LAW.md (removed) · FH-SEC-02 · SECURITY-WHEN-PLAIN Track A
# Vendor known-disclosed remains secret-scan KNOWN_DISCLOSED (not silent path exemptions here).
title = "intafaced"

[extend]
useDefault = true

[allowlist]
description = "Vendor, fixtures, i18n key names, local-dev anvil keys — real product secrets still fail"
paths = [
  '''(^|/)vendor/''',
  '''(^|/)node_modules/''',
  '''\.pnpm-store''',
  '''pnpm-lock\.yaml$''',
  '''package-lock\.json$''',
  '''yarn\.lock$''',
  '''(^|/)docs/''',
  '''\.env\.example$''',
  '''\.env\.sample$''',
  '''.*\.test\.(ts|tsx|js|mjs|cjs)$''',
  '''.*\.spec\.(ts|tsx|js|mjs)$''',
  '''.*\.mutation\.mjs$''',
  '''(^|/)tooling/uiproof/''',
  '''(^|/)services/.*/scripts/.*e2e\.mjs$''',
]
regexTarget = "match"
regexes = [
  '''(?i)(example|placeholder|changeme|your[-_]?|xxx|dummy|test[-_]?secret|a-mount-test)''',
  '''(?i)0x[0-9a-f]{40}''',
  '''bodyKey:\s*'notify\.''',
  '''titleKey:\s*'notify\.''',
  # Hardhat/anvil well-known account #1 private key (local sandbox only)
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  # Published Keccak-256 vectors — Keccak('') and Keccak('abc'). These are
  # REFERENCE values, not credentials: `wallet-rpc-mainnet-scan.mjs` hashes them
  # at load and refuses to run if its own implementation disagrees, so that
  # M11-known cannot name the wrong canonical constant. They are the two most
  # widely published digests in the ecosystem and are secret from nobody.
  #
  # Listed individually rather than exempting 64-hex generally. A blanket rule
  # would also hide every real SHA-256 and private key in the repo, which is
  # most of what this file exists to catch.
  '''c5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470''',
  '''4e03657aea45a94fc7d47ba826c8d667c0d1e6e33a64a036ec44f58fa12d6c45''',
]
