# Dependency updates.
#
# Chosen over self-hosted Renovate because it runs on GitHub's own
# infrastructure and needs no workflow of ours to find an update.
#
# GROUPING IS THE WHOLE CONFIG — review capacity, not volume for volume's sake.
# Ungrouped, a monorepo with 33 workspace packages opens dependency PRs faster
# than anyone reviews them, and a queue of bot PRs nobody reads is
# indistinguishable from no scanning at all. Staggered weekly groups keep the
# queue readable.
version: 2

updates:
  # ── npm / pnpm workspace ────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    # Low, on purpose. A queue of bot PRs nobody merges is indistinguishable
    # from no scanning at all.
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Security fixes travel alone and first — they are the ones worth
      # interrupting a week for, and mixing them into a 40-package bump is how
      # an urgent patch waits behind a major nobody wants.
      security:
        applies-to: security-updates
        patterns: ['*']
      # Everything else batches. Patch and minor together: this repo pins
      # carets already, so a minor is inside the range the lockfile could have
      # resolved to anyway.
      production:
        applies-to: version-updates
        dependency-type: 'production'
        update-types: ['patch', 'minor']
      development:
        applies-to: version-updates
        dependency-type: 'development'
        update-types: ['patch', 'minor']
    ignore:
      # Majors are a human decision. A bot cannot read a CHANGELOG and cannot
      # tell whether an ORM's breaking change touches the money path.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # solc is NOT a library — it is a compiler pinned to an exact version in
      # BOTH svc-indexer and svc-protocol, and `contract-sources.mjs` fails the
      # build when the two disagree: "two compilers in one repo produce two
      # bytecodes". A patch bump here is a bytecode change to deployed contracts,
      # which is Shehzad's plane and never a bot's call.
      #
      # This rule exists because the bot's first development-group PR bumped it
      # to 0.8.36 while svc-protocol stayed on 0.8.28, and the guard caught it.
      # Moving it is a deliberate, coordinated change to both services at once.
      - dependency-name: 'solc'

  # ── GitHub Actions ──────────────────────────────────────────────────────
  #
  # This is the half that makes SHA pinning survivable. Workflows pin by digest
  # (see .github/workflows/*.yml) so a retagged upstream cannot silently enter
  # the job that builds our images — and this keeps those digests current
  # instead of frozen at whatever was true the day they were pinned.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(actions)'
    groups:
      actions:
        patterns: ['*']

  # ── Maven (vendored customer platform) ──────────────────────────────────
  #
  # The customer surface is Spring Boot 1.5.x / Java 8 under vendor/upstream-
  # exchange. Until this block, Dependabot had no maven ecosystem entry, so
  # those jars were never advisory-scanned. Grouped weekly, low PR limit,
  # majors ignored — same review-capacity rationale as the npm block.
  # Two roots = two poms that parent the rest (framework + wallet-rpc).
  # Path: INTERNET-LEVERAGE Phase C §2 EXT · NOW · owner N (Dependabot).
  - package-ecosystem: 'maven'
    directory: '/vendor/upstream-exchange/00_framework'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps-maven)'
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      production:
        applies-to: version-updates
        dependency-type: 'production'
        update-types: ['patch', 'minor']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Spring Cloud train names (Edgware/Hoxton/…) are not semver majors — Dependabot
      # will still open Edgware→Hoxton as a "version update". That is a Boot 2.x generation
      # jump on a Boot 1.5 tree (L16 closed #1143/#1147). Human-only.
      - dependency-name: 'org.springframework.cloud:spring-cloud-dependencies'

  - package-ecosystem: 'maven'
    directory: '/vendor/upstream-exchange/01_wallet_rpc'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps-maven)'
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      production:
        applies-to: version-updates
        dependency-type: 'production'
        update-types: ['patch', 'minor']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Spring Cloud train names (Edgware/Hoxton/…) are not semver majors — Dependabot
      # will still open Edgware→Hoxton as a "version update". That is a Boot 2.x generation
      # jump on a Boot 1.5 tree (L16 closed #1143/#1147). Human-only.
      - dependency-name: 'org.springframework.cloud:spring-cloud-dependencies'
