# PR checks: the three small pull-request checks in one workflow (Gitleaks, Dependency audit,
# Gate-file guard). They used to be three workflows (gitleaks.yml, supply-chain.yml,
# gate-file-guard.yml). Job names are unchanged, so required checks still match.
# Each job keeps its own permissions: only the guard holds a token that can comment, and it
# still runs the base commit's copy of its script, never PR code.
#
# ---- Gitleaks ----
# FH-SEC-02 / SECURITY-WHEN-PLAIN Track A — gitleaks always-on
# Complements tooling/ci/secret-scan.mjs (assignment law).
# Uses the gitleaks binary (not gitleaks-action) so private-repo PR commit listing
# is not required, and so secret-scan does not see a GITHUB_TOKEN assignment.
#
# ---- Dependency audit ----
# Supply chain — the ban we wrote in Phase B §5 and never instrumented.
#
# "Hot-wallet random npm — custody supply chain" has been on the kill list since
# the horizon map was written. Until this workflow there was no dependabot, no
# `pnpm audit`, no SBOM, and nothing anywhere that asked whether a dependency
# carried a known vulnerability. A mutation-tested secret scanner sat beside a
# dependency tree nothing had ever looked at.
#
# Uses NO third-party action, for the same reason gitleaks.yml uses the binary
# rather than gitleaks-action: a workflow installed to reduce third-party trust
# should not begin by adding some. Everything here is `pnpm audit` — already in
# the toolchain — read by tooling/ci/dependency-audit.mjs.
#
# RUNS ON EVERY PULL REQUEST, and the path filter that used to narrow it is
# gone. Two reasons, and the second is the one that matters.
#
# 1. The private-repo Actions bill is gone (thrift deleted 2026-08-07, #967). The
#    bill is still zero on a public repo, but a 403 or 429 from GitHub is a stop.
#    The job is one step, ~20s, no build and no services.
#
# 2. A REQUIRED CHECK MUST RUN ON EVERY PR OR IT BLOCKS THE ONES IT SKIPS.
#    GitHub waits for a context it was told to expect; a workflow that filters
#    itself out never reports, and the PR sits pending forever. So a path filter
#    and a required check are mutually exclusive, and this needs to be required:
#    #898 merged with this job RED, and that is exactly how a fixed `fast-uri`
#    HIGH came back to main (#904). The gate worked; nothing made anyone wait
#    for it.
#
# Dependabot and manual `workflow_dispatch` still surface advisories against
# dependencies nobody touched — `js-yaml` (#942) landed that way.
#
# ---- Gate-file guard ----
# Gate-file guard: a PR that changes the files that decide what may merge must say so in its title.
#
# Rule (also in tooling/scripts/gate-file-guard.mjs and in the PR comment): a PR that changes tooling/ci/** (which holds the
# dependency-audit allowlist, the secret-scan allowlists and the money-skip inventory), .github/workflows/**,
# .gitleaks.toml or the merge-gate tools fails this check unless its TITLE starts with `ci:`, `gate:` or `chore(ci):`,
# or contains `[gate-change]`.
#
# Why: #4402 widened the dependency-audit allowlist inside a migration fix, and nothing in the PR said so.
#
# SAFETY:
# - `pull_request`, never `pull_request_target`. This job holds a token that can comment on PRs; on a public repo
#   `pull_request_target` plus a checkout of PR code is the classic way an outside PR steals secrets.
# - It checks out the PR's BASE commit and runs the script from there. A PR therefore cannot weaken the rule inside
#   the PR it is judged on, and no PR code runs in this job at all. The PR title reaches the script through an
#   environment variable, never through shell interpolation.
# - A PR can still edit this workflow file. That edit is itself a gate change, and merge-gate.mjs applies the same rule
#   again when the PR is merged, independently of this workflow.
# - `edited` is in the trigger list so that fixing the title re-runs the check.
name: PR checks

on:
  pull_request:
    # `edited` is here so that fixing a PR title re-runs the gate-file guard.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
      - name: Gitleaks (working tree)
        run: ./gitleaks detect --source . --no-git --config .gitleaks.toml --redact

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # No `--frozen-lockfile` install: the audit reads the lockfile, and a full
      # workspace install would spend minutes to tell us nothing extra.
      - name: Audit dependencies against the frozen advisory list
        run: node tooling/ci/dependency-audit.mjs

  guard:
    name: Gate-file guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Check gate files against the PR title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f tooling/scripts/gate-file-guard.mjs ]; then
            echo "::notice::gate-file-guard.mjs is not on the base commit yet (this PR introduces it); nothing to enforce."
            exit 0
          fi
          node tooling/scripts/gate-file-guard.mjs --pr "$PR_NUMBER" --title "$PR_TITLE" --repo "$REPO" --comment
