# PR checks: Gitleaks and Dependency audit in one workflow. They used to be separate workflows
# (gitleaks.yml, supply-chain.yml). Job names are unchanged, so required checks still match.
# The Gate-file guard is its own workflow (gate-file-guard.yml), because it alone reads the PR
# title: a title or body edit re-runs the guard there, and no longer re-runs these two jobs.
#
# ---- Gitleaks ----
# FH-SEC-02 / SECURITY-WHEN-PLAIN Track A — gitleaks always-on
# Complements tooling/ci/secret-scan.mjs (assignment law).
# Uses the gitleaks binary (not gitleaks-action) so private-repo PR commit listing
# is not required, and so secret-scan does not see a GITHUB_TOKEN assignment.
#
# ---- Dependency audit ----
# Supply chain — the ban we wrote in Phase B §5 and never instrumented.
#
# "Hot-wallet random npm — custody supply chain" has been on the kill list since
# the horizon map was written. Until this workflow there was no dependabot, no
# `pnpm audit`, no SBOM, and nothing anywhere that asked whether a dependency
# carried a known vulnerability. A mutation-tested secret scanner sat beside a
# dependency tree nothing had ever looked at.
#
# Uses NO third-party action, for the same reason gitleaks.yml uses the binary
# rather than gitleaks-action: a workflow installed to reduce third-party trust
# should not begin by adding some. Everything here is `pnpm audit` — already in
# the toolchain — read by tooling/ci/dependency-audit.mjs.
#
# RUNS ON EVERY PULL REQUEST, and the path filter that used to narrow it is
# gone. Two reasons, and the second is the one that matters.
#
# 1. The private-repo Actions bill is gone (thrift deleted 2026-08-07, #967). The
#    bill is still zero on a public repo, but a 403 or 429 from GitHub is a stop.
#    The job is one step, ~20s, no build and no services.
#
# 2. A REQUIRED CHECK MUST RUN ON EVERY PR OR IT BLOCKS THE ONES IT SKIPS.
#    GitHub waits for a context it was told to expect; a workflow that filters
#    itself out never reports, and the PR sits pending forever. So a path filter
#    and a required check are mutually exclusive, and this needs to be required:
#    #898 merged with this job RED, and that is exactly how a fixed `fast-uri`
#    HIGH came back to main (#904). The gate worked; nothing made anyone wait
#    for it.
#
# A PR THAT CHANGES NO DEPENDENCY ONLY WARNS (owner decision 2026-10-25). The
# advisory database moves by itself: on 2026-10-23 one zod advisory held 24 PRs
# for seven hours, and 22 of them changed no dependency. With `--base HEAD^1`
# (the base side of the PR's merge commit, hence `fetch-depth: 2`) the script
# holds a PR into main to the full ratchet only when it touches the lockfile,
# the root package.json, pnpm-workspace.yaml, .npmrc, .pnpmfile.cjs or the
# frozen list itself (tooling/ci/dependency-audit.mjs).
#
# ON MAIN IT IS THE FULL RATCHET. Every push to main runs both jobs, and Main
# trust (main-trust.yml) watches this workflow: a red re-runs once, then opens
# one "Broken on main: PR checks" issue, so a new advisory gets an owner.
# Dependabot security updates and manual `workflow_dispatch` surface it too —
# `js-yaml` (#942) landed that way.
#
name: PR checks

on:
  pull_request:
    # No `edited`: neither job reads the title or body, so an edit has nothing new to check. It also used to cancel an
    # in-progress run through the concurrency group below.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  # Not on main: a merge must not cancel the run (or the re-run Main trust asked for) that judges the merge before it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
      - name: Gitleaks (working tree)
        run: ./gitleaks detect --source . --no-git --config .gitleaks.toml --redact

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # HEAD^1 is the base side of a PR's merge commit
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # No `--frozen-lockfile` install: the audit reads the lockfile, and a full
      # workspace install would spend minutes to tell us nothing extra.
      - run: node tooling/ci/dependency-audit.mjs --self-test
      - name: Audit dependencies against the frozen advisory list
        # Only a PR into main is judged by its own diff: a stacked PR's diff against another branch says nothing about
        # what it brings to main, and retargeting a PR (an `edited` event) does not re-run this job.
        run: node tooling/ci/dependency-audit.mjs ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && '--base HEAD^1' || '' }}
