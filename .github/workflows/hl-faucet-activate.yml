# Get 1,000 TEST USDC for the platform's TESTNET funder from Hyperliquid's testnet faucet, by hand only. The faucet pays
# once per address that exists on mainnet, and the funder spent its claim; so a fresh address made inside the run is sent
# 0.01 USDC on MAINNET from the platform account (about 1.01 USDC with the venue's activation fee), claims its drip, and
# sends the TEST USDC to the funder. The script caps it (packages/venue-hyperliquid/scripts/faucet-activate.ts): one
# mainnet action per run, at most 0.01 USDC plus the fee, at most 2 runs a UTC day, and prints only addresses and amounts.
# The owner allowed about 2 USDC of the platform account's mainnet balance for this (project-state#4088 comment
# 7211361443, 27 Nov 2026; intafaced#11043). The round.log line for a low funder (#11032) says when to run it again.
name: Hyperliquid faucet activate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hl-faucet-activate
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  activate:
    name: Activate one address and claim its TEST USDC
    # The platform account's key is used only from main's own copy of this file and the script.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Every other run of this workflow on main today counts against the cap, whatever its result.
      - name: Count today's runs
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          n="$(gh api "repos/$REPO/actions/workflows/hl-faucet-activate.yml/runs?branch=main&created=>=$today&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | length")"
          echo "earlier runs today: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build what the script imports
        run: pnpm exec turbo run build --filter=@intafaced/venue-hyperliquid^...

      - name: Activate and claim
        env:
          APP_ENV: test
          HL_TESTNET_FUNDER_KEY: ${{ secrets.HL_TESTNET_TRADER_KEY }}
          HL_ACTIVATIONS_TODAY: ${{ steps.count.outputs.n }}
        run: pnpm --filter @intafaced/venue-hyperliquid faucet:activate
