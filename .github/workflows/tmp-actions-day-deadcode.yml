name: Actions day dead code

on:
  push:
    branches: [tmp/actions-day/deadcode]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  knip:
    if: github.event.before == 'b5c5ad299278db01b6be655a033617805e61605b'
    name: Knip full scan and unreachable files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Scan all Knip issue types and list tracked unreachable files
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir "$RUNNER_TEMP/knip"
          pnpm exec knip --reporter json --no-progress --no-exit-code --include-entry-exports --include-subpath-exports --include nsExports,nsTypes \
            > "$RUNNER_TEMP/knip/knip.json" 2> "$RUNNER_TEMP/knip/diagnostics.log"
          if grep -Eq '\bERROR\b' "$RUNNER_TEMP/knip/diagnostics.log"; then
            cat "$RUNNER_TEMP/knip/diagnostics.log"
            exit 1
          fi
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const dir = process.env.RUNNER_TEMP + '/knip';
          const report = JSON.parse(readFileSync(dir + '/knip.json', 'utf8'));
          if (!Array.isArray(report.issues)) throw new Error('Knip issue list is missing');
          const tracked = new Set(execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0'));
          const files = new Set(report.issues.filter(row => row.files?.length).map(row => row.file));
          for (const file of report.files ?? []) files.add(typeof file === 'string' ? file : file.file);
          const unreachable = [...files].filter(file => tracked.has(file)).sort();
          writeFileSync(dir + '/unreachable.json', JSON.stringify(unreachable, null, 2));
          console.log('Tracked files unreachable from the configured Knip entries:', unreachable.length);
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deadcode-knip
          path: ${{ runner.temp }}/knip/
          if-no-files-found: error
          retention-days: 3

  shape:
    if: github.event.before == 'b5c5ad299278db01b6be655a033617805e61605b'
    name: Shape census
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Count the five existing shape rules
        run: |
          mkdir "$RUNNER_TEMP/shape"
          for rule in no-call-by-name no-cross-feature-import no-hand-schema no-source-text-test no-runtime-swap; do
            node tooling/lint/count-rule.mjs "garden/$rule" --json > "$RUNNER_TEMP/shape/$rule.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deadcode-shape
          path: ${{ runner.temp }}/shape/
          if-no-files-found: error
          retention-days: 3

  rust:
    if: github.event.before == '0091e2005bc51a60e0a4d2df1ae1e655d5cbb6dc'
    name: Rust dependency and dead-code scans
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Scan for unused Cargo dependencies
        run: |
          mkdir "$RUNNER_TEMP/rust-deadcode"
          cargo install cargo-machete --locked --version 0.10.1
          status=0
          cargo machete --json --with-metadata --skip crates/vendor > "$RUNNER_TEMP/rust-deadcode/machete.json" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          jq -e 'type == "object"' "$RUNNER_TEMP/rust-deadcode/machete.json"
          git restore -- Cargo.lock
      - name: Check all workspace targets for dead-code warnings
        if: '!cancelled()'
        run: |
          mkdir -p "$RUNNER_TEMP/rust-deadcode"
          RUSTFLAGS=-Wdead_code cargo check --workspace --all-targets --locked --message-format=json \
            | jq -c 'select(.reason == "compiler-message") | .message | select(.code.code == "dead_code" or .level == "error")' \
            | tee "$RUNNER_TEMP/rust-deadcode/compiler.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deadcode-rust
          path: ${{ runner.temp }}/rust-deadcode/
          if-no-files-found: error
          retention-days: 3

  invitation:
    if: github.event.before == '0091e2005bc51a60e0a4d2df1ae1e655d5cbb6dc'
    name: Trial invitation batch (${{ matrix.batch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        batch: [unused-declarations, combined]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Delete reviewed unreachable components in the runner checkout
        if: matrix.batch == 'combined'
        run: |
          git rm -- apps/invitation/src/components/{halo-toggle-group,noise-texture,shimmer-button,text-animate}.tsx
          git diff --cached --numstat
      - run: pnpm install --frozen-lockfile
      - name: Delete unreferenced invitation declarations
        run: |
          sed -i '24d;11s/, FieldTitle//' apps/invitation/src/components/halo-field.tsx
          sed -i '66,67d;122,137d;121d' apps/invitation/src/components/metal-button.tsx
          git add -- apps/invitation/src/components/{halo-field,metal-button}.tsx
          git diff --cached --check
          git diff --cached --numstat
      - name: Typecheck invitation
        run: pnpm --filter @intafaced/invitation typecheck
      - name: Build invitation
        run: pnpm --filter @intafaced/invitation build
      - name: Run invitation unit tests
        run: pnpm --filter @intafaced/invitation test
      - name: Start the built app and request its page and JS entry
        run: |
          pnpm --filter @intafaced/invitation preview --strictPort > "$RUNNER_TEMP/invitation.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          url=http://127.0.0.1:3201
          for i in {1..30}; do
            if curl -fsS "$url/" -o "$RUNNER_TEMP/invitation.html"; then break; fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/invitation.html"
          entry=$(grep -oE 'src="/assets/[^"]+\.js"' "$RUNNER_TEMP/invitation.html" | head -1 | cut -d'"' -f2)
          test -n "$entry"
          curl -fsS "$url$entry" -o "$RUNNER_TEMP/invitation.js"
          test -s "$RUNNER_TEMP/invitation.js"

  manifests:
    if: github.event.before == '0091e2005bc51a60e0a4d2df1ae1e655d5cbb6dc'
    name: Trial manifest batch (${{ matrix.app }} / ${{ matrix.batch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            batch: control
          - app: customer
            batch: react-virtual
            dependency: '@tanstack/react-virtual'
            section: dependencies
          - app: admin
            batch: control
          - app: admin
            batch: db
            dependency: '@intafaced/db'
            section: devDependencies
          - app: admin
            batch: events
            dependency: '@intafaced/events'
            section: devDependencies
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intafaced
          POSTGRES_PASSWORD: intafaced
          POSTGRES_DB: intafaced
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U intafaced"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP: ${{ matrix.app }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Remove the direct dependency and update the lockfile
        if: matrix.batch != 'control'
        env:
          DEP: ${{ matrix.dependency }}
          SECTION: ${{ matrix.section }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { APP, DEP, SECTION } = process.env;
          const path = 'apps/' + APP + '/package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          if (!Object.hasOwn(pkg[SECTION], DEP)) throw new Error('Dependency entry missing: ' + DEP);
          delete pkg[SECTION][DEP];
          writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          JS
          pnpm install --lockfile-only --ignore-scripts
          git diff --check
          git diff --numstat
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/test-infra
      - name: Build the app and its workspace dependencies
        run: pnpm turbo run build --filter="@intafaced/$APP"
      - name: Typecheck the app
        run: pnpm turbo run typecheck --filter="@intafaced/$APP"
      - name: Run the app's unit tests
        run: pnpm test --concurrency=3 --filter="@intafaced/$APP"
      - name: Start the built app and request its home page
        run: |
          if [ "$APP" = admin ]; then
            pnpm --filter "@intafaced/$APP" start > "$RUNNER_TEMP/app-start.log" 2>&1 &
            port=3100
          else
            pnpm --filter "@intafaced/$APP" preview --strictPort > "$RUNNER_TEMP/app-start.log" 2>&1 &
            port=3200
          fi
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..45}; do
            if curl -fsS "http://127.0.0.1:$port/" -o "$RUNNER_TEMP/home.html"; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/app-start.log"
          exit 1

  rust_tax:
    name: Trial svc-tax dependency batch (${{ matrix.batch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        batch: [control, four-direct-dependencies]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intafaced
          POSTGRES_PASSWORD: intafaced
          POSTGRES_DB: intafaced_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U intafaced"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://intafaced:intafaced@127.0.0.1:5432/intafaced_test
      REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fetch --locked
      - name: Drop the four reviewed entries
        if: matrix.batch == 'four-direct-dependencies'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          manifest = Path('crates/svc-tax/Cargo.toml')
          text = manifest.read_text()
          names = {'base64', 'ed25519-dalek', 'hmac', 'ureq'}
          assert names <= tomllib.loads(text)['dependencies'].keys()
          lines = text.splitlines(keepends=True)
          kept = [line for line in lines if line.split('=', 1)[0].strip() not in names]
          assert len(lines) - len(kept) == len(names)
          manifest.write_text(''.join(kept))
          PY
      - name: Typecheck every workspace target and reconcile Cargo.lock
        run: cargo check --workspace --all-targets --offline
      - name: Verify and show the direct dependency delta
        run: |
          if [ "$BATCH" = control ]; then
            git diff --exit-code -- Cargo.lock crates/svc-tax/Cargo.toml
          else
            python3 - <<'PY'
          from pathlib import Path
          import subprocess, tomllib

          before = tomllib.loads(subprocess.check_output(['git', 'show', 'HEAD:Cargo.lock'], text=True))
          after = tomllib.loads(Path('Cargo.lock').read_text())
          names = {'base64', 'ed25519-dalek', 'hmac', 'ureq'}
          def svc_tax_edges(lock):
              return next(set(pkg['dependencies']) for pkg in lock['package'] if pkg['name'] == 'svc-tax')

          removed = svc_tax_edges(before) - svc_tax_edges(after)
          assert {entry.split()[0] for entry in removed} == names
          print('Removed direct Cargo edges:', ', '.join(sorted(removed)))
          PY
            git diff --check
            git diff --numstat
          fi
        env:
          BATCH: ${{ matrix.batch }}
      - name: Build the svc-tax executable
        run: cargo build --locked -p svc-tax
      - name: Unit, integration and Postgres replay tests
        run: |
          psql "$TEST_DATABASE_URL" -q -c 'ALTER SYSTEM SET fsync = off' -c 'ALTER SYSTEM SET synchronous_commit = off' -c 'SELECT pg_reload_conf()'
          cargo test --locked -p svc-tax
      - name: Start the built svc-tax and verify its health endpoint
        env:
          APP_ENV: test
          SERVICE_NAME: svc-tax
          HTTP_HOST: 127.0.0.1
          HTTP_PORT: '4020'
          LEDGER_URL: http://127.0.0.1:4001
          EDGE_PRINCIPAL_SECRET: dev-only-actions-day-edge-placeholder
          INTERNAL_SERVICE_SECRET: dev-only-actions-day-service-placeholder
        run: |
          target/debug/svc-tax > "$RUNNER_TEMP/svc-tax-start.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            kill -0 "$server" || break
            if curl -fsS "http://127.0.0.1:4020/health" -o "$RUNNER_TEMP/tax-health.json"; then
              jq -e 'type == "object"' "$RUNNER_TEMP/tax-health.json"
              exit 0
            fi
            sleep 1
          done
          echo 'svc-tax did not answer its health check'
          exit 1
