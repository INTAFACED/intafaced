name: Beta screening seal

# Puts the TEST screening fixture on the beta link's box (docs/runbooks/beta-link.md, "When it is not up") without
# anyone seeing it: the box makes an RSA key pair and dispatches this run with only its public key; the run encrypts
# the two repository secrets INTAFACED_SANCTIONS_REGIONS and INTAFACED_SANCTIONS_LIST_SOURCE to that key and uploads
# only the ciphertext, kept one day. The box downloads it and decrypts it straight into
# ~/.intafaced/beta/state/screening.local.json (mode 600). No value reaches a log, the artifact in clear, or a chat.
# intafaced has no self-hosted runner, so nothing here can write to the box itself. (Failure it prevents: the beta
# link read "blocked" from 21 Nov 2026 because the fixture lived only in these secrets; owner's choice "CI fixture",
# 22 Nov 2026.)
#
# Ends: with one dispatch from the box, on main: one run, seconds long.
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: The box's RSA public key, PEM, base64 on one line
        required: true

permissions: {}

jobs:
  seal:
    name: Seal the TEST screening fixture to the box's key
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # healthy run: seconds
    permissions: {}
    steps:
      - name: Encrypt the two secrets to the box's public key
        env:
          PUBLIC_KEY_B64: ${{ inputs.public_key }}
          REGIONS: ${{ secrets.INTAFACED_SANCTIONS_REGIONS }}
          SOURCE: ${{ secrets.INTAFACED_SANCTIONS_LIST_SOURCE }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$REGIONS" ] || [ -z "$SOURCE" ]; then
            echo "::error::INTAFACED_SANCTIONS_REGIONS or INTAFACED_SANCTIONS_LIST_SOURCE is unset"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/seal" sealed
          printf '%s' "$PUBLIC_KEY_B64" | base64 -d > "$RUNNER_TEMP/seal/box.pub.pem"
          bits=$(openssl pkey -pubin -in "$RUNNER_TEMP/seal/box.pub.pem" -text -noout | sed -n 's/.*(\([0-9]*\) bit).*/\1/p' | head -1)
          if [ "${bits:-0}" -lt 3072 ]; then
            echo "::error::the public key is not an RSA key of at least 3072 bits"
            exit 1
          fi
          # A fresh one-time AES key, itself sealed to the box's RSA key (OAEP, SHA-256).
          openssl rand -hex 32 > "$RUNNER_TEMP/seal/k"
          jq -cn --arg regions "$REGIONS" --arg source "$SOURCE" '{regions: $regions, source: $source}' \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass "file:$RUNNER_TEMP/seal/k" -out sealed/fixture.enc
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/seal/box.pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/seal/k" -out sealed/key.enc
          rm -f "$RUNNER_TEMP/seal/k"
          echo "sealed: $(wc -c < sealed/fixture.enc) bytes of ciphertext, key for a ${bits}-bit RSA key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta-screening-sealed
          path: sealed/
          retention-days: 1
          if-no-files-found: error
