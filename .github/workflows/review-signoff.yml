name: Review sign-off

# Turns a review comment into the commit status `Independent review`, but only from a listed reviewer, and keeps a
# sign-off across a clean rebase. Switches auto-merge off where it does not belong. See tooling/ci/review-signoff.mjs.
#
# Both triggers run the copy of this file and of the scripts on the default branch. Nothing here checks out, builds or
# runs code from a pull request: the script reads the PR through the API (its metadata, file names and diff text).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, auto_merge_enabled]

permissions: {}

# No concurrency group: GitHub keeps one pending run per group and would drop a queued sign-off. Every step is idempotent.

jobs:
  signoff:
    name: Review sign-off
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5 # healthy run: seconds
    permissions:
      contents: read
      statuses: write # the `Independent review` status
      pull-requests: write # switch auto-merge off
      issues: write # the one comment saying so
      actions: write # re-run the failed seal job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sign off, carry over, check auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/review-signoff.mjs
