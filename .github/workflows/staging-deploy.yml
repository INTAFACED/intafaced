# Staging deploy — D26-P3-01. `workflow_dispatch` ONLY.
#
# Law: docs/adr/2026-08-08-staging-deploy-path.md (Accepted 2026-08-08).
# Threat model: docs/THREAT-MODEL-STAGING-DEPLOY.md — read it before editing this
# file. Several choices below look like fussiness and are load-bearing; the
# threat model is where the reasoning lives, and it names each control by id.
#
# ── WHAT THIS FILE IS, AND WHAT IT IS NOT ───────────────────────────────────
#
# It is not a deploy. There is no staging host: buying one is Class X money and
# the ADR says so in as many words ("A workflow with nowhere to deploy is a file
# until the host exists; that is accepted"). No secret in this file has a value,
# and no host, domain or URL of ours appears anywhere in it. Dispatched today it
# does exactly one useful thing: it stops, loudly, on the first missing secret,
# naming it. That is the intended behaviour of a deploy path whose host has not
# been bought — not a stub, and not a skip.
#
# So: reviewable now, exercisable the day the owner has a host. Nothing here has
# ever been run against a real host, and nobody should read it as proven.
#
# ── WHY `workflow_dispatch` AND NOTHING ELSE ────────────────────────────────
#
# ADR: "Deploy-on-merge-to-main is forbidden while the operator and the swarm
# share one GitHub identity (G5)." Roughly sixty agent PRs a day merge into this
# trunk under that one identity. A `push:` trigger on such a trunk is a standing
# offer to deploy whatever the last merge happened to be, with nobody watching —
# which is precisely the unattended authority Class X reserves to the owner.
#
# `schedule:` is out for the same reason and one more: a cron deploy holds live
# credentials at an hour when no human is reading the log.
#
# The `no-unattended-trigger` step in `preflight` re-checks this against the file
# on disk on every single run, rather than trusting that a future edit will be
# reviewed by someone who read this comment.
#
# ── THE ATTENDED HOOK IS `environment:`, NOT A RULE IN THIS FILE ────────────
#
# The `deploy` job declares `environment: staging`. That is the hook, and it is
# the only place the policy can actually live: required reviewers, a wait timer
# and a branch allow-list are GitHub *environment* settings, set by the owner in
# repository settings, and no workflow file can grant or weaken them. The name
# `staging` is taken from the ADR (`APP_ENV=staging`), not invented here.
#
# UNPROVEN AND OWNER-OWNED: the environment does not exist yet. Until the owner
# creates it and attaches reviewers, `environment: staging` is an unprotected
# label and this workflow is attended only by the fact that a human has to click
# Run. Creating it is not something an agent may do — see the threat model's
# "deliberately cannot do" table.
#
# ── SUPPLY CHAIN: ONE ACTION, ALREADY PINNED ────────────────────────────────
#
# `actions/checkout` is the only action used, at the same commit SHA every other
# workflow in this repo already pins. Registry login, image build, push and the
# ssh transport are done with the CLIs preinstalled on the runner.
#
# That is deliberate and it follows the posture supply-chain.yml states outright:
# "a workflow installed to reduce third-party trust should not begin by adding
# some". `docker/build-push-action` and the various `ssh-action`s would each be a
# third party whose code runs in a job holding deploy credentials. Tags are not
# pinning — a tag is a mutable pointer the upstream owner can move after review,
# which is how `tj-actions/changed-files` turned into a secret exfiltrator. Every
# action reference here is a 40-hex commit, with the version in a trailing
# comment for humans.
name: Staging deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-staging to confirm. Anything else aborts.'
        required: true
        type: string
      image_digest:
        description: 'Optional rollback lever: an existing image digest (sha256:...) to redeploy instead of building. Empty = build the dispatched commit.'
        required: false
        default: ''
        type: string

# DENY BY DEFAULT. An empty top-level `permissions:` gives the job token no
# scopes at all, so every job below has to name what it needs. Without this line
# the token inherits the repository default, which on many repositories is still
# read/write over contents, issues, packages and deployments — a scope a deploy
# job has no use for and an attacker very much does.
permissions: {}

# ONE deploy at a time, and NOT keyed on the ref.
#
# `${{ github.workflow }}-${{ github.ref }}` — the group every other workflow in
# this repo uses — is right for a check and wrong for a deploy: two dispatches on
# two different refs land in two different groups and run at once, against one
# host, racing over the same containers and the same database. The group is a
# constant so that cannot happen.
#
# `cancel-in-progress: false` is the same argument from the other side. Cancelling
# a CI run costs a re-run. Cancelling a deploy halfway leaves migrations applied,
# some containers on the new image and some on the old, and no record of which —
# strictly worse than making the second dispatcher wait.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  preflight:
    name: Preflight (no credentials)
    runs-on: ubuntu-latest
    # Belt and braces with the `on:` block. If a future edit adds a trigger, this
    # condition still refuses to run the job — and the step below still fails the
    # run rather than letting it pass silently.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # fetch-depth: 0 — the merged-ancestry check below needs real history and
      # `origin/main`. At the default depth of 1 `git merge-base` has nothing to
      # work with, and a check that cannot see anything must never print clean.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Confirmation phrase
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "deploy-staging" ]; then
            echo "::error::confirmation phrase not given — expected deploy-staging"
            exit 1
          fi
          echo "confirmed"

      # THE TRIGGER SELF-CHECK.
      #
      # The `on:` block above is the control; this step is what keeps it. A
      # comment saying "no push trigger" is worth nothing against an edit six
      # months from now by someone who wants a green deploy on merge. This reads
      # the file on disk, in the checkout being deployed, and fails the run if a
      # `push:` or `schedule:` key has appeared under `on:`.
      #
      # Scoped to the `on:` block by line range rather than grepping the whole
      # file, because the word appears in this header a dozen times.
      - name: No unattended trigger
        run: |
          set -euo pipefail
          file=.github/workflows/staging-deploy.yml
          block=$(awk '/^on:/{flag=1;next} /^[a-z]/{flag=0} flag' "$file")
          if printf '%s\n' "$block" | grep -qE '^\s{2}(push|schedule|pull_request|pull_request_target|repository_dispatch):'; then
            echo "::error::$file has grown an unattended or fork-reachable trigger. ADR 2026-08-08 forbids it while operator and swarm share one identity (G5)."
            printf '%s\n' "$block"
            exit 1
          fi
          echo "trigger surface is workflow_dispatch only"

      # ONLY COMMITS ALREADY ON MAIN MAY BE DEPLOYED.
      #
      # `workflow_dispatch` lets the dispatcher pick any branch in this
      # repository, and under G5 the swarm holds the same write token the
      # operator does — so "only a trusted human can dispatch" is not a claim
      # this repo can make today. What it can enforce is that the *content*
      # being deployed already went through a pull request and landed on the
      # trunk. A branch pushed five seconds ago cannot reach the host, even from
      # an identity that is allowed to dispatch.
      #
      # This is defence in depth behind `environment:` reviewers, not a
      # replacement for them, and it is deliberately stricter than the ADR
      # requires. If the owner wants a feature branch on staging, this is the one
      # step to relax — knowingly, and with the reviewer gate in place first.
      - name: Deployed commit must already be on main
        run: |
          set -euo pipefail
          # The checkout above is fetch-depth: 0, so the repository is already
          # unshallow; this only needs the `main` ref itself, which a dispatch on
          # another branch does not fetch.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main — only reviewed, merged commits may be deployed to staging"
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      # The deployment unit is the one the ADR names — "Dockerfile +
      # docker-compose.apps.yml are the deployment unit. Rebuild not redesign."
      # If either has moved, stop here rather than discovering it over ssh.
      - name: The deployment unit is present
        run: |
          set -euo pipefail
          missing=0
          for f in Dockerfile docker-compose.yml docker-compose.apps.yml apps/customer/Dockerfile; do
            if [ ! -f "$f" ]; then
              echo "::error::deployment unit incomplete — $f is missing"
              missing=1
            fi
          done
          # The compose files bind-mount these host paths; a deploy that ships the
          # compose files and forgets them starts Postgres with no init scripts.
          for d in tooling/infra/postgres-init tooling/infra/grafana; do
            if [ ! -d "$d" ]; then
              echo "::error::deployment unit incomplete — $d is missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: Resolve the commit under deploy
        id: resolve
        run: |
          set -euo pipefail
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "deploying $GITHUB_SHA"

  image:
    name: Build and publish the deployment unit
    needs: preflight
    runs-on: ubuntu-latest
    # Skipped entirely when a digest was supplied — that is the ADR's rollback
    # ("rollback is redeploy previous image tag"). Rebuilding to roll back would
    # mean the thing you roll back to is a fresh build of old source, which is
    # not the artefact that was running.
    if: github.event.inputs.image_digest == ''
    permissions:
      # `packages: write` lives ON THIS JOB and nowhere else, and this job holds
      # no staging credential of any kind. That split is the point: the job that
      # can publish an image cannot reach the host, and the job that can reach
      # the host cannot publish an image. A compromised build step gets a
      # registry it can already read on a public repo, and no ssh key.
      contents: read
      packages: write
    outputs:
      app: ${{ steps.build.outputs.app }}
      shell: ${{ steps.build.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      # `secrets.GITHUB_TOKEN` is the run's own short-lived token, scoped by the
      # `permissions:` block above and revoked when the job ends. It is not a
      # stored credential and there is nothing for the owner to provision.
      # EVERY `${{ }}` VALUE IS BOUND TO AN ENV VAR, NOT INTERPOLATED INTO THE
      # SCRIPT — here and in every other step of this workflow. `${{ }}` is
      # substituted as TEXT before the shell ever sees the script, so a value
      # containing `"; curl …` becomes a command rather than a string. `actor`
      # and `repository` are constrained by GitHub and are not the dangerous
      # ones; the habit is what keeps the dangerous ones safe, and it means the
      # threat model can make one claim about the whole file instead of eleven.
      - name: Log in to the GitHub container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      # Two images, because the deployment unit is two images: the monorepo
      # runtime that every service and both apps share, and the customer site
      # (React, apps/customer, its own Dockerfile and nginx runtime stage).
      #
      # The customer site is still tagged and composed as `vendor-shell` because
      # that is the slot name docker-compose.apps.yml and fleet-tip-image.mjs
      # pin. The legacy Vue site that used to be built into this slot
      # (vendor/upstream-exchange/05_Web_Front) was retired 2026-10-13 by
      # Nitro's decision and is no longer built here; see its RETIRED.md.
      #
      # Tagged by commit SHA, and the DIGEST is what gets handed to the deploy
      # job. A tag can be moved to different bytes after review; a digest is the
      # bytes. `ghcr.io/<owner>/<repo>/...` is derived from `github.repository`
      # rather than written down, so no registry path is invented here — and
      # lowercased, because a repository name may contain capitals and a registry
      # reference may not.
      - name: Build and push, by digest
        id: build
        env:
          IMAGE_REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          repo=$(printf '%s' "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')
          sha="$DEPLOY_SHA"

          app_ref="ghcr.io/${repo}/app:${sha}"
          shell_ref="ghcr.io/${repo}/vendor-shell:${sha}"

          docker buildx build \
            --file Dockerfile \
            --target runtime \
            --tag "$app_ref" \
            --push \
            .
          docker buildx build \
            --file apps/customer/Dockerfile \
            --target runtime \
            --tag "$shell_ref" \
            --push \
            .

          app_digest=$(docker buildx imagetools inspect "$app_ref" --format '{{.Manifest.Digest}}')
          shell_digest=$(docker buildx imagetools inspect "$shell_ref" --format '{{.Manifest.Digest}}')

          echo "app=${app_digest}" >> "$GITHUB_OUTPUT"
          echo "shell=${shell_digest}" >> "$GITHUB_OUTPUT"
          echo "app image    ${app_ref}@${app_digest}"
          echo "shell image  ${shell_ref}@${shell_digest}"

  deploy:
    name: Deploy to staging
    needs: [preflight, image]
    # `always()` so a skipped `image` job (the rollback path) does not skip this
    # one by dependency, while an actually failed build still stops the deploy.
    if: |
      always()
      && needs.preflight.result == 'success'
      && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-latest

    # THE ATTENDED GATE. Required reviewers, wait timer and deployment branch
    # rules are attached HERE, by the owner, in repository settings — a workflow
    # file cannot grant itself an exemption from them. This is also the only
    # scope the four transport secrets below should ever be stored in:
    # environment secrets, not repository secrets, so a job that does not name
    # this environment cannot read them.
    environment: staging

    # ADR fail-closed policy switch (D26-P3-01). Named here so a later edit
    # that sets APP_ENV=dev on this job is a one-line diff against law, not a
    # silent string buried in the remote script. The step below still asserts
    # the value before ssh, and the remote script asserts it again.
    env:
      APP_ENV: staging

    permissions:
      # Read, and nothing else. Note what is NOT here and cannot be added by
      # accident: no `packages: write` (this job publishes nothing), no
      # `contents: write` (a deploy must never be able to push a commit or move
      # a tag), no `id-token: write` (no OIDC identity is minted here), no
      # `deployments: write`, no `actions: write` — a token that can rewrite
      # workflows can make the next deploy do anything at all.
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: APP_ENV is staging (fail-closed)
        run: |
          set -euo pipefail
          if [ "${APP_ENV}" != "staging" ]; then
            echo "::error::APP_ENV must be staging (ADR 2026-08-08 fail-closed). Got '${APP_ENV:-unset}'"
            exit 1
          fi
          echo "APP_ENV=staging"

      # FAIL LOUDLY ON A MISSING SECRET — never skip, never default.
      #
      # An unset secret in GitHub Actions expands to the empty string. Without
      # this step `ssh -i ''` would fail somewhere further down with a message
      # about a key file, and a `docker compose up` that reached the host with
      # half its inputs blank would bring up a partial stack. So the run stops
      # here, before the transport, naming the variable.
      #
      # `-z` on the value, and only the NAME is ever printed. There is no `:-`
      # fallback anywhere in this file: a deploy that invents a default for a
      # credential is a deploy against something other than what you meant.
      - name: Required secrets are present
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY STAGING_SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::required environment secret $name is not set on the staging environment"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Owner action, Class X2: docs/adr/2026-08-08-staging-deploy-path.md — real staging credentials are not an agent's to create."
            exit 1
          fi
          echo "all four transport secrets are present"

      - name: Resolve the digests under deploy
        id: digests
        env:
          SUPPLIED: ${{ github.event.inputs.image_digest }}
          BUILT_APP: ${{ needs.image.outputs.app }}
          BUILT_SHELL: ${{ needs.image.outputs.shell }}
        run: |
          set -euo pipefail
          if [ -n "$SUPPLIED" ]; then
            # Rollback path. Constrain the shape: this string is interpolated
            # into a shell command on a remote host, so it is validated as a
            # digest and nothing else.
            if ! printf '%s' "$SUPPLIED" | grep -qE '^sha256:[0-9a-f]{64}$'; then
              echo "::error::image_digest must be sha256: followed by 64 hex characters"
              exit 1
            fi
            echo "app=$SUPPLIED" >> "$GITHUB_OUTPUT"
            # ROLLBACK IS APP-IMAGE ONLY, ON PURPOSE — see the threat model,
            # "partial failure". One input cannot name two images, and guessing
            # the matching customer-site digest is how you get a site and an API from
            # different commits talking to each other.
            echo "shell=" >> "$GITHUB_OUTPUT"
            echo "::warning::rollback path: redeploying app digest $SUPPLIED; the customer site image is left as it is"
          else
            for pair in "app:$BUILT_APP" "shell:$BUILT_SHELL"; do
              value="${pair#*:}"
              if ! printf '%s' "$value" | grep -qE '^sha256:[0-9a-f]{64}$'; then
                echo "::error::the build job did not produce a usable digest for ${pair%%:*}"
                exit 1
              fi
            done
            echo "app=$BUILT_APP" >> "$GITHUB_OUTPUT"
            echo "shell=$BUILT_SHELL" >> "$GITHUB_OUTPUT"
          fi

      # KNOWN_HOSTS IS REQUIRED, AND THERE IS NO StrictHostKeyChecking=no HERE.
      #
      # `-o StrictHostKeyChecking=no` is what every deploy snippet on the
      # internet does, and it means the first machine that answers on that
      # address gets handed the private key and the deploy. That is a
      # man-in-the-middle with no detection, which is why the host key is a
      # required secret above and not a convenience.
      #
      # 0600 on the key, and it is written under RUNNER_TEMP rather than the
      # workspace so it cannot be picked up by a later step that archives or
      # uploads the checkout.
      - name: Configure the ssh transport
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id" "$RUNNER_TEMP/ssh/known_hosts"
          echo "transport configured"

      # Ship the compose files and the paths they bind-mount. Not the whole
      # checkout: the images already carry the application, and rsyncing the
      # repository onto a host is how a stale file ends up authoritative.
      #
      # `tooling/infra` is not optional decoration — docker-compose.yml
      # bind-mounts postgres-init, the otel collector config, tempo, prometheus
      # and the grafana provisioning tree from paths relative to the compose
      # file. Omit it and Postgres comes up with no service schemas.
      - name: Send the deployment unit
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_opts="-i $RUNNER_TEMP/ssh/id -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes"
          # shellcheck disable=SC2086
          ssh $ssh_opts "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'set -eu; mkdir -p "$HOME/intafaced-staging"'
          rsync -az --delete \
            -e "ssh $ssh_opts" \
            docker-compose.yml docker-compose.apps.yml \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:intafaced-staging/"
          rsync -az --delete \
            -e "ssh $ssh_opts" \
            tooling/infra \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:intafaced-staging/tooling/"
          echo "deployment unit sent"

      # THE DEPLOY ITSELF.
      #
      # Read the ordering here as a control, because it is one. `docker-compose.apps.yml`
      # names `intafaced/app:dev` — an UNQUALIFIED reference, which docker
      # resolves against Docker Hub. If that tag is absent locally when
      # `compose up` runs, compose will go and fetch `docker.io/intafaced/app:dev`
      # from whoever has registered that name. Pulling the digest and retagging
      # it BEFORE `up` is what makes the tag never missing, and the
      # `image inspect` assertion is what proves it rather than hoping. `up` is
      # then given `--no-build` so a missing image can never become a silent
      # rebuild from whatever is on the host's disk.
      #
      # `APP_ENV=staging` is exported into the remote shell, where compose gives
      # it precedence over the host's `.env`. That is the ADR's fail-closed
      # policy switch — sanctions screening and pay-rail sandbox rules that
      # refuse to boot without their blocklists stay enforced, and "set APP_ENV=dev
      # to make it boot" is not reachable from this workflow.
      #
      # NOTE THE SECRETS THAT ARE NOT HERE. The fleet's own runtime secrets —
      # EDGE_PRINCIPAL_SECRET, INTERNAL_SERVICE_SECRET, the database password,
      # every pay-rail key — are NOT passed by this workflow and are not GitHub
      # secrets. They live in an owner-provisioned `.env` on the host, and the
      # compose file's `${VAR:?}` guards already refuse to start the fleet
      # without them. So this workflow holds four transport credentials and not
      # one credential that can move value. Doctrine §9 prefers a vault; the ADR
      # permits Actions secrets for staging as a named deviation, and keeping the
      # deviation down to the transport is the smallest form that deviation can
      # take.
      - name: Pull, verify and start
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          APP_DIGEST: ${{ steps.digests.outputs.app }}
          SHELL_DIGEST: ${{ steps.digests.outputs.shell }}
          IMAGE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${APP_ENV}" != "staging" ]; then
            echo "::error::APP_ENV must be staging (ADR 2026-08-08 fail-closed). Got '${APP_ENV:-unset}'"
            exit 1
          fi
          ssh_opts="-i $RUNNER_TEMP/ssh/id -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes"
          repo=$(printf '%s' "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')

          # shellcheck disable=SC2086
          ssh $ssh_opts "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "APP_ENV='$APP_ENV' REPO='$repo' APP_DIGEST='$APP_DIGEST' SHELL_DIGEST='$SHELL_DIGEST' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/intafaced-staging"

          command -v docker >/dev/null || { echo "docker is not installed on the staging host"; exit 1; }
          docker compose version >/dev/null || { echo "docker compose v2 is not available on the staging host"; exit 1; }

          echo "── pulling by digest"
          docker pull "ghcr.io/${REPO}/app@${APP_DIGEST}"
          docker tag  "ghcr.io/${REPO}/app@${APP_DIGEST}" intafaced/app:dev
          if [ -n "${SHELL_DIGEST}" ]; then
            docker pull "ghcr.io/${REPO}/vendor-shell@${SHELL_DIGEST}"
            docker tag  "ghcr.io/${REPO}/vendor-shell@${SHELL_DIGEST}" intafaced/vendor-shell:dev
          fi

          echo "── proving the local tags are the digests we pulled"
          got=$(docker image inspect intafaced/app:dev --format '{{index .RepoDigests 0}}')
          case "$got" in
            *"${APP_DIGEST}") echo "intafaced/app:dev == ${APP_DIGEST}" ;;
            *) echo "intafaced/app:dev resolves to $got, not ${APP_DIGEST} — refusing to start"; exit 1 ;;
          esac

          echo "── APP_ENV must be staging"
          # Compose gives the SHELL environment precedence over the `.env` file,
          # so exporting APP_ENV here wins over whatever the host's `.env` says.
          # That is the ADR's fail-closed switch, and this asserts it arrived.
          #
          # AND WE DELIBERATELY DO NOT RUN `docker compose config` TO DOUBLE-CHECK
          # IT. That command renders the FULLY RESOLVED fleet configuration —
          # every interpolated `${VAR}`, which on a real staging host means the
          # edge secret, the internal service secret, the database password and
          # every pay-rail key. Rendering that inside a CI-driven session, one
          # stray `echo` or `set -x` away from the job log, is precisely the
          # env-dump disclosure this workflow's threat model spends a section on.
          # A confirmation worth having is not worth materialising every secret
          # in the fleet to get.
          [ "${APP_ENV}" = "staging" ] || { echo "APP_ENV is ${APP_ENV}, not staging"; exit 1; }

          echo "── INTERNAL_SERVICE_BODY_BIND is require"
          # APP_ENV=staging is production posture, and in production posture
          # every service holding INTERNAL_SERVICE_SECRET refuses to boot unless
          # INTERNAL_SERVICE_BODY_BIND=require (config.s2s_body_bind_not_required).
          # The compose file defaults it to accept-both for local dev, so a host
          # `.env` without the line would crash-loop the fleet. Forced from the
          # shell for the same reason as APP_ENV: the posture is the workflow's
          # to set, not the host's to forget. `require` is the only value a
          # production-posture fleet will start with, so there is nothing to choose.
          export INTERNAL_SERVICE_BODY_BIND=require

          echo "── up"
          APP_ENV=staging docker compose -f docker-compose.apps.yml up -d --no-build --remove-orphans

          printf '%s %s\n' "$(date -u +%FT%TZ)" "${APP_DIGEST}" >> DEPLOYED
          REMOTE

      # HEALTH IS ASSERTED, NOT ASSUMED. `compose up -d` returns as soon as the
      # containers are created; it does not wait for a service to answer. A
      # deploy that reports success on container creation is the "route exists"
      # failure this repo has a doctrine section about.
      #
      # Read via `docker inspect --format` over `compose ps -q`, not
      # `compose ps --format '{{…}}'`. Compose v2 only promises `table` and
      # `json` for `ps --format`, and `json` would need `jq` on the staging host,
      # which is not something this workflow gets to assume. `docker inspect`
      # takes a Go template on every version anyone has, and it also exposes the
      # exit code — which `migrate` needs, because that container is SUPPOSED to
      # exit, and it is supposed to exit ZERO. A migration that failed and left
      # the fleet waiting is the single most important thing for this step to
      # catch, and "exited" alone cannot tell the two apart.
      #
      # A container that refuses to boot (a config guard exiting 1) is put back
      # by `restart: unless-stopped`, so it shows as `restarting` or `running`
      # between attempts and never reaches `exited`. Three restarts counts as a
      # crash loop and fails the step at once, instead of waiting out the full
      # timeout. Container logs are NOT printed: this repository's Actions logs
      # are public (threat model §4), and a boot error can echo config. Read
      # them on the host with `docker compose -f docker-compose.apps.yml logs`.
      - name: Every container is healthy
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_opts="-i $RUNNER_TEMP/ssh/id -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes"
          # APP_ENV is passed in because docker-compose.apps.yml has no default for it
          # (#4610): even `compose ps` refuses to run without it.
          # shellcheck disable=SC2086
          ssh $ssh_opts "$STAGING_SSH_USER@$STAGING_SSH_HOST" "APP_ENV='$APP_ENV' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/intafaced-staging"

          report() {
            for id in $(docker compose -f docker-compose.apps.yml ps -aq); do
              docker inspect "$id" --format \
                '{{.Name}} restarts={{.RestartCount}} status={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'
            done
          }

          for _ in $(seq 1 60); do
            pending=0
            broken=''
            while read -r line; do
              [ -n "$line" ] || continue
              case "$line" in
                *' restarts='[3-9]' '*|*' restarts='[1-9][0-9]*) broken="${broken}${line}"$'\n' ;;
                *' status=running '*' health=healthy') ;;
                *' status=running '*' health=none') ;;
                *' status=exited exit=0 '*) ;;
                *' health=starting') pending=1 ;;
                *' status=created '*|*' status=restarting '*) pending=1 ;;
                *) broken="${broken}${line}"$'\n' ;;
              esac
            done <<< "$(report)"

            if [ -z "$broken" ] && [ "$pending" -eq 0 ]; then
              echo "fleet healthy"
              report
              exit 0
            fi
            if [ -n "$broken" ]; then
              echo "containers in a terminal bad state:"
              printf '%s' "$broken"
              report
              exit 1
            fi
            sleep 10
          done

          echo "fleet did not become healthy within the timeout"
          report
          exit 1
          REMOTE

      # NO AUTOMATIC ROLLBACK, AND THIS IS THE MOST DELIBERATE DECISION IN THE
      # FILE. The `migrate` service runs every service's `db:migrate` and the
      # rest of the fleet waits on `service_completed_successfully`, so by the
      # time a service can fail to come up, THE SCHEMA HAS ALREADY MOVED.
      # Re-pointing the containers at the previous image does not un-apply a
      # migration; it runs last week's code against this week's schema, which is
      # a worse state than the failure and a much quieter one.
      #
      # So on failure this job stops, says so, and leaves the stack exactly where
      # it stopped for a human to read. Rollback stays a deliberate re-dispatch
      # with `image_digest`, by someone who has decided the schema tolerates it.
      # Full reasoning: docs/THREAT-MODEL-STAGING-DEPLOY.md, "partial failure".
      - name: On failure, stop and say so
        if: failure()
        run: |
          echo "::error::staging deploy failed. NOTHING was rolled back automatically — migrations may already be applied, and redeploying an older image would run older code against the newer schema. Read the job log, then decide. Runbook: docs/THREAT-MODEL-STAGING-DEPLOY.md"

      # `always()` so the key does not survive a failure. The runner is destroyed
      # after the job in any case; this is for the case where it is not.
      - name: Destroy the transport credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ssh" || true
