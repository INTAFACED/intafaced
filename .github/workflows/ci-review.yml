name: CI review

# The independent review AGENTS.md, "Where a mistake costs more" requires for money, security, gate-file and look-baseline
# changes: every push to an in-repo pull request gets one review of its exact head, by the pinned reviewer CLI with no
# tools, against tooling/ci/ci-review/REVIEW.md. The seal (tooling/ci/review-marker.mjs ciReviewVerdict) accepts only
# this file's job `CI review` passing its step `Verdict` on the exact head, in a run started by pull_request_target, so
# GitHub always runs the default branch's copy of this file, of the brief and of the scripts, never the pull request's.
# A comment or a commit status counts for nothing. (Failure it prevents: #7078 merged 12 minutes before its review,
# OWNER 154 (a); and the PASS comment came from the one login every agent shares.)
#
# Nothing here checks out, builds or runs code from the pull request: ci-review.mjs reads its diff through the compare
# API at the event's base and head shas. The review key lives only in the `ci-review` environment, whose deployment
# branch rule allows main alone, so only this default-branch workflow can read it; a pull request from a fork gets no
# run (the key is never spent on one), so such a change can't be sealed and a member re-opens it from a branch here.
#
# Only pull requests into main are reviewed (`branches: [main]`), and a pull request pointed at main from another base
# (`edited` with a base change) is reviewed afresh: a review against a side branch saw another diff, and the seal
# counts only a run whose pull request's base is main (review-marker.mjs ciReviewVerdict).
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

# One review per head. A newer push gets its own group, so it neither waits for nor cancels an older head's review.
concurrency:
  group: ci-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    # The seal reads this job by name (REVIEW_JOB) and its steps `Verdict` and `Test verdict` by name (VERDICT_STEP,
    # TEST_VERDICT_STEP): rename them together.
    name: CI review
    # In-repo pull requests into main only; of `edited` events, only a base change (a title or body edit needs no review).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-24.04
    # Healthy run: a few minutes, under 10 with the test part; a shared-harness change sends up to 1.5 MB, and the seal
    # re-run below waits up to 4 minutes for a running seal.
    timeout-minutes: 30
    environment: ci-review
    # The two pinned models. The review is judgment on every change: Opus (every INTAFACED thread runs Opus, OWNER 56),
    # at medium (OWNER 259 (3), the owner's "Drop to medium"). The test part asks the proof reader's question, so it runs
    # on the readers' model (project-state AGENTS.md: proof v2 readers run claude-sonnet-5-5) at medium, until [Based 10]
    # reports its Opus-or-Sonnet measurement on project-state #1781: switching it is this one line.
    env:
      REVIEW_MODEL: claude-opus-5-5
      REVIEW_EFFORT: medium
      READER_MODEL: claude-sonnet-5-5
      READER_EFFORT: medium
    permissions:
      contents: read # the default branch's checkout, the compare diff, and the base and head as text for the test part
      checks: read # find the seal's check run on the head
      actions: write # re-run a red seal once the review passes; read this run's tree index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      # The tree index the seal reads (review-marker.mjs readReviewRuns): an artifact named by this head's tree sha, so
      # a FAIL is found when the same code comes back on another branch without listing every run of this workflow (a
      # list GitHub cuts at 1,000; #7132 finding 2). Before the review: a run that can't index its head fails before any
      # verdict. A re-run attempt keeps its run's first index rather than replacing it.
      - name: Index this head's tree
        id: index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/ci-review.mjs index "$RUNNER_TEMP/index"
      - name: Upload the tree index
        if: steps.index.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.index.outputs.name }}
          path: ${{ runner.temp }}/index/index.json
          if-no-files-found: error
          # Kept for the repository's retention setting (the default, which is also its longest); an earlier attempt's
          # index is replaced only once it has expired.
          overwrite: ${{ steps.index.outputs.expired == 'true' }}

      # The review's input and its test part's (U4, project-state #1574: "Fold the AI test judge into the one CI review,
      # so a PR has one AI judge"). The test part (tooling/ci/test-judge.mjs, its brief tooling/ci/test-judge/JUDGE.md)
      # applies to a pull request whose title claims journey steps or that changes a journey test or the shared code
      # journey tests run on: it asks the proof reader's question of each claimed or changed step, and of each shared
      # change whether it weakens what the tests observe; it decides alone when nothing needs reading (PASS) or the change
      # is too large (FAIL), else the `Read the steps` call answers it. (Failure it prevents: a WEAK found only by a read
      # started by hand hours after the merge, or never: 4 of 10 merged builder PRs, 8-9 Nov; project-state #1906.) The
      # step words are private: read from project-state with PROJECT_STATE_READ_TOKEN (read-only, that repository only,
      # and only when a step needs reading), written only to the prompt file, and never printed. The pull request's code
      # is read as text (the compare API and two shallow fetches of its base and head), never checked out or run. A
      # changed look baseline's PNGs, which the text diff shows only as "Binary files differ", are read as blobs at the
      # same base and head and given to the review as images (ci-review.mjs collectBaselineImages; project-state #1819);
      # past any of its caps, none are.
      - name: Read the diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_STATE_READ_TOKEN: ${{ secrets.PROJECT_STATE_READ_TOKEN }}
        run: node tooling/ci/ci-review.mjs diff "$RUNNER_TEMP/review"

      # The reviewer CLI at the version and tarball hashes in .github/workflows/ci-review/package-lock.json (npm ci refuses any
      # other bytes), installed outside the checkout so the repository's .npmrc and workspace play no part.
      - name: Install the pinned reviewer
        run: |
          mkdir -p "$RUNNER_TEMP/reviewer"
          cp .github/workflows/ci-review/package.json .github/workflows/ci-review/package-lock.json "$RUNNER_TEMP/reviewer/"
          npm ci --prefix "$RUNNER_TEMP/reviewer" --no-audit --no-fund

      # No tools, no settings, no MCP servers and no session kept: the reviewer reads the prompt (the brief, then the
      # diff fenced as untrusted data, and a changed look baseline's old and new images when the diff step attached them)
      # and answers in the schema. Run in an empty folder, so no CLAUDE.md is loaded. The key is in this step's
      # environment only. The model and effort are pinned (REVIEW_MODEL, REVIEW_EFFORT above), so the judge can't change
      # with the account's default.
      - name: Review
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/review"
          if [ -f "$dir/skip-reviewer" ]; then
            echo "the diff step already decided (too large to review whole)"
            exec node "$GITHUB_WORKSPACE/tooling/ci/ci-review.mjs" read "$dir"
          fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::the ci-review environment has no CLAUDE_CODE_OAUTH_TOKEN secret, so no review runs and nothing is decided"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/empty" && cd "$RUNNER_TEMP/empty"
          schema="$(cat "$dir/schema.json")"
          if [ -f "$dir/input.jsonl" ]; then
            # Look-baseline images go with the prompt (ci-review.mjs streamInput): the same call, its input one stream
            # message, its answer a stream whose one `result` line the read step takes (readStreamOutput).
            "$RUNNER_TEMP/reviewer/node_modules/.bin/claude" -p \
              --model "$REVIEW_MODEL" --effort "$REVIEW_EFFORT" \
              --tools "" --setting-sources "" --strict-mcp-config --mcp-config '{"mcpServers":{}}' \
              --no-session-persistence --input-format stream-json --output-format stream-json --verbose \
              --json-schema "$schema" \
              < "$dir/input.jsonl" > "$dir/answer.jsonl"
          else
            "$RUNNER_TEMP/reviewer/node_modules/.bin/claude" -p \
              --model "$REVIEW_MODEL" --effort "$REVIEW_EFFORT" \
              --tools "" --setting-sources "" --strict-mcp-config --mcp-config '{"mcpServers":{}}' \
              --no-session-persistence --output-format json --json-schema "$schema" \
              "Review the pull request in the input against the brief at its top. Answer with the structured verdict only." \
              < "$dir/prompt.txt" > "$dir/answer.json"
          fi
          node "$GITHUB_WORKSPACE/tooling/ci/ci-review.mjs" read "$dir"

      # The test part's own call (test-judge.mjs, its brief tooling/ci/test-judge/JUDGE.md): the proof reader's question
      # (project-state tooling/proof-v2/READER.md step 3) of each step the title claims or whose own test changed, and
      # whether a shared change weakens what the tests observe; then, when the count needs one (a money step or its 15%
      # sample), a second, blind reader in a call of its own that never sees the first's answer. The same flags as the
      # review's call, on READER_MODEL. Nothing to read (skip-judge): no call.
      - name: Read the steps
        id: reads
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/review/tests"
          if [ ! -f "$dir/skip-judge" ]; then
            if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
              echo "::error::the ci-review environment has no CLAUDE_CODE_OAUTH_TOKEN secret, so no read runs and nothing is decided"
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/empty" && cd "$RUNNER_TEMP/empty"
            for d in "$dir" "$dir/second"; do
              [ -f "$d/prompt.txt" ] || continue
              "$RUNNER_TEMP/reviewer/node_modules/.bin/claude" -p \
                --model "$READER_MODEL" --effort "$READER_EFFORT" \
                --tools "" --setting-sources "" --strict-mcp-config --mcp-config '{"mcpServers":{}}' \
                --no-session-persistence --output-format json --json-schema "$(cat "$d/schema.json")" \
                "Read the steps in the input against the brief at its top. Answer with the structured verdict only." \
                < "$d/prompt.txt" > "$d/answer.json"
            done
          fi
          node "$GITHUB_WORKSPACE/tooling/ci/test-judge.mjs" read "$dir"

      # The step the seal reads for gate files and look baselines: it fails only on a well-formed FAIL of the review
      # part, which then stands for this head and its code.
      - name: Verdict
        id: verdict
        run: node tooling/ci/ci-review.mjs judge "$RUNNER_TEMP/review"

      # The step the seal reads for journey tests and shared test code (review-marker.mjs JUDGE_CHECK): the test part's
      # verdict, PASS when nothing needed reading. It runs whatever the review part said, so a review FAIL on a
      # test-only change blocks nothing it didn't before, and its FAIL stands for this head and its code.
      - name: Test verdict
        id: tests
        if: ${{ !cancelled() && steps.reads.outcome == 'success' }}
        run: node tooling/ci/test-judge.mjs judge "$RUNNER_TEMP/review/tests"

      # The step reads as the count of record's v2 read of this head (test-judge.mjs writeRead): step ids, verdicts and
      # notes, never the step words (a public repository's artifact). project-state's scheduled store takes the one at a
      # merged PR's final head and carries it to the merge only if that step's test reached main unchanged
      # (carry-read.mjs), so no builder starts a read by hand. A WEAK read is uploaded too: it is a true read.
      - name: Upload the step reads
        if: ${{ !cancelled() && steps.reads.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-v2-read-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/review/tests/read.json
            ${{ runner.temp }}/review/tests/read-second.json
          if-no-files-found: ignore
          overwrite: true

      # Best effort, after the verdicts, once either part passed: the seal counts a pass only in a job that concluded
      # success or failed only in its other verdict step (review-marker.mjs), so this step's own failure must not fail
      # the job. (Failure it prevents: a review that finishes while the seal is already polling waits here up to 4
      # minutes for the seal, which waits for this job; the step threw, the job ended failure, and the PASS was lost
      # until a fresh review. Found by /code-review on #7132, finding 1.)
      - name: Re-run a red seal on this head
        if: ${{ !cancelled() && (steps.verdict.outcome == 'success' || steps.tests.outcome == 'success') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/ci-review.mjs rerun-seal
