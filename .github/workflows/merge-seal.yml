name: CI merge seal

# The required `CI merge seal` check (R3 C3 piece 2, OWNER 242). It runs on pull_request_target, so this file and every
# script it runs are the default branch's: a pull request can't change, drop or replace the check that judges it. It never
# checks out, builds or runs a pull request's code; it reads the pull request, and the runs on its head, through the API.
#
# ci.yml keeps a job that judges CI's own jobs, named `CI merge seal` only on a merge queue's commit, which
# pull_request_target never reaches; on a pull request it is `CI jobs`, so it never answers for this check. Every Actions
# job named `CI merge seal` on a head must pass (probe #7547: a red one blocked the merge though a green one finished
# after it).
#
# One verdict per head, once its inputs have finished (INTAFACED/project-state#1574, 9 Nov 2026). A push, open, reopen,
# edit or arming starts a run whose first attempt asks whether to seal now (the `now` job). Usually it waits: the seal
# job is skipped, the head holds no `CI merge seal` check, and a missing required check blocks the merge. Each input
# (CI, the CI review, the journeys run the change needs) ends with a `Start the seal` job (journey-seal.mjs --recheck,
# START_JOB); the one that finds every input finished re-runs this run, and that attempt is the verdict. A change that
# could pass a seal job of its own while this one waits (one that touches .github/, sealNow) seals at once, as before.
# Before this the seal was red from every push until a re-run: 375 of 510 runs ended red in the 24 h to 10:00 UTC on
# 9 Nov, and one run reached 7 attempts.
# One seal run per head gives the verdicts, the push's (INTAFACED/project-state#2065 d32 part 5a): an edit of the title or
# body and an arming run only the `relay` job, which re-runs or starts the push run's seal (journey-seal.mjs relayStep),
# so one trigger is one verdict, not one per seal run on the head.
# An older red verdict left on the head (a reopen, or an edit sealed in its own run) is re-run in place by the green verdict after it (the seal
# job's last step, journey-seal.mjs --clear-older), and by the factory switch on a flip.
on:
  pull_request_target:
    branches: [main]
    # `edited`: a pull request retargeted to main gets this seal too (review 7552-R1). An edit, like a push, asks whether
    # to seal now; when a verdict is already on the head it seals at once, so an earlier green never stands for the new
    # title or body (CI review on e1ba6699). Fails closed: a missing seal blocks, and a running one does too.
    # `auto_merge_enabled`: an input's `Start the seal` job touches only armed pull requests (journey-seal.mjs armed), so
    # one armed after its inputs finished is sealed here, at once when they have.
    types: [opened, synchronize, reopened, edited, auto_merge_enabled]

permissions: {}

# One group per pull request (INTAFACED/project-state#1574 item 2; the OG at 03:13 UTC on 9 Nov 2026: on one head the
# seal piled up 2 or 3 queued runs per pull request while its group was per run). In that group:
#   - a push (`synchronize`) or an open (`opened`) cancels the run there, which is an older head's: every `synchronize`
#     is a new head and `opened` the first run. That seal's verdict is on a head nobody can merge, so nobody reads it;
#   - an edit or a reopen never cancels (cancel-in-progress false): it runs on the head being merged, and a running seal
#     cancelled there is a red required check that blocks it until re-run (every `CI merge seal` on a head must pass,
#     probe #7547; pr-checks.yml dropped `edited` for this). GitHub keeps one waiting run per group, so a newer event
#     replaces a waiting one; a replaced run never started a job, so it leaves no check run, red or green, on the head,
#     and the run that replaced it seals the same head with the newer title and body.
#   - a re-run (run_attempt above 1: an input's `Start the seal` job, a green verdict re-running an older red one, the
#     factory switch) keeps a group of its own: it is never cancelled or replaced, and re-running an old head's seal
#     never cancels the new head's. A re-run is posted only while the pull request is still on that head (journey-seal.mjs
#     rerunBlocker), and re-running the newest seal and then an older red one on one head cancels neither.
#   - an arming (`auto_merge_enabled`) keeps a group of its own too, like an edit: it never replaces a waiting push.
# Main is never touched: this runs on pull requests only. workflow-concurrency.test.mjs holds this.
concurrency:
  # An edit that is not a retarget, or an arming, keeps a group of its own: in the pull request's group it could replace
  # a waiting push's seal and leave the new head with none.
  group: ${{ github.run_attempt == '1' && ((github.event.action != 'edited' && github.event.action != 'auto_merge_enabled') || github.event.changes.base) && format('merge-seal-pr-{0}', github.event.pull_request.number) || format('merge-seal-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.run_attempt == '1' && (github.event.action == 'synchronize' || github.event.action == 'opened') }}

jobs:
  # One verdict once the seal's inputs have finished (journey-seal.mjs sealNow; INTAFACED/project-state#1574). A first
  # attempt asks whether to seal now; when it waits, the seal job below is skipped and the `Start the seal` job of the
  # last input to finish (CI, the CI review, the journeys the change needs) re-runs this run. It seals now when something
  # could pass a seal of its own while this one waits (sealNow). Any error here fails this job, and the seal then runs at once.
  now:
    name: Does the seal wait for its inputs
    if: github.run_attempt == '1' && !(github.event.action == 'auto_merge_enabled' || (github.event.action == 'edited' && !github.event.changes.base))
    runs-on: ubuntu-latest
    timeout-minutes: 5 # healthy run: seconds
    permissions:
      contents: read # the default branch's scripts, and ci.yml at the head
      actions: read # the input runs on the head
      pull-requests: read # the changed files and the title
    outputs:
      now: ${{ steps.now.outputs.now }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Seal now, or wait for the inputs
        id: now
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tooling/ci/journey-seal.mjs --seal-now
  # An edit of the title or body, or an arming, gives no verdict in a run of its own: this job passes it to the head's
  # push run (journey-seal.mjs relayStep, RELAY_JOB; INTAFACED/project-state#2065 d32 part 5a: one verdict per finished
  # input, not one per seal run on the head). After a verdict an edit re-runs that run's seal, which judges the title and body as they are now; with no
  # verdict yet the push's run is started once every input has finished, or left to the last input's end. Every head so
  # keeps one seal run with verdicts, and one trigger gives one verdict. This run seals itself (`here`) when there is no
  # push's run to pass it to, or that seal is judging now and may have read the old title; and on any error here.
  relay:
    name: Pass an edit or an arming to this head's seal
    if: github.run_attempt == '1' && (github.event.action == 'auto_merge_enabled' || (github.event.action == 'edited' && !github.event.changes.base))
    runs-on: ubuntu-latest
    timeout-minutes: 5 # healthy run: seconds
    permissions:
      contents: read # the default branch's scripts
      actions: write # read the seal runs on the head; re-run or start the push run's seal
      pull-requests: read # the pull request, its changed files and title
    outputs:
      here: ${{ steps.relay.outputs.here }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Pass it to the push's seal, or seal here
        id: relay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          ACTION: ${{ github.event.action }}
        run: node tooling/ci/journey-seal.mjs --relay
  seal:
    # `CI merge seal` whenever the job runs. A skipped job counts as passing a required check (review 7552-R6), so its
    # name is an expression: GitHub names a skipped job's check run with the expression's raw text, never `CI merge seal`
    # (probe intafaced#7679, 9 Nov 2026), and a re-run attempt is named by the expression's value. So a waiting seal is
    # no check at all, and a missing required check blocks the merge.
    name: ${{ (github.run_attempt != '1' || (needs.relay.result == 'skipped' && (needs.now.result != 'success' || needs.now.outputs.now == 'true')) || (needs.relay.result != 'skipped' && (needs.relay.result != 'success' || needs.relay.outputs.here == 'true'))) && 'CI merge seal' || 'CI merge seal waits for CI, the CI review and the journeys it needs' }}
    needs: [now, relay]
    if: ${{ !cancelled() && (github.run_attempt != '1' || (needs.relay.result == 'skipped' && (needs.now.result != 'success' || needs.now.outputs.now == 'true')) || (needs.relay.result != 'skipped' && (needs.relay.result != 'success' || needs.relay.outputs.here == 'true'))) }}
    runs-on: ubuntu-latest
    # healthy run: seconds once its inputs have finished; up to 60 minutes waiting for them, checking every 5 (journey-seal.mjs WAIT_POLLS)
    # and up to 20 more for the CI review (tooling/ci/review-marker.mjs)
    timeout-minutes: 85
    permissions:
      contents: read # the default branch's scripts
      actions: write # CI's, the CI review's and the journeys' runs and jobs on the head; re-run an older red seal here
      pull-requests: read # the changed files, title and body
      issues: read # the regression issues the journeys baseline names
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # While CI, the CI review or the journeys this change needs are still going on the head, the seal waits here: a
      # running check, which blocks the merge as a missing one does, never a red that only means "not finished yet"
      # (project-state OWNER 262 part 2: "no red while waiting"). It then judges once, below. A re-check started by an
      # input's end leaves a seal still in this step alone (journey-seal.mjs WAIT_STEP, recheckStep).
      - name: Wait for CI, the CI review and the journeys this change needs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tooling/ci/journey-seal.mjs --wait-inputs
      # CI's jobs on this exact head (ci-jobs-seal.mjs): what ci.yml's seal read from `needs:`, now through the API, with
      # the default branch deciding which jobs the change needs. Red while CI is still running; re-run when it finishes.
      - name: Require CI's jobs on this exact head
        id: needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tooling/ci/ci-jobs-seal.mjs
      # Named journey steps, the journeys a change touches, and journey test naming (journey-seal.mjs). It runs when CI's
      # jobs are red too, so every verdict shows on one seal run.
      - name: Require the named journey steps on this exact head
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: node tooling/ci/journey-seal.mjs
      # The CI review (its Verdict and, for test changes, its Test verdict) on this exact head (review-marker.mjs). Only once CI's jobs are green, as before:
      # it may wait up to 20 minutes for the review.
      - name: Require the CI review on this exact head
        if: ${{ !cancelled() && steps.needed.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: node tooling/ci/review-marker.mjs
      # The factory switch (owner decision 2026-11-07, factory-switch.mjs): only `run` lets a pull request or a merge
      # queue's commit through. It runs after the other verdicts so they still show.
      - name: The factory switch says run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node tooling/ci/factory-switch.mjs
      # A green verdict re-runs each older red `CI merge seal` on this head (an edit or reopen left one), since every
      # one must pass (probe #7547); each re-run judges again what this one just judged (journey-seal.mjs clearOlderReds).
      # It runs only when every step above passed.
      - name: Re-run older red seals on this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: node tooling/ci/journey-seal.mjs --clear-older
