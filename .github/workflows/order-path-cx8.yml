# CX-8 assembled order-path proof (B-layer).
# Path-filtered + workflow_dispatch — a docs-only PR cannot change the order
# path, so running this against one proves nothing. Relevance, not cost.
name: Order-path CX-8

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tooling/scripts/order-path-smoke.mjs'
      - 'tooling/scripts/order-path-cx8-boot.mjs'
      - '.github/workflows/order-path-cx8.yml'
      - 'services/svc-trade/**'
      - 'services/svc-matching/**'
      - 'services/svc-ledger/**'
      - 'services/svc-identity/**'
      - 'packages/contracts/**'
      - 'packages/ledger-client/**'
      - 'packages/events/**'
      - 'packages/config/**'
      # Trade journeys (pnpm journeys:trade) run in the same job, after the smoke.
      - 'apps/customer/src/features/trade/**'
      - 'apps/customer/src/shared/api.ts'
      - 'apps/customer/src/screens/trade/desk/resend.ts'
      - 'apps/customer/tests/journeys/**'
      - 'apps/customer/vitest.journeys.config.ts'
      - 'packages/exchange-contract/**'
      - 'services/svc-pay/**'

concurrency:
  group: order-path-cx8-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Self-declaring non-secrets (secret-scan PLACEHOLDER_VALUES: dev-only-*)
  INTERNAL_SERVICE_SECRET: dev-only-cx8-internal-service-secret-xx
  EDGE_PRINCIPAL_SECRET: dev-only-cx8-edge-principal-secret-xxxx
  JWT_ACCESS_SECRET: dev-only-cx8-jwt-access-secret-xxxxxxxx

jobs:
  assembled:
    name: CX-8 assembled smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intafaced
          POSTGRES_PASSWORD: intafaced
          POSTGRES_DB: intafaced
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intafaced -d intafaced"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start NATS JetStream
        run: |
          docker run -d --name cx8-nats -p 4222:4222 -p 8222:8222 \
            nats:2.10-alpine --jetstream --http_port=8222 --store_dir=/data
          for i in $(seq 1 30); do
            wget -q -O- http://127.0.0.1:8222/healthz && break
            sleep 1
          done

      - name: Bootstrap schemas (same as main CI Tests)
        env:
          POSTGRES_USER: intafaced
          POSTGRES_DB: intafaced
          PGPASSWORD: intafaced
          PGHOST: 127.0.0.1
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=intafaced psql -h 127.0.0.1 -U intafaced -d intafaced \
            -f tooling/infra/postgres-init/01-service-schemas.sql
          PGPASSWORD=intafaced psql -h 127.0.0.1 -U intafaced -d intafaced -c \
            "GRANT CREATE ON DATABASE intafaced TO intafaced_ops; ALTER ROLE intafaced_ops WITH CREATEDB;" || true
          bash tooling/infra/postgres-init/02-intafaced-test-db.sh

      - name: Build packages used by money path
        run: pnpm exec turbo run build --filter=@intafaced/svc-ledger --filter=@intafaced/svc-matching --filter=@intafaced/svc-trade --filter=@intafaced/svc-identity --filter=@intafaced/contracts --filter=@intafaced/ledger-client --filter=@intafaced/events --filter=@intafaced/config --filter=@intafaced/auth --filter=@intafaced/db --filter=@intafaced/exchange-contract --filter=@intafaced/svc-pay

      # The CX-8 smoke, then the customer trade journeys on the same stack (svc-pay boots for the withdrawal journeys).
      - name: CX-8 boot + STRICT smoke + trade journeys
        run: pnpm journeys:trade
        env:
          NATS_URL: nats://127.0.0.1:4222
          TEST_DATABASE_URL: postgres://svc_ledger:svc_ledger@127.0.0.1:5432/intafaced_test
          TEST_DATABASE_URL_TRADE: postgres://svc_trade:svc_trade@127.0.0.1:5432/intafaced_test
          TEST_DATABASE_URL_IDENTITY: postgres://svc_identity:svc_identity@127.0.0.1:5432/intafaced_test
          TEST_DATABASE_URL_PAY: postgres://svc_pay:svc_pay@127.0.0.1:5432/intafaced_test
          LEDGER_DATABASE_URL: postgres://svc_ledger:svc_ledger@127.0.0.1:5432/intafaced_test
          TRADE_DATABASE_URL: postgres://svc_trade:svc_trade@127.0.0.1:5432/intafaced_test
          IDENTITY_DATABASE_URL: postgres://svc_identity:svc_identity@127.0.0.1:5432/intafaced_test
