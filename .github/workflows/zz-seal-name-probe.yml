name: Seal name probe
# Throwaway probe for INTAFACED/project-state#1574 (never merged): a job skipped on attempt 1 under a name expression,
# then re-run through the API: does attempt 2 run, under the evaluated name?
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  probe:
    name: ${{ github.run_attempt != '1' && 'Probe seal' || 'Probe seal (waits for its inputs)' }}
    if: github.run_attempt != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'true'
