name: Main trust

# Runs after a CI run on main finishes. Reads results and acts on them; it never
# checks out or runs code from a pull request (the workflow_run event runs the
# copy of this file on the default branch, against the default branch checkout).
#
#   red, first attempt   re-run the failed jobs once
#   red, second attempt  open one "Main is red" issue
#   green after re-run   open one "Flaky on main: <test file>" issue per test that failed first
#   green                move the `last-green` branch forward, close the "Main is red" issue it settles
#
# No test is skipped, disabled or quarantined. See tooling/ci/main-trust.mjs. The one set-aside is the machine's own, in
# the Real-app journeys verdict (tooling/ci/journey-verdict.mjs): a journey step that failed, then passed on its retry, on
# main, for a limited time, and never a money step. No agent sets anything aside.
#
# After a post-merge check on main finishes (Order-path CX-8, Customer Money browser checks, Real-app journeys, and
# PR checks, whose Dependency audit holds main to the full advisory ratchet), it
# opens one issue naming the breaking commit when a check that passed before is broken, and closes it when the check
# passes again. It only reads runs and writes issues: no schedule, nothing blocks a merge. See
# tooling/ci/post-merge-trust.mjs. After a Real-app journeys run, a step that passed in the run before and failed outright
# in this one starts the journeys revert (main-bisect.yml, tooling/ci/journeys-revert.mjs), which opens the culprit's revert;
# the run's own early-break job usually started it already as the failing shard ended, and then this start adds nothing.
#
# Every hour (`revive`): a Real-app journeys run on main that finished with no report (it died before its tests ran) has its
# failed jobs re-run, with waits of 30 min, 1 h, 2 h and 4 h between attempts and five attempts at most, then one issue
# names it. Every pull request's verdict reads main's reports and fails closed on one it can't read, so one dead run would
# otherwise stop every pull request until a person re-ran it (run 4005, 11 Nov 2026). See tooling/ci/journeys-revive.mjs.
#
# Ends: with each run of the workflows it follows (workflow_run): one run per finished run of theirs on main, so it
# stops only when they do, and they never end on their own; `revive` runs on the hourly timer and ends never. A stop
# disables it until the lift (project-state handover/STOP.md).
on:
  workflow_run:
    workflows: [CI, Order-path CX-8, Customer Money browser checks, Real-app journeys, PR checks]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions: {}

concurrency:
  group: main-trust-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  trust:
    name: Main trust
    if: github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # healthy run: seconds
    permissions:
      contents: write # move the last-green branch
      actions: write # re-run failed jobs, read job steps
      issues: write # red / flaky issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Act on the finished main run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tooling/ci/main-trust.mjs

  post-merge:
    name: Post-merge checks
    if: >-
      github.event.workflow_run.name != 'CI' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5 # healthy run: under a minute (three journey reports at most)
    permissions:
      contents: read # compare commits
      actions: write # re-run failed jobs once, read runs and their journey reports, start the journeys revert
      checks: read # a job's annotations: a cancel by the job time limit counts as red
      issues: write # open, comment on and close the break issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with the earlier runs and act on a break
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tooling/ci/post-merge-trust.mjs
      # A journey step that passed in the run before and failed outright in this one on main: start the journeys revert
      # (main-bisect.yml), which finds the pull request that broke it and opens its revert (tooling/ci/journeys-revert.mjs).
      - name: Start the journeys revert on a confirmed break
        if: github.event.workflow_run.name == 'Real-app journeys'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tooling/ci/journeys-revert.mjs trigger

  revive:
    name: Re-run a journeys run on main that has no report
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # healthy run: a report read of a few seconds per red main run of the last day
    permissions:
      contents: read
      actions: write # read runs and their journey reports, re-run failed jobs
      issues: write # name a run still without a report after its last try
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Re-run or name a finished main run without a report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/journeys-revive.mjs
