# Docs formatting — the cheap half of CI that docs-only changes still need.
#
# WHY THIS EXISTS. `ci.yml` excludes `docs/**` and `**/*.md` from the full
# matrix — expressed as negated `paths:` since coverage-check landed, because
# INTAFACED_DEFINITIVE_BUILD.md is law rather than documentation and has to be
# re-included. That exclusion is correct and worth keeping: a Markdown edit
# cannot break a typecheck, a test or a doctrine gate, and eight docs-only PRs
# once burned roughly 90 billable minutes of a 2,000-minute pool running the
# full matrix to format prose.
#
# But `format:check` is STEP ONE of `pnpm verify`, and it covers `**/*.md`. So
# the exclusion had a hole in it: an unformatted Markdown file could land on
# `main` without any CI running at all, and then EVERY developer's next local
# `pnpm verify` failed at the first step, on a file they had never touched, with
# every gate behind it unreachable.
#
# That happened three times in three days. Each time it was diagnosed as a
# broken merge before someone noticed it was prose.
#
# So: run the one cheap check that docs actually can break, on the exact paths
# `ci.yml` skips. One job, no matrix, no services, no database — a fraction of a
# minute against the full run it deliberately avoids. The alternative is not
# "no CI", it is a red `main` and three people debugging their own checkouts.
#
# pull_request ONLY, and this one is kept on purpose after thrift was deleted
# (2026-08-07). The reason is no longer cost — Actions are free on a public repo.
# It is that a squash merge cannot introduce a formatting error the PR did not
# already have, so a second run on main would check a diff that cannot exist.
# `ci.yml` DOES run on push:main, because a merge genuinely can break the trunk
# there. Manual re-check: workflow_dispatch.
name: Docs format

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'NOTICE'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  format:
    name: Prettier (docs)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, and this is not incidental.
      #
      # `actions/checkout@v4` defaults to fetch-depth: 1. Under that checkout
      # `origin/main` does not exist and `git log HEAD -11` returns one line, so
      # value-gate's `previousSubjects()` caught, returned `[]`, and `decide()`
      # compared the subject against an empty list: best 0, nearDup false,
      # `value-gate: OK`. The stamp-mill detector has been printing clean on
      # every docs PR while comparing nothing to nothing — the exact zero-walk
      # defect four gates in this repo exist to close, inside the gate itself.
      # It now exits 1 rather than pretend, which needs history to be here.
      #
      # 49 MiB of pack for 818 commits: a rounding error next to pnpm install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      # Prettier only. No workspace build, no services, no Postgres — the whole
      # point is that this stays cheap enough to be worth running every time.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: format:check
        run: pnpm format:check

      # Brand scan — docs-only PRs skip ci.yml doctrine gates; still catch §0.7 leaks in markdown.
      - name: brand scan
        run: node tooling/ci/brand-scan.mjs
