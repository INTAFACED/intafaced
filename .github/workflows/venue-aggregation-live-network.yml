# venue.aggregation — public market data live-network smoke (§27).
# This job reaches real external REST and must not run on a schedule or on pull requests.
# A person runs it by hand.
# Read-only: no operator credentials. Skips fixture-only paths; reaches real REST.
name: Venue aggregation live network

on:
  workflow_dispatch:

concurrency:
  group: venue-aggregation-live-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-md-smoke:
    name: Public MD live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build ledger-client + venue-contracts
        run: pnpm --filter @intafaced/ledger-client --filter @intafaced/venue-contracts build

      - name: Live public MD smoke
        env:
          VENUE_AGGREGATION_LIVE_NETWORK_CI: '1'
        run: pnpm --filter @intafaced/venue-adapter test -- --run src/fabric/venues/live-network-smoke.test.ts
