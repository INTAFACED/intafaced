# Journeys in the running app (apps/customer/tests/real-app): the local test stack built from main, the customer app
# in Chromium, nothing mocked. Runs after merge (push to main), once a day on main's newest commit, on workflow_dispatch,
# and on each push to a ready pull request from this repository (what it touches, below), and is not a required check. Main trust's post-merge job compares its
# steps run to run (tooling/ci/post-merge-trust.mjs), so a journey that does not pass yet opens no issue, and the summary
# shows the scoreboard from `roadmap.mjs --progress --results`.
#
# The run's conclusion is its verdict against the list of steps not built yet (docs/runbooks/journey-baseline.json, read
# by docs/runbooks/regression-issue-state.md's rules; tooling/ci/journey-verdict.mjs): green when only listed steps fail
# by those rules, red when any other step fails, a step that passed in the baseline's run is skipped or missing, a shard
# sent no report, a shard was red for any reason but its journeys, or an input the verdict needs can't be read.
# (Failure it prevents: the run ran every written step, built or not, so it was red on every run from 23 Oct 21:09 UTC,
# run 40024672126, whether or not anything broke; a red that never turns green says nothing.)
#
# Flaky steps are set aside by the machine, never by an agent, and never a money step (owner decision 2026-11-07,
# project-state OWNER 225 and 227). A run on main retries a failed test once (JOURNEY_RETRIES); a test that fails and then
# passes on the same commit ends "flaky", and the verdict sets its step aside for 7 days, a list each main run keeps in
# its own artifact (set-aside.json) for the next: it still runs and is shown, it isn't counted as proven, and its failure
# doesn't turn main red. A step that is flaky and not set aside, a money step included, is a pass that is never proven
# and opens a `flaky` issue (the programme lead's decision of 12 Nov 2026 under project-state OWNER 296 and 297). (Failure it prevents: with no retry and no way to set a test
# aside, one flaky test turned main red, or a red was left standing and read as noise.) The cost: each failed test runs
# twice; the failed tests of runs 1635, 1636 and 1639 took 83 to 102 journey-minutes of a run, spread over its shards.
#
# The journeys run in shards, each on its own fresh stack, and one job merges the shards' reports into the scoreboard.
# (Failure it prevents: one job running every journey hit its 45-minute limit from 23 Oct 02:26 UTC, runs 122, 140 and
# 155, so no run finished and the scoreboard froze. Setup takes about 14 minutes and the journeys run one at a time, so
# the suite outgrew one job and keeps growing.) Journey files are independent: each makes its own accounts and keeps its
# own run file, so the plan job can split them by file.
name: Real-app journeys
# A run by hand says in its title what it runs (`full`, or the journey files it was given), so a pull request's run on
# the same head can leave out the journey files a targeted one runs (journey-touch.mjs DISPATCH_TITLE, reusableRuns; project-state#2065 row d32 part (b)).
# Every other run keeps GitHub's own title (an empty run-name).
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Real-app journeys by hand, {0}', github.ref != 'refs/heads/main' && inputs.journeys != '' && inputs.journeys || 'full') || '' }}

on:
  # A manual run on a branch other than main may name journey files; it then runs only those (owner decision
  # 2026-10-30), so a builder proves its own journey on CI's stack without the whole suite. Runs on main, on push and on
  # the schedule always run the full suite, and Main trust and the shard planner read main's runs only.
  # Every ready pull request from this repository, on each push (U4 C3, piece 1; project-state
  # research/factory-2026-11-08 PLAN.md): the touch job runs what the pull request touches by tooling/ci/journey-touch.mjs
  # (full, its journey files, or nothing), so a builder never dispatches a run by hand to seal. The merge seal still
  # decides what counts (journey-seal.mjs, the default branch's copy); this run only saves the dispatch. A draft or a
  # fork's pull request runs nothing here (a draft is proven by a manual run), in a group of its own, so it never cancels
  # a run of this repository's branches. The run tests the pull request's head commit, as a manual run
  # on its branch does, never GitHub's merge commit, so the seal reads it on that head. It shares its branch's group with
  # a manual full run there, so either replaces the other. A pull request run keeps the ordinary limits (no fail-fast),
  # so the steps a builder builds run as in a targeted run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      journeys:
        description: 'Journey files to run, separated by spaces or commas (e.g. J-wallet-05.pw.mjs). Ignored on main.'
        required: false
        default: ''
        type: string
  # One full run a day on main's newest commit, even on a day nothing merges under the paths below, so a finished run
  # is never more than about a day old (#6416). It starts about three hours before the 00:00 UTC daily line, so it has
  # usually finished by then even when it waits behind a push run. On the same commit as the run before it, a step
  # that flips is a flake, which Main trust's issue then says.
  # Ends: never on its own: the daily journey run on main. A stop disables it until the lift
  # (project-state handover/STOP.md); it is removed only by a PR when the owner retires the journeys.
  schedule:
    - cron: '43 20 * * *'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'tsconfig*.json'
      # The journey stack's shared setup: SHARED_SETUP in tooling/ci/journey-seal.mjs, which journey-seal.test.mjs keeps
      # in step with these lines (its real-app helpers come in under apps/**).
      - 'tooling/scripts/local-stack-services/**'
      - 'tooling/scripts/local-stack-fixtures/**'
      - 'tooling/scripts/local-test-*.mjs'
      - 'tooling/scripts/journey-world.mjs'
      - 'tooling/scripts/local-infra-bootstrap.sh'
      - 'tooling/scripts/roadmap.mjs'
      - 'tooling/scripts/journey-shards*.mjs'
      - 'tooling/scripts/journey-fail-fast.mjs'
      - 'tooling/scripts/journey-leave-out*.mjs'
      - 'docs/runbooks/journey-baseline.json'
      - '.github/workflows/real-app-journeys.yml'

# On main, one run at a time, newest waiting (owner decision 2026-11-06, project-state OWNER 206): every push,
# scheduled run and manual run on main shares the group `real-app-journeys-main`. A running main run is never stopped
# (cancel-in-progress false); GitHub keeps at most one main run waiting, so a newer main commit replaces an older one that
# has not started, and only the newest waiting commit runs next. A replaced run ends "cancelled" with no jobs: the planner
# reads non-cancelled finished runs only, and Main trust leaves replaced runs out (tooling/ci/post-merge-trust.mjs; a run
# cancelled by a time limit still counts as timed out). What this gives up: overlapping main runs (owner request
# 2026-11-01, OWNER 154 point 8), under which every merge batch's journeys reported; now a batch whose waiting run is
# replaced reports through the newer run, which holds its commits too. (Failure the old cancel rule caused, and this keeps
# prevented: with cancel-in-progress, every run from 22 Oct 23:35 to 23 Oct 01:06 UTC was cancelled before it reached the
# journeys. Nothing here stops a run that started.)
# Elsewhere (a manual run on a branch, 2026-11-07): one group per branch and journey selection, and a newer run cancels
# the older one, so a branch's superseded head stops holding 36 shards' runners. The seal reads only a run on the pull
# request's exact head (tooling/ci/journey-seal.mjs), so an older head's run decides nothing; a run with another
# selection on the same branch is in another group and finishes. A `:` splits the branch from the selection, since a
# git ref never holds one, so branch `x` with `J-a` and branch `x-J` with `a` never share a group. On 7 Nov at 11:01 UTC, 8 waiting branch runs were for
# a head already superseded by a newer run on the same branch. tooling/ci/workflow-concurrency.test.mjs holds both rules.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'real-app-journeys-main' || (github.event_name == 'pull_request' && (github.event.pull_request.draft || github.event.pull_request.head.repo.full_name != github.repository)) && format('real-app-journeys-runs-nothing-{0}', github.run_id) || format('real-app-journeys-{0}:{1}', github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref, inputs.journeys) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # The journey files of a targeted run; empty (the full suite) on main and for every push or scheduled run.
  JOURNEYS_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.journeys || '' }}
  # Playwright stops a shard's journeys after an hour, before the job's own limit, so the shard still sends its report;
  # the planner warns when a shard comes near it.
  JOURNEY_GLOBAL_TIMEOUT_MS: 3600000

jobs:
  # What this run runs, and its shard plan, in seconds, so the shards and the build start on it at once. A manual run: its journeys input
  # (JOURNEYS_TARGET; journey file names separated by spaces or commas only), or the full suite. A pull request: what its
  # changed files touch, by the default branch's tooling/ci/journey-touch.mjs and its seal's revert rule (the copy the
  # merge seal judges with, so the two agree): `full` the full suite, `files` its journey files, `none` nothing (the rest
  # of the run is skipped and its report is empty, so the seal reads it as saying nothing). A pull request whose files
  # can't be read whole (an error, or GitHub's 3,000-file cap) runs the full suite, never fewer. A draft or a fork's pull
  # request runs nothing. A run deferred for main (below) runs nothing now and is re-run later.
  # On main its touch steps decide nothing (main always runs the full suite) and only the plan runs, so every run queues
  # for runners twice, this job and then the shards, not three times (a separate touch hop waited 7.3, 15.1 and 19.6
  # minutes on main runs 2559, 2655 and 2708 in the guide's CI audit of 9 Nov 2026; a separate planner hop waited a
  # median 5.6 minutes on 71 runs of 10 Nov).
  touch:
    name: What this run runs
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # seconds to decide and plan; main-first reads once and never waits
    permissions:
      contents: read
      pull-requests: read # a pull request's changed files
      actions: read # main's runs, for the touched-journeys map's age (journey-reach-map.mjs runsBehind), Main's journeys first and the last runs' reports
    # The plan's steps run only for a run that runs journeys here (never a draft's or a fork's pull request).
    env:
      PLANS: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) }}
    outputs:
      # A deferred run (main-first.mjs) runs nothing now: its report is empty, so the seal reads it as saying nothing.
      mode: ${{ steps.first.outputs.deferred == 'true' && 'none' || steps.touch.outputs.mode }}
      target: ${{ github.ref != 'refs/heads/main' && steps.first.outputs.deferred != 'true' && steps.touch.outputs.target || '' }}
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      fast_plan: ${{ steps.fast.outputs.plan }}
      leave_out: ${{ steps.leave.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # The rules the merge seal judges with: the default branch's journey-seal.mjs and journey-touch.mjs, never the
      # pull request's own copies.
      # A manual run off main reads it too, so main's wait and the cap on hand-dispatched full runs (main-first.mjs) are
      # main's rules, not the branch's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          sparse-checkout: tooling
          persist-credentials: false
      # Main's Node runs main's rules: the version comes from .base (a cone-mode sparse checkout keeps root files), never
      # the pull request's own .node-version. Until main has the file (only on the run of the pull request that adds it),
      # the branch's copy stands in.
      - name: Main's Node version
        run: '[ -f .base/.node-version ] || { mkdir -p .base && cp .node-version .base/.node-version; }'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
      - name: What this run runs
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Main always runs the full suite (main's full run is the backstop, never narrowed): a push, a scheduled run or
          # a manual run on main, whatever its journeys input, decides nothing here and keeps an empty target.
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "main runs the full suite"
            { echo "mode=run"; echo "target="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != pull_request ]; then
            # A manual run's input reaches the outputs only as journey file names, so it can't write another output.
            if ! [[ "$JOURNEYS_TARGET" =~ ^[A-Za-z0-9._,\ -]*$ ]]; then
              echo "::error::the journeys input holds something other than journey file names, spaces and commas"
              exit 1
            fi
            { echo "mode=run"; echo "target=$JOURNEYS_TARGET"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRAFT" = true ] || [ "$SAME_REPO" != true ]; then
            echo "::notice::a draft or a fork's pull request runs no journeys here; a manual run proves a draft"
            { echo "mode=none"; echo "target="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          full() {
            echo "::warning::$1, so the full suite runs"
            { echo "mode=run"; echo "target="; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          list="$RUNNER_TEMP/changed.txt"
          names="$RUNNER_TEMP/names.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[] | .filename' > "$names" || full "this pull request's files couldn't be read"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > "$list" || full "this pull request's files couldn't be read"
          listed=$(wc -l < "$names")
          if [ "$listed" -lt "${CHANGED:-0}" ] || [ "$listed" -ge 3000 ]; then full "GitHub listed $listed of this pull request's ${CHANGED} changed files"; fi
          # GitHub's Revert button undoes a change and adds none: the seal asks no run of it unless it touches shared
          # setup (revertOf, isSharedSetup), so then none runs.
          seal="$GITHUB_WORKSPACE/.base/tooling/ci/journey-seal.mjs"
          # Paths go in through the environment: an argument naming the seal would start its own command line.
          if SEAL="$seal" LIST="$list" node -e 'import(process.env.SEAL).then((m) => { const f = require("fs").readFileSync(process.env.LIST, "utf8").split("\n").filter(Boolean); process.exit(m.revertOf({ title: process.env.TITLE, body: process.env.BODY, repo: process.env.GITHUB_REPOSITORY }) && !f.some(m.isSharedSetup) ? 0 : 1); })'; then
            echo "a revert made with GitHub's Revert button that touches no shared setup: the seal asks no journeys run of it"
            { echo "mode=none"; echo "target="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The revert main-bisect opens (journey-seal.mjs autoRevertScope: the App's revert/auto- branch, one commit that
          # reverts that commit, no other file, no shared setup) runs only the journeys that failed on main and the reverted
          # change's own, as the seal judges it; main's full run after the merge guards main. An unreadable scope, or
          # any other pull request, goes on to the ordinary scope below.
          auto=$(REPO="$GITHUB_REPOSITORY" node "$seal" --auto-revert-scope "$PR") || auto='{}'
          narrow=$(jq -r '(.files // []) | join(" ")' <<<"$auto") || narrow=''
          if [ -n "$narrow" ] && [[ "$narrow" =~ ^[A-Za-z0-9._\ -]+$ ]]; then
            jq -r '.why' <<<"$auto"
            { echo "mode=run"; echo "target=$narrow"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r 'select(.why != null and .why != "") | .why' <<<"$auto" 2>/dev/null || true
          # --reach: product code runs only the journeys main's touched-journeys map recorded reaching it (the base's map,
          # beside its journey-touch.mjs), else the full suite.
          touch=$(node "$GITHUB_WORKSPACE/.base/tooling/ci/journey-touch.mjs" --json --reach --files-from "$list") || full "journey-touch couldn't judge this pull request"
          mode=$(jq -r .mode <<<"$touch")
          echo "journey-touch: $mode ($listed changed files)"
          # Counts only: a changed path is the pull request's own text and never reaches a log line here.
          jq -r 'select(.reach) | "journey-touch: the touched-journeys map narrows \(.reach | length) product path(s) to \(.files | length) journey file(s)"' <<<"$touch"
          # The steps the title names and no Left-or-replaced line leaves (the seal's titleSteps and exemptions): their
          # journey files at the head run too, so the seal's named steps are proven without a manual run.
          named=$(SEAL="$seal" node -e 'import(process.env.SEAL).then((m) => { const left = new Set(m.exemptions(process.env.BODY).steps); const js = new Set(m.titleSteps(process.env.TITLE).filter((k) => !left.has(k)).map((k) => k.split("#")[0])); const dir = "apps/customer/tests/real-app"; const out = require("fs").readdirSync(dir).filter((f) => { const x = m.JOURNEY_TEST.exec(dir + "/" + f); return x && js.has(x[1]); }); console.log(out.sort().join(" ")); })') || full "the steps the title names couldn't be read"
          [ -n "$named" ] && echo "the title's steps are in: $named"
          case "$mode" in
            none) if [ -n "$named" ]; then { echo "mode=run"; echo "target=$named"; } >> "$GITHUB_OUTPUT"; else { echo "mode=none"; echo "target="; } >> "$GITHUB_OUTPUT"; fi ;;
            files) { echo "mode=run"; echo "target=$(jq -r --arg n "$named" '(.files + ($n | split(" ") | map(select(. != "")))) | unique | join(" ")' <<<"$touch")"; } >> "$GITHUB_OUTPUT" ;;
            *) { echo "mode=run"; echo "target="; } >> "$GITHUB_OUTPUT" ;;
          esac

      # One journeys run per head (project-state#2065 row d32 part (b)): a pull request's targeted run leaves out the
      # journey files a targeted run by hand on its exact head already runs (the builder's run before it opened the pull
      # request; journey-touch.mjs reusableRuns, afterReuse, the default branch's copy). A full run is never narrowed, and
      # a full run by hand stands in for nothing. The seal reads every run on the head by its report, so what is left out is
      # judged from that run, and its red stands. Any other run, an unreadable list of runs, or a base copy with no
      # --reuse: the pick stands.
      - name: One journeys run per head
        id: touch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ steps.pick.outputs.mode }}
          TARGET: ${{ steps.pick.outputs.target }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$MODE" = run ] && out=$(node "$GITHUB_WORKSPACE/.base/tooling/ci/journey-touch.mjs" --reuse 2>/dev/null) && jq -e '.mode == "run" or .mode == "none"' <<<"$out" >/dev/null 2>&1; then
            why=$(jq -r '.why' <<<"$out")
            [ -n "$why" ] && echo "::notice::$why"
            mode=$(jq -r '.mode' <<<"$out")
            target=$(jq -r '.target' <<<"$out")
            if [[ "$target" =~ ^[A-Za-z0-9._\ -]*$ ]]; then
              { echo "mode=$mode"; echo "target=$target"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          { echo "mode=$MODE"; echo "target=$TARGET"; } >> "$GITHUB_OUTPUT"

      # Marks a hand-dispatched full run off main in the jobs API, so main-first.mjs can count them (DISPATCH_MARK).
      - name: A hand-dispatched full run
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && env.JOURNEYS_TARGET == ''
        run: echo "a hand-dispatched full run off main; at most 2 hold runners at once (tooling/ci/main-first.mjs)"

      # Main first (INTAFACED/project-state#1574 item 3, tooling/ci/main-first.mjs): a run off main that has journeys to
      # run reads once whether a main run still has jobs waiting for a runner or has not planned its shards. If so, it is
      # deferred: it runs nothing now, so it holds no runner, and main's run re-runs it once main's shards are queued (the
      # `release` job). It never gives up on main. Runners go to the jobs queued first: on 9 Nov 2026 main's 44 shards
      # waited 23 to 42 minutes behind branch runs, and a waiting step held one runner on each of 13 branch runs at 10:47
      # UTC. Only a full run waits for main: a targeted one (the touch job gave it journey files) goes ahead (theo-01
      # part 0, project-state#2065). A hand-dispatched full run is also deferred while 2 others run. It never fails the run (continue-on-error;
      # an unreadable API goes on) and never runs on main. It runs the default branch's copy (.base), or, where there is
      # none, the branch's.
      - name: Main's journeys first
        id: first
        if: github.ref != 'refs/heads/main' && steps.touch.outputs.mode == 'run'
        continue-on-error: true
        timeout-minutes: 3 # one read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DISPATCH_FULL: ${{ github.event_name == 'workflow_dispatch' && env.JOURNEYS_TARGET == '' }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }} # a re-run the release let go doesn't wait for main again
          TARGETED: ${{ steps.touch.outputs.target != '' }} # a targeted run (at most 10 shards) never waits for main
        run: |
          script=.base/tooling/ci/main-first.mjs
          [ -f "$script" ] || script=tooling/ci/main-first.mjs
          if [ -f "$script" ]; then node "$script"; else echo "no main-first.mjs on this branch; going on"; fi

      # Marks a deferred run in the jobs API, so the release job (main-first.mjs --release, DEFER_MARK) finds it.
      - name: "Deferred: main's journeys or the cap come first"
        if: steps.first.outputs.deferred == 'true'
        run: echo "::notice::deferred while main's journeys (or 2 hand-dispatched full runs) take the runners; main's run re-runs this one once its shards are queued"

      # The plan (tooling/scripts/journey-shards.mjs): the journey files split across the shards by their times in the
      # last finished runs on main, so the shards end together (Playwright's own --shard split by count left one shard 33
      # minutes behind the shortest in run 338), in as many shards as keep each near the longest journey file's time less
      # the spread of a shard's setup, 10 to 25 minutes of journeys (8 to 48 shards). The plan is checked to run every
      # journey file exactly once before it is used. If planning fails for any reason the run falls back to 8 shards and
      # Playwright's split, so a broken planner never stops a run; journeys past a shard's limit then count as not run and
      # the time-limit issue names the shards. A targeted run (JOURNEYS_TARGET) never falls back: a name that is not a
      # journey file fails this job, and no shard runs. It plans only a run that runs journeys here: not a deferred run,
      # and never a draft's or a fork's pull request (PLANS).
      # Up to three, so a run that lost a shard or failed a journey early does not make those files look fast. Most runs
      # are queued runs a newer push replaced (cancelled), so the list reaches back 100 runs to find three that finished.
      - name: Last finished runs' reports
        if: ${{ !cancelled() && env.PLANS == 'true' && steps.touch.outputs.mode != 'none' && steps.first.outputs.deferred != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          got=0
          # Each run's head is kept beside its report (head_sha), for the leave-out plan's history.
          while read -r id sha; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name real-app-journeys --dir "$RUNNER_TEMP/last/$id" 2>/dev/null || continue
            echo "$sha" > "$RUNNER_TEMP/last/$id/head_sha"
            # The newest run's stored pass history (journey-verdict.mjs HISTORY_ARTIFACT), which the leave-out plan reads.
            if [ "$got" = 0 ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then
              gh run download "$id" --repo "$GITHUB_REPOSITORY" --name real-app-journeys-pass-history --dir "$RUNNER_TEMP/history" 2>/dev/null || true
            fi
            echo "timings from run $id"
            got=$((got + 1))
            [ "$got" -ge 3 ] && break
          done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow real-app-journeys.yml --branch main --status completed --limit 100 --json databaseId,conclusion,headSha --jq '.[] | select(.conclusion != "cancelled") | "\(.databaseId) \(.headSha)"')
          # The two newest finished scheduled runs too: they keep the ordinary limits, so a test built since the baseline
          # passes there (the fail-fast plan below leaves it out). Kept apart, so the shard plan reads the last runs as before.
          while read -r id sha; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name real-app-journeys --dir "$RUNNER_TEMP/scheduled/$id" 2>/dev/null || continue
            echo "$sha" > "$RUNNER_TEMP/scheduled/$id/head_sha"
            echo "fail-fast reads the scheduled run $id"
            sched=$((${sched:-0} + 1))
            [ "$sched" -ge 2 ] && break
          done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow real-app-journeys.yml --branch main --event schedule --status completed --limit 10 --json databaseId,conclusion,headSha --jq '.[] | select(.conclusion != "cancelled") | "\(.databaseId) \(.headSha)"')
      - name: Plan
        id: plan
        if: ${{ !cancelled() && env.PLANS == 'true' && steps.touch.outputs.mode != 'none' && steps.first.outputs.deferred != 'true' }}
        continue-on-error: true
        env:
          JOURNEYS_TARGET: ${{ github.ref != 'refs/heads/main' && steps.touch.outputs.target || '' }}
        run: |
          node --test tooling/scripts/journey-shards.test.mjs
          reports=()
          for f in "$RUNNER_TEMP"/last/*/report.json; do [ -f "$f" ] && reports+=(--report "$f"); done
          only=()
          [ -n "$JOURNEYS_TARGET" ] && only=(--only "$JOURNEYS_TARGET")
          shards=$(node tooling/scripts/journey-shards.mjs --shards auto "${reports[@]}" "${only[@]}")
          {
            echo "shards=$shards"
            echo "matrix=$(jq -c '[range(1; length + 1)]' <<<"$shards")"
            echo "count=$(jq length <<<"$shards")"
          } >> "$GITHUB_OUTPUT"
      # The fail-fast plan (tooling/scripts/journey-fail-fast.mjs): the baseline's unbuilt steps, less each of their tests
      # that passed in a run read above. Best effort: without it nothing fails fast.
      - name: Fail-fast plan
        id: fast
        if: ${{ !cancelled() && env.PLANS == 'true' && steps.touch.outputs.mode != 'none' && steps.first.outputs.deferred != 'true' }}
        continue-on-error: true
        run: |
          node --test tooling/scripts/journey-fail-fast.test.mjs
          reports=()
          for f in "$RUNNER_TEMP"/last/*/report.json "$RUNNER_TEMP"/scheduled/*/report.json; do [ -f "$f" ] && reports+=(--report "$f"); done
          echo "plan=$(node tooling/scripts/journey-fail-fast.mjs --plan "${reports[@]}")" >> "$GITHUB_OUTPUT"
      # The tests a push run on main leaves out (tooling/scripts/journey-leave-out.mjs; project-state#2065 d32 part 5a):
      # unbuilt steps that never passed on main (the pass history), failed in a run read above, and that no commit since
      # names or changes. Best
      # effort: without it nothing is left out. Only a full run on a push to main; the daily scheduled run, a pull
      # request's, a targeted and a hand-dispatched run leave nothing out.
      - name: Leave-out plan
        id: leave
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.touch.outputs.mode != 'none' && steps.first.outputs.deferred != 'true' }}
        continue-on-error: true
        run: |
          node --test tooling/scripts/journey-leave-out.test.mjs
          git fetch --no-tags --quiet --deepen=400 origin
          git log --format='@%H%x09%s' --name-only -n 400 HEAD > "$RUNNER_TEMP/leave-log.txt"
          runs=()
          for d in "$RUNNER_TEMP"/last/* "$RUNNER_TEMP"/scheduled/*; do
            [ -f "$d/report.json" ] && [ -f "$d/head_sha" ] && runs+=(--run "$d/report.json" "$(cat "$d/head_sha")")
          done
          node tooling/scripts/journey-leave-out.mjs --log "$RUNNER_TEMP/leave-log.txt" --history "$RUNNER_TEMP/history/pass-history.json" "${runs[@]}" > "$RUNNER_TEMP/leave-out.txt"
          {
            echo "list<<LEAVE_OUT_END"
            cat "$RUNNER_TEMP/leave-out.txt"
            echo "LEAVE_OUT_END"
          } >> "$GITHUB_OUTPUT"
      # The list kept with the run, so main-bisect's probes leave out what this run left out (journeys-revert-probe.mjs
      # leavesOut): a break made by leaving a test out then reproduces, and its merge is reverted.
      - name: Keep the leave-out list
        if: ${{ !cancelled() && steps.leave.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-app-journeys-leave-out
          path: ${{ runner.temp }}/leave-out.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Targeted run has its plan
        if: ${{ !cancelled() && env.PLANS == 'true' && steps.first.outputs.deferred != 'true' && steps.touch.outputs.target != '' && steps.plan.outputs.shards == '' }}
        run: |
          echo "::error::the journeys input (or the pull request's journey files) names a file that is not a journey file under apps/customer/tests/real-app (the Plan step's log names it), so nothing runs"
          exit 1
      - name: The journeys input is ignored on main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.journeys != ''
        run: echo "::warning::a run on main always runs the full suite; the journeys input applies only on another branch"

  # Lets deferred runs go (main-first.mjs --release): on main, once the planner has queued main's shards, so the
  # deferred runs' jobs queue behind them; after a hand-dispatched full run off main, so the ones the cap deferred run.
  # It re-runs only the newest run of each branch, only one its touch job marked deferred, and at most 40 a time.
  release:
    name: Let deferred runs go
    needs: [touch]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # seconds
    permissions:
      contents: read
      actions: write # re-run the deferred runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          sparse-checkout: tooling/ci
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
      - name: Let deferred runs go
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node .base/tooling/ci/main-first.mjs --release

  # On main, a journey step that passed in main's run before and fails outright in a shard of this run starts the
  # journeys revert (main-bisect.yml) as that shard's job ends, not when the whole run ends: it reads each shard's own
  # report as the shard finishes (tooling/ci/journeys-revert.mjs early). Main trust's start at the run's end still
  # runs and starts only the steps this one did not. It runs no code of the run's commit beyond main's own tooling.
  early-break:
    name: Act on a shard's break as it ends
    needs: [touch]
    if: ${{ !cancelled() && needs.touch.outputs.mode != 'none' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110 # waits on the shards (90 minutes each at most), reading each one once as it ends
    permissions:
      contents: read
      actions: write # read this run's jobs and shard reports, and start main-bisect.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Start the journeys revert as each shard ends
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_ID: real-app-journeys.yml
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: node tooling/ci/journeys-revert.mjs early

  release-after-dispatch:
    name: Let deferred runs go after this full run
    needs: [touch, journeys]
    # Only after a full run that ran: a deferred one ran nothing, and letting runs go from it would loop deferred runs.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.journeys == '' && needs.touch.outputs.mode != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # seconds
    permissions:
      contents: read
      actions: write # re-run the deferred runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          sparse-checkout: tooling/ci
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
      - name: Let deferred runs go
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node .base/tooling/ci/main-first.mjs --release

  # The stack's builds, once per run, beside the shards' own setup; every shard then starts on them
  # instead of building again (measured on run 1138: 1m37s of each of 21 shards' setup was these same builds). The outputs travel with the stack's
  # build stamp, which `start` checks against its own checkout (same commit, no edits), so a shard that receives anything
  # else, or nothing, builds it itself as before (local-test-stack.mjs buildStillFresh).
  build:
    name: Build the stack once
    needs: [touch]
    if: ${{ !cancelled() && needs.touch.result == 'success' && needs.touch.outputs.mode != 'none' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # healthy run: about 3 minutes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # The stack runs its builds with a clean PATH that holds node's own folder, not the folder pnpm/action-setup uses.
      - name: Put pnpm next to node
        run: ln -sf "$(command -v pnpm)" "$(dirname "$(command -v node)")/pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      # svc-fix's pinned JDK and Maven archives, kept between runs: the build fetches them from GitHub's release host,
      # whose 504s failed every journeys run before any test (runs 42561646967 and 42578853059, 9 Nov). Only the archives
      # are kept; ensure-toolchain.mjs checks each one's pinned sha256/sha512 and fetches it again when it does not match.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/stack-state/java-tools/jdk.tgz
            ${{ runner.temp }}/stack-state/java-tools/maven.tgz
          key: java-tools-${{ runner.os }}-${{ hashFiles('services/svc-fix/scripts/ensure-toolchain.mjs') }}
      - name: Build what the stack starts
        run: LOCAL_STACK_STATE="$RUNNER_TEMP/stack-state" node tooling/scripts/local-test-stack.mjs build --no-admin
      # Everything the build wrote: git's ignored paths outside node_modules and turbo's cache (the dist folders), and the
      # stamp. Not the founder console's .next: Next.js writes its preview signing key and server-actions encryption key
      # into it, and this repository's artifacts are public, so this job does not build it (--no-admin) and each shard
      # builds the console itself (about 37 s), which its own stamp fields, absent here, tell `start` to do.
      - name: Pack the build
        run: |
          git ls-files --others --ignored --exclude-standard --directory | grep -Ev '(^|/)(node_modules|\.turbo)/' | grep -v '^apps/admin/\.next' > "$RUNNER_TEMP/outputs.txt"
          echo "$(wc -l < "$RUNNER_TEMP/outputs.txt") build outputs"
          # Fails closed: per output, a match (grep exit 0) or an unreadable one (2) stops the pack; only no match (1) goes on.
          while IFS= read -r out; do
            code=0
            grep -rlE 'previewModeSigningKey|"encryptionKey"' -- "$out" || code=$?
            if [ "$code" -ne 1 ]; then
              echo "::error::$out holds a signing or encryption key, or could not be read (grep exit $code), and the build artifact is public"
              exit 1
            fi
          done < "$RUNNER_TEMP/outputs.txt"
          mkdir -p "$RUNNER_TEMP/stack-build"
          tar -cf "$RUNNER_TEMP/stack-build/outputs.tar" -T "$RUNNER_TEMP/outputs.txt"
          jq 'with_entries(select(.key | startswith("admin") | not))' "$RUNNER_TEMP/stack-state/build-stamp.json" > "$RUNNER_TEMP/stack-build/build-stamp.json"
          du -sh "$RUNNER_TEMP/stack-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-app-journeys-build
          path: ${{ runner.temp }}/stack-build
          retention-days: 1
          if-no-files-found: error

  journeys:
    name: Journeys (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    # Not on the build job: a shard's own setup runs beside it, and only the step that takes its build waits for it.
    needs: [touch]
    permissions:
      contents: read
      actions: read # to read the build job's state and download its build
    # The shards run even when planning failed (the Plan step goes on, and they fall back to Playwright's split); a targeted
    # run without its plan fails the touch job, so its shards don't run.
    if: ${{ !cancelled() && needs.touch.result == 'success' && needs.touch.outputs.mode != 'none' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)) }}
    runs-on: ubuntu-24.04
    # Setup (about 10 minutes, once 21 when the browser's system packages were slow) plus at most 60 minutes of journeys,
    # which Playwright stops itself (JOURNEY_GLOBAL_TIMEOUT_MS below), so the job's own limit is never what ends a shard
    # and a long shard still sends its report. (Failure it prevents: a shard the job limit cuts sends no report at all.)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.touch.outputs.matrix || '[1, 2, 3, 4, 5, 6, 7, 8]') }}
    # The owner's labelled TEST screening placeholder, for every stack command in this job (see the check step). Secrets,
    # not variables, so the logs show *** and not the list.
    env:
      JOURNEYS_TARGET: ${{ needs.touch.outputs.target }} # the manual run's input, or the pull request's journey files
      INTAFACED_SANCTIONS_REGIONS: ${{ secrets.INTAFACED_SANCTIONS_REGIONS }}
      INTAFACED_SANCTIONS_LIST_SOURCE: ${{ secrets.INTAFACED_SANCTIONS_LIST_SOURCE }}
    steps:
      # A targeted run never falls back to the full suite: without its plan (a name that is not a journey file, or a
      # broken planner) it stops here.
      - name: Targeted run has its plan
        if: env.JOURNEYS_TARGET != ''
        env:
          SHARDS: ${{ needs.touch.outputs.shards }}
        run: |
          if [ -z "$SHARDS" ]; then
            echo "::error::the journeys input has no shard plan; see the What this run runs job for the file it refused"
            exit 1
          fi
      # The runner context is not allowed in a job's env, so the paths under the runner's temp folder are set here.
      - name: Paths
        run: |
          echo "LOCAL_STACK_STATE=$RUNNER_TEMP/stack-state" >> "$GITHUB_ENV"
          echo "LOCAL_STACK_NATS_BIN=$RUNNER_TEMP/nats-server" >> "$GITHUB_ENV"
          echo "LOCAL_STACK_ANVIL_BIN=$RUNNER_TEMP/anvil" >> "$GITHUB_ENV"
          echo "JOURNEY_REPORT=$RUNNER_TEMP/journeys/report.json" >> "$GITHUB_ENV"
          echo "JOURNEY_BLOB_DIR=$RUNNER_TEMP/journeys/blob" >> "$GITHUB_ENV"

      # Edge refuses every money read without a screening list (edge.screening_unset), and the stack never invents one.
      # The runner takes the owner's labelled TEST placeholder from two repository secrets, never from this file.
      - name: Screening placeholder is set
        run: |
          if [ -z "$INTAFACED_SANCTIONS_REGIONS" ] || [ -z "$INTAFACED_SANCTIONS_LIST_SOURCE" ]; then
            msg="Blocked: the repository secrets INTAFACED_SANCTIONS_REGIONS and INTAFACED_SANCTIONS_LIST_SOURCE are unset, so Edge would refuse every money read (edge.screening_unset). The owner sets them once (Settings, Secrets and variables, Actions, Secrets)."
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$msg"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The stack refuses to start under 14 GB free; the runner image ships toolchains this job never uses. Removing them
      # took 2m20s of every shard (run 1138) on runners that already had far more free than the stack needs (101 GB after,
      # 44 GB used of 145), so they go only when the disk is short.
      - name: Free disk space (only when short)
        run: |
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$avail" -lt 30 ]; then
            echo "only ${avail} GB free: removing the toolchains this job never uses"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
            df -h /
          else
            echo "${avail} GB free: nothing to remove"
          fi

      # The stack runs its builds with a clean PATH that holds node's own folder, not the folder pnpm/action-setup uses.
      - name: Put pnpm next to node
        run: ln -sf "$(command -v pnpm)" "$(dirname "$(command -v node)")/pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Get a nats-server binary
        run: |
          docker create --name nats-src nats:2.10.24-alpine
          docker cp nats-src:/usr/local/bin/nats-server "$LOCAL_STACK_NATS_BIN"
          docker rm nats-src
          chmod +x "$LOCAL_STACK_NATS_BIN"

      # The stack's LOCAL TEST chain (tooling/scripts/local-test-chain.mjs): the same pinned foundry image and the same
      # `docker run <image> "anvil ..."` form .github/actions/test-infra runs its dev chain with, behind a small launcher,
      # since the stack starts its chain as a process. Host network, so anvil binds the loopback port the stack names.
      # Dev only and ephemeral: TEST chain id 84532 on loopback, no fork, destroyed with the runner.
      - name: Get an anvil launcher
        run: |
          docker pull ghcr.io/foundry-rs/foundry:v1.5.1
          cat > "$LOCAL_STACK_ANVIL_BIN" <<'EOF'
          #!/bin/sh
          exec docker run --rm --init --network host ghcr.io/foundry-rs/foundry:v1.5.1 "anvil $*"
          EOF
          chmod +x "$LOCAL_STACK_ANVIL_BIN"

      # The browser and its system packages come from GitHub's cache, so an outage of Ubuntu's mirror or the browser host
      # does not stop the shard (.github/actions/browser says why and how). Every outside call there is time-boxed and
      # fails with its reason, so this limit is only the last stop. A healthy install takes about 20 s.
      - name: Install the browser
        timeout-minutes: 15
        uses: ./.github/actions/browser

      # The run's one build (the build job), with its stamp in this shard's stack state, taken as late as possible so the
      # setup above runs beside the build. It waits for that job at most 10 minutes, asking every 60 s; an answer that
      # fails is asked again, and a run with no such job (in any attempt) stops at once. Best effort: without the build
      # (the job failed or is late), or when the stamp does not vouch for this checkout, `start` builds as before.
      # Why 60 s and actions/download-artifact (row d25 of project-state #2065): every shard asks the workflow token's API,
      # which the seals, the CI review, the gate guards and Main trust share at 15,000 calls an hour. Asking every 20 s,
      # then `gh run download`, cost about 4,900 calls in the hour to 03:20 UTC on 13 Nov (597 shards, 110 s mean wait),
      # a third of that budget, and the hour ran out at 03:19. download-artifact reads this run's own artifact through
      # the runner's artifact service, which spends no API call.
      - name: Wait for the run's build
        id: build
        continue-on-error: true
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=""
          for _ in $(seq 1 11); do
            if jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100"); then
              # The newest attempt's build job (a re-run of failed jobs carries the passed one over).
              state=$(jq -r '[.jobs[] | select(.name == "Build the stack once")] | sort_by(.run_attempt) | last | if . == null then "none" else "\(.status) \(.conclusion)" end' <<<"$jobs")
              case "$state" in completed\ * | none) break ;; esac
            fi
            sleep 60
          done
          echo "build job: ${state:-not read}"
          if [ "$state" != "completed success" ]; then
            echo "::warning::no build from this run (${state:-not read}); this shard builds the stack itself"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Download the run's build
        id: build-download
        if: steps.build.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: real-app-journeys-build
          path: ${{ runner.temp }}/stack-build
      - name: Take the run's build
        if: steps.build-download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          tar -xf "$RUNNER_TEMP/stack-build/outputs.tar"
          mkdir -p "$LOCAL_STACK_STATE"
          chmod 700 "$LOCAL_STACK_STATE"
          cp "$RUNNER_TEMP/stack-build/build-stamp.json" "$LOCAL_STACK_STATE/"
          rm -f "$RUNNER_TEMP/stack-build/outputs.tar"

      # The build job's kept JDK and Maven archives, read only: a shard without the run's build builds svc-fix itself and
      # fetched the JDK from the same release host (run 42568666064, 9 Nov: the build and 20 shards failed on its 504s).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/stack-state/java-tools/jdk.tgz
            ${{ runner.temp }}/stack-state/java-tools/maven.tgz
          key: java-tools-${{ runner.os }}-${{ hashFiles('services/svc-fix/scripts/ensure-toolchain.mjs') }}

      - name: Start the local test stack (TEST funds only)
        run: |
          df -h /
          node tooling/scripts/local-test-stack.mjs start

      # A fresh stack trades only after the TEST gates open the markets and verify the market maker's two TEST accounts
      # (docs/LOCAL-TEST-STACK.md, "A fresh stack"). Matching reads its operator seats when it starts, so it restarts
      # after the founders enrolled. The market maker refuses to start on closed markets and creates its accounts when it
      # starts, so `verify` runs after it. It stops again before `verify`, so no market trades before `history`: that
      # writes the TEST tape history the chart journeys read (real TEST trades whose times svc-trade moves into the past,
      # docs/LOCAL-TEST-STACK.md, "Chart history"), and it only writes on a market with no trades yet. It exits non-zero
      # when any market comes up short, and that fails this step on purpose: chart journeys on a partial history would
      # fail later for a reason the log no longer shows.
      # With the stack's custody switch off (the launch build's, OWNER 288), our own order book is off, so its TEST market
      # maker and its chart history are not started (local-test-market.mjs, CUSTODY_ON_ONLY): the gates still open and
      # verify, and launch journeys trade at the TEST venue.
      # The history goes only on the markets journeys read the past of (`--markets journeys`, HISTORY_SYMBOLS in
      # local-test-market.mjs, which local-test-market-history.test.mjs keeps whole): four of six markets, 149 s against 193 s
      # measured on one shard on 13 Nov, a saving every shard makes (project-state #2065 row d37).
      - name: Open the TEST markets, write TEST chart history, start the TEST market maker
        run: |
          node tooling/scripts/local-test-stack.mjs restart matching
          node tooling/scripts/local-test-gates.mjs apply
          if [ "$(node tooling/scripts/local-test-stack.mjs custody)" = off ]; then
            node tooling/scripts/local-test-market.mjs
            node tooling/scripts/local-test-gates.mjs verify
            exit 0
          fi
          node tooling/scripts/local-test-market.mjs
          # The market maker registers its accounts in the background; verify only once both exist.
          for _ in $(seq 1 30); do
            grep -Eq 'taker (created|existing) \(test_taker\)' "$LOCAL_STACK_STATE/logs/market.log" 2>/dev/null && break
            sleep 2
          done
          node tooling/scripts/local-test-market.mjs stop
          node tooling/scripts/local-test-gates.mjs verify
          node tooling/scripts/local-test-market.mjs history --markets journeys
          node tooling/scripts/local-test-market.mjs

      # Labelled TEST rows (earn pools, loan products, a TEST P2P method) so those rooms show working, after the gates
      # published the limits they need (docs/LOCAL-TEST-STACK.md, "Local test content"). Production stays blank.
      - name: Load the TEST content
        run: LOCAL_TEST=1 node tooling/scripts/local-test-seed.mjs apply --state "$LOCAL_STACK_STATE"

      - name: Wait for the first BTC/USDT trade
        run: |
          if [ "$(node tooling/scripts/local-test-stack.mjs custody)" = off ]; then
            echo "custody off: no TEST market maker on our own order book, so no trade to wait for"
            exit 0
          fi
          for _ in $(seq 1 60); do
            grep -q 'BTC/USDT crossing trade by test_taker: .* -> HTTP 201' "$LOCAL_STACK_STATE/logs/market.log" 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::no BTC/USDT trade from the TEST market maker within 5 minutes"
          tail -40 "$LOCAL_STACK_STATE/logs/market.log"
          exit 1

      # No traces: they would carry the run's TEST session and password into a public artifact. Screenshots stay.
      # The plan's files for this shard, or Playwright's own split when the plan is missing.
      - name: Journeys in the running app (this shard)
        env:
          # A full run on a push or by hand fails fast on the plan: the baseline's unbuilt steps, less each of their
          # tests that passed in a finished run read (tooling/scripts/journey-fail-fast.mjs). The daily scheduled run
          # keeps the ordinary limits, so a test built since the baseline was written passes on main under them; a
          # targeted run, where a builder proves a step, keeps them too.
          JOURNEY_FAIL_FAST: ${{ env.JOURNEYS_TARGET == '' && github.event_name != 'schedule' && github.event_name != 'pull_request' && '1' || '0' }}
          JOURNEY_FAIL_FAST_PLAN: ${{ needs.touch.outputs.fast_plan }}
          # The unbuilt tests a push run on main leaves out (the touch job's Leave-out plan), as Playwright's test list.
          JOURNEY_LEAVE_OUT: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.touch.outputs.leave_out || '' }}
          # One retry of a failed test on main only (the set-aside above); a targeted run on a branch never retries.
          JOURNEY_RETRIES: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
          SHARDS: ${{ needs.touch.outputs.shards }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          config=apps/customer/tests/real-app/real-app.playwright.config.mjs
          split=()
          if [ -z "$SHARDS" ]; then
            echo "::warning::no shard plan (see the What this run runs job), so Playwright splits the journeys by count"
            split=(--shard "$SHARD/$TOTAL")
          else
            if [ "$(jq length <<<"$SHARDS")" != "$TOTAL" ]; then
              echo "::error::the plan has $(jq length <<<"$SHARDS") shards and the matrix $TOTAL; change both together"
              exit 1
            fi
            JOURNEY_FILES=$(jq -r --argjson n "$SHARD" '.[$n - 1]' <<<"$SHARDS")
            echo "$JOURNEY_FILES" | tr ' ' '\n'
            export JOURNEY_FILES
          fi
          leave=()
          if [ -n "$JOURNEY_LEAVE_OUT" ]; then
            printf '%s\n' "$JOURNEY_LEAVE_OUT" > "$RUNNER_TEMP/leave-out.txt"
            leave=(--test-list-invert "$RUNNER_TEMP/leave-out.txt")
            echo "leaves out $(grep -c . "$RUNNER_TEMP/leave-out.txt") unbuilt tests (tooling/scripts/journey-leave-out.mjs)"
          fi
          code=0
          pnpm exec playwright test --config "$config" --trace off "${split[@]}" "${leave[@]}" || code=$?
          # Playwright's own limit ended the journeys: name it the way Main trust's post-merge job finds a time limit, so
          # it opens the time-limit issue that says to split the shards further. The shard stays red (Main trust reads
          # the limit from a red job's annotations).
          if jq -e '[.errors[]?.message // ""] | any(test("Timed out waiting [0-9.]+s for the"))' "$JOURNEY_REPORT" >/dev/null 2>&1; then
            echo "::error::this shard's journeys reached their time limit ($((JOURNEY_GLOBAL_TIMEOUT_MS / 60000)) minutes); the journeys it did not reach count as not run"
            exit "$code"
          fi
          # Journeys that failed (exit 1, a report, no run-level error) are judged by the run's verdict against the list
          # in the Real-app journeys job, not here, so a shard is red only when something other than a journey failed:
          # Playwright's own error, no report, or any other exit code.
          if [ "$code" -eq 1 ] && jq -e '((.errors // []) | length) == 0 and (.stats.unexpected // 0) > 0' "$JOURNEY_REPORT" >/dev/null 2>&1; then
            echo "::notice::$(jq '.stats.unexpected' "$JOURNEY_REPORT") journey test(s) failed in this shard; the run's verdict judges them against docs/runbooks/journey-baseline.json"
            exit 0
          fi
          exit "$code"

      # The stack serves the Customer app under its production security headers with a report-uri (local-test-stack.mjs,
      # customerSecurityHeaders), so anything a journey's browser was refused (an inline script, a font or a connect to an
      # origin the policy does not list) is recorded. Any violation fails the shard: it would fail in production too.
      - name: No Content-Security-Policy violation (the production policy)
        if: success() || failure()
        run: node tooling/scripts/local-test-stack.mjs csp-report --fail

      # The shard's blob (merged by the scoreboard job), its failure screenshots, and its own JSON report (which the
      # early-break job reads as the shard ends); the run's TEST account files stay on the runner.
      - name: Keep the shard's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-app-journeys-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/journeys/blob
            ${{ runner.temp }}/journeys/report.json
            /tmp/intafaced-real-app/results
          if-no-files-found: warn
          retention-days: 7

      # A journey that failed leaves the shard green (the run's verdict judges it), so the logs print then too: otherwise a
      # flaky step's service-side cause goes with the runner (#8044: svc-ledger did not answer, and nothing kept why).
      - name: Stack logs on failure
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ] && ! jq -e '(.stats.unexpected // 0) > 0' "$JOURNEY_REPORT" >/dev/null 2>&1; then
            exit 0
          fi
          for f in "$LOCAL_STACK_STATE"/logs/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"; tail -200 "$f" || true; echo "::endgroup::"
          done

      - name: Stop the stack
        if: always()
        run: node tooling/scripts/local-test-stack.mjs stop || true

  # Merges the shards into one report: the scoreboard in the summary, and the `real-app-journeys` artifact with
  # report.json that Main trust's post-merge job compares run to run. Its conclusion is the run's verdict: red when any
  # shard was red or sent no report, or when the verdict against the list is red.
  scoreboard:
    name: Real-app journeys
    needs: [touch, journeys]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 80 # healthy run: a few minutes; the shard download may wait up to 65 for a spent API budget to reset
    env:
      JOURNEYS_TARGET: ${{ needs.touch.outputs.target }}
      NOTHING: ${{ needs.touch.outputs.mode == 'none' }}
    permissions:
      contents: read
      actions: read # to download this run's shard artifacts, and the reports the verdict reads
      issues: read # the verdict reads the state line of each regression issue the baseline names
    steps:
      # A run whose touch job didn't finish (GitHub dropped or cancelled it) decided nothing and ran no shards: it fails
      # here, outright, so it never reads as an empty run. The merge seal also fails closed on a run with no report.
      - name: The run decided what it runs
        if: github.ref != 'refs/heads/main' && needs.touch.result != 'success'
        run: |
          echo "::error::the touch job ended '${{ needs.touch.result }}', so this run decided nothing and ran no journeys; re-run the whole run"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: the scoreboard counts merged slice PRs from it, and the verdict reads main's earlier runs' commits
          # for the set-aside list (it refuses a shallow clone).
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # A pull request that touches nothing a journeys run reads (or a draft): no shard ran, the report is empty, and
      # the run is green. The seal reads an empty report as saying nothing about any step or journey file.
      - name: Nothing to run
        if: env.NOTHING == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/journeys"
          echo '{"suites":[],"errors":[],"stats":{"expected":0,"unexpected":0}}' > "$RUNNER_TEMP/journeys/report.json"
          echo "Nothing to run: this pull request touches nothing a journeys run executes or reads (tooling/ci/journey-touch.mjs), or it is a draft." >> "$GITHUB_STEP_SUMMARY"
      - name: Install
        if: env.NOTHING != 'true'
        run: pnpm install --frozen-lockfile

      - name: Merge the shards
        if: env.NOTHING != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD_COUNT: ${{ needs.touch.outputs.count || 8 }}
          WAIT_BUDGET_MINUTES: 65 # the job's timeout-minutes less the time the later steps need
        # A spent API budget is waited out until its reset, never swallowed: run 4084 (12 Nov 2026) hit "API rate limit
        # exceeded for installation" here, saved a report with no report.json, and every pull request's verdict failed on
        # it. Any other refusal fails this step by name (tooling/ci/shard-download.mjs). It prints the token's budget.
        run: |
          mkdir -p "$RUNNER_TEMP/shards" "$RUNNER_TEMP/blobs" "$RUNNER_TEMP/journeys"
          node tooling/ci/shard-download.mjs "$RUNNER_TEMP/shards"
          # One folder per shard artifact; the blob keeps its own name, prefixed so two shards never collide.
          for d in "$RUNNER_TEMP"/shards/real-app-journeys-shard-*; do
            [ -d "$d" ] || continue
            find "$d" -name '*.zip' | while read -r z; do cp "$z" "$RUNNER_TEMP/blobs/$(basename "$d")-$(basename "$z")"; done
          done
          found=$(find "$RUNNER_TEMP/blobs" -name '*.zip' | wc -l)
          echo "shard reports found: $found of $SHARD_COUNT"
          if [ "$found" -gt 0 ]; then
            PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/journeys/report.json" pnpm exec playwright merge-reports --reporter json "$RUNNER_TEMP/blobs" > /dev/null
          fi

      - name: Scoreboard
        if: always() && env.NOTHING != 'true'
        env:
          SHARD_COUNT: ${{ needs.touch.outputs.count || 8 }}
        run: |
          report="$RUNNER_TEMP/journeys/report.json"
          if [ -n "$JOURNEYS_TARGET" ]; then
            echo "**Targeted run:** only the journey files named in the manual run's input, or the pull request's own journey files, ran; every other journey counts as not run below. This run is not main's scoreboard." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$report" ]; then
            node tooling/scripts/roadmap.mjs --progress --results "$report" >> "$GITHUB_STEP_SUMMARY"
            missing=$((SHARD_COUNT - $(find "$RUNNER_TEMP/blobs" -name '*.zip' | wc -l)))
            if [ "$missing" -gt 0 ]; then
              echo "Note: $missing of $SHARD_COUNT shards sent no report (their stack or browser did not start); their journeys count as not passing." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No journey report: no shard's stack or browser started. See the shard jobs." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A shard is red only when something other than its journeys failed (its setup, the stack, the time limit, the
      # Content-Security-Policy check); a shard that sent no report ran nothing the verdict could judge.
      - name: Red when a shard was red or sent no report
        if: always() && env.NOTHING != 'true'
        env:
          SHARDS_RESULT: ${{ needs.journeys.result }}
          SHARD_COUNT: ${{ needs.touch.outputs.count || 8 }}
        run: |
          red=0
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::at least one journeys shard was red for a reason other than its journeys ($SHARDS_RESULT); see the shard jobs"
            red=1
          fi
          found=$(find "$RUNNER_TEMP/blobs" -name '*.zip' 2>/dev/null | wc -l)
          if [ "$found" -lt "$SHARD_COUNT" ]; then
            echo "::error::$((SHARD_COUNT - found)) of $SHARD_COUNT shards sent no report, so their journeys count as not run"
            red=1
          fi
          exit "$red"

      # The verdict (tooling/ci/journey-verdict.mjs): every failing step must be on the list by the runbook's rules, and
      # nothing that passed in the baseline's run may be skipped or missing. It reads the baseline's named run's report,
      # every finished run on main since (a pass there means the step was built) and the regression issues, GET only; an
      # input it can't read is red. On a targeted run it judges only the files the run named.
      - name: Verdict tests
        if: always() && env.NOTHING != 'true'
        run: node --test tooling/ci/journey-verdict.test.mjs
      # It also writes the set-aside list (set-aside.json) and, on main, the stored pass history (pass-history.json) the
      # next verdicts read instead of every run since the baseline; both are kept with the report below.
      - name: Verdict against the list of steps not built yet
        if: always() && env.NOTHING != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/journey-verdict.mjs --report "$RUNNER_TEMP/journeys/report.json" --fetch --set-aside-out "$RUNNER_TEMP/journeys/set-aside.json" --history-out "$RUNNER_TEMP/journeys/pass-history.json"

      # After the verdict, so the set-aside list goes with the report; it runs whatever the verdict says.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-app-journeys
          path: |
            ${{ runner.temp }}/journeys/report.json
            ${{ runner.temp }}/journeys/set-aside.json
          if-no-files-found: warn
      # The stored pass history on its own (about 2 MB, 40 KB zipped, beside a report of about 25 MB), so a verdict reading it
      # downloads only it. Written on main only; nothing to keep elsewhere.
      - name: Keep the pass history
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-app-journeys-pass-history
          path: ${{ runner.temp }}/journeys/pass-history.json
          if-no-files-found: ignore

  # A journeys run on a branch ends here, dispatched or on a pull request in this repository (never main's or a schedule's).
  # It starts merge-seal.yml's seal, or re-runs its verdict, once every input on the head has finished: CI, the CI
  # review, and the journeys run the change needs (journey-seal.mjs --recheck, START_JOB). It needs every other job
  # here, so the seal reads this run as finished while only this job is going (settledRun). It checks out and runs the
  # default branch's script, never the pull request's code. It replaced journey-seal-recheck.yml, a workflow_run
  # workflow that was a run of its own on every finished input, whether it did anything or not
  # (INTAFACED/project-state#1574). Fails closed: if it fails, the seal waits, and a missing seal blocks the merge.
  seal-start:
    name: Start the seal
    needs: [touch, release, early-break, release-after-dispatch, build, journeys, scoreboard]
    if: ${{ !cancelled() && github.ref != 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 6 # healthy run: seconds; waiting out a seal that is already running takes up to 4 minutes
    permissions:
      contents: read
      actions: write # start or re-run merge-seal.yml's seal on this head through the Actions API
      pull-requests: read # the pull requests on the head, their titles and changed files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: .base # every other checkout here is the head's; this one is the default branch's script alone
      - name: Start the seal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FINISHED: Real-app journeys
        run: node .base/tooling/ci/journey-seal.mjs --recheck
