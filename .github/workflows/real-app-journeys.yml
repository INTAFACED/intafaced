# Journeys in the running app (apps/customer/tests/real-app): the local test stack built from main, the customer app
# in Chromium, nothing mocked. Runs after merge (push to main), once a day on main's newest commit, and on
# workflow_dispatch, never on pull requests, and is not a required check. Main trust's post-merge job compares its
# steps run to run (tooling/ci/post-merge-trust.mjs), so a journey that does not pass yet opens no issue; the run goes
# red and the summary shows the scoreboard from `roadmap.mjs --progress --results`.
#
# The journeys run in shards, each on its own fresh stack, and one job merges the shards' reports into the scoreboard.
# (Failure it prevents: one job running every journey hit its 45-minute limit from 23 Oct 02:26 UTC, runs 122, 140 and
# 155, so no run finished and the scoreboard froze. Setup takes about 14 minutes and the journeys run one at a time, so
# the suite outgrew one job and keeps growing.) Journey files are independent: each makes its own accounts and keeps its
# own run file, so the plan job can split them by file.
name: Real-app journeys

on:
  # A manual run on a branch other than main may name journey files; it then runs only those (owner decision
  # 2026-10-30), so a builder proves its own journey on CI's stack without the whole suite. Runs on main, on push and on
  # the schedule always run the full suite, and Main trust and the shard planner read main's runs only.
  workflow_dispatch:
    inputs:
      journeys:
        description: 'Journey files to run, separated by spaces or commas (e.g. J-wallet-05.pw.mjs). Ignored on main.'
        required: false
        default: ''
        type: string
  # One full run a day on main's newest commit, even on a day nothing merges under the paths below, so a finished run
  # is never more than about a day old (#6416). It starts about three hours before the 00:00 UTC daily line, so it has
  # usually finished by then even when it waits behind a push run. On the same commit as the run before it, a step
  # that flips is a flake, which Main trust's issue then says.
  # Ends: never on its own: the daily journey run on main. A stop disables it until the lift
  # (project-state handover/STOP.md); it is removed only by a PR when the owner retires the journeys.
  schedule:
    - cron: '43 20 * * *'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'tooling/scripts/local-test-*.mjs'
      - 'tooling/scripts/roadmap.mjs'
      - 'tooling/scripts/journey-shards*.mjs'
      - 'tooling/scripts/journey-fail-fast.mjs'
      - 'docs/runbooks/journey-baseline.json'
      - '.github/workflows/real-app-journeys.yml'

# On main, runs overlap: each push, scheduled run and manual run on main is its own group, so a new run neither cancels
# nor waits on one already running (owner request 2026-11-01, OWNER 154 point 8: with the merge queue, main moves in
# batches and every batch's journeys report). Nothing needs one run at a time: every shard starts its own stack on its own
# runner, artifacts are per run, the planner reads finished runs only, and Main trust compares finished runs by when they
# were created (tooling/ci/post-merge-trust.mjs earlierRuns), so a run that ends before an older one is still compared in
# order. Measured 1 Nov: run 1137's 22 shards and CI's 12 jobs started within the same two seconds, so overlapping runs do
# not queue behind each other for runners. (Failure the old rule prevented, and this keeps prevented: with
# cancel-in-progress, every run from 22 Oct 23:35 to 23 Oct 01:06 UTC was cancelled before it reached the journeys. Nothing
# here cancels.) Elsewhere (a manual run on a branch) a run that started finishes and newer ones wait, as before.
concurrency:
  group: real-app-journeys-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # The journey files of a targeted run; empty (the full suite) on main and for every push or scheduled run.
  JOURNEYS_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.journeys || '' }}
  # Playwright stops a shard's journeys after an hour, before the job's own limit, so the shard still sends its report;
  # the planner warns when a shard comes near it.
  JOURNEY_GLOBAL_TIMEOUT_MS: 3600000

jobs:
  # Splits the journey files across the shards by their times in the last finished runs on main, so the shards end
  # together (tooling/scripts/journey-shards.mjs; Playwright's own --shard split by count left one shard 33 minutes
  # behind the shortest in run 338), and picks how many shards keep each near 25 minutes of journeys (8 to 24), so the
  # suite can grow without a shard reaching its limit. If planning fails for any reason the run falls back to 8 shards
  # and Playwright's split, so a broken planner never stops a run; on a suite that needs more shards, journeys past a
  # shard's limit then count as not run and the time-limit issue names the shards. A targeted run (JOURNEYS_TARGET) never
  # falls back: a name that is not a journey file fails this job, and no shard runs.
  plan:
    name: Plan the shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # to download the last finished runs' reports
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      fast_steps: ${{ steps.fast.outputs.steps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      # Up to three, so a run that lost a shard or failed a journey early does not make those files look fast. Most runs
      # are queued runs a newer push replaced (cancelled), so the list reaches back 100 runs to find three that finished.
      - name: Last finished runs' reports
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          got=0
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow real-app-journeys.yml --branch main --status completed --limit 100 --json databaseId,conclusion --jq '.[] | select(.conclusion != "cancelled") | .databaseId'); do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name real-app-journeys --dir "$RUNNER_TEMP/last/$id" 2>/dev/null || continue
            echo "timings from run $id"
            got=$((got + 1))
            [ "$got" -ge 3 ] && break
          done
          # The newest finished scheduled run too: it keeps the ordinary limits, so a step built since the baseline passes
          # there (the fail-fast list below leaves it out). Kept apart, so the shard plan reads the last runs as before.
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow real-app-journeys.yml --branch main --event schedule --status completed --limit 10 --json databaseId,conclusion --jq '.[] | select(.conclusion != "cancelled") | .databaseId'); do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name real-app-journeys --dir "$RUNNER_TEMP/scheduled/$id" 2>/dev/null || continue
            echo "fail-fast reads the scheduled run $id"
            break
          done
      - name: Plan
        id: plan
        continue-on-error: true
        run: |
          node --test tooling/scripts/journey-shards.test.mjs
          reports=()
          for f in "$RUNNER_TEMP"/last/*/report.json; do [ -f "$f" ] && reports+=(--report "$f"); done
          only=()
          [ -n "$JOURNEYS_TARGET" ] && only=(--only "$JOURNEYS_TARGET")
          shards=$(node tooling/scripts/journey-shards.mjs --shards auto "${reports[@]}" "${only[@]}")
          {
            echo "shards=$shards"
            echo "matrix=$(jq -c '[range(1; length + 1)]' <<<"$shards")"
            echo "count=$(jq length <<<"$shards")"
          } >> "$GITHUB_OUTPUT"
      # The steps that fail fast (tooling/scripts/journey-fail-fast.mjs): the baseline's unbuilt steps that passed in none
      # of the runs read above. Best effort: without it nothing fails fast.
      - name: Fail-fast list
        id: fast
        continue-on-error: true
        run: |
          node --test tooling/scripts/journey-fail-fast.test.mjs
          reports=()
          for f in "$RUNNER_TEMP"/last/*/report.json "$RUNNER_TEMP"/scheduled/*/report.json; do [ -f "$f" ] && reports+=(--report "$f"); done
          echo "steps=$(node tooling/scripts/journey-fail-fast.mjs --plan "${reports[@]}")" >> "$GITHUB_OUTPUT"
      - name: Targeted run has its plan
        if: env.JOURNEYS_TARGET != '' && steps.plan.outputs.shards == ''
        run: |
          echo "::error::the journeys input names a file that is not a journey file under apps/customer/tests/real-app (the Plan step's log names it), so nothing runs"
          exit 1
      - name: The journeys input is ignored on main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.journeys != ''
        run: echo "::warning::a run on main always runs the full suite; the journeys input applies only on another branch"

  # The stack's builds, once per run, beside the planner and the shards' own setup; every shard then starts on them
  # instead of building again (measured on run 1138: 1m37s of each of 21 shards' setup was these same builds). The outputs travel with the stack's
  # build stamp, which `start` checks against its own checkout (same commit, no edits), so a shard that receives anything
  # else, or nothing, builds it itself as before (local-test-stack.mjs buildStillFresh).
  build:
    name: Build the stack once
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # healthy run: about 3 minutes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      # The stack runs its builds with a clean PATH that holds node's own folder, not the folder pnpm/action-setup uses.
      - name: Put pnpm next to node
        run: ln -sf "$(command -v pnpm)" "$(dirname "$(command -v node)")/pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build what the stack starts
        run: LOCAL_STACK_STATE="$RUNNER_TEMP/stack-state" node tooling/scripts/local-test-stack.mjs build --no-admin
      # Everything the build wrote: git's ignored paths outside node_modules and turbo's cache (the dist folders), and the
      # stamp. Not the founder console's .next: Next.js writes its preview signing key and server-actions encryption key
      # into it, and this repository's artifacts are public, so this job does not build it (--no-admin) and each shard
      # builds the console itself (about 37 s), which its own stamp fields, absent here, tell `start` to do.
      - name: Pack the build
        run: |
          git ls-files --others --ignored --exclude-standard --directory | grep -Ev '(^|/)(node_modules|\.turbo)/' | grep -v '^apps/admin/\.next' > "$RUNNER_TEMP/outputs.txt"
          echo "$(wc -l < "$RUNNER_TEMP/outputs.txt") build outputs"
          # Fails closed: per output, a match (grep exit 0) or an unreadable one (2) stops the pack; only no match (1) goes on.
          while IFS= read -r out; do
            code=0
            grep -rlE 'previewModeSigningKey|"encryptionKey"' -- "$out" || code=$?
            if [ "$code" -ne 1 ]; then
              echo "::error::$out holds a signing or encryption key, or could not be read (grep exit $code), and the build artifact is public"
              exit 1
            fi
          done < "$RUNNER_TEMP/outputs.txt"
          mkdir -p "$RUNNER_TEMP/stack-build"
          tar -cf "$RUNNER_TEMP/stack-build/outputs.tar" -T "$RUNNER_TEMP/outputs.txt"
          jq 'with_entries(select(.key | startswith("admin") | not))' "$RUNNER_TEMP/stack-state/build-stamp.json" > "$RUNNER_TEMP/stack-build/build-stamp.json"
          du -sh "$RUNNER_TEMP/stack-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-app-journeys-build
          path: ${{ runner.temp }}/stack-build
          retention-days: 1
          if-no-files-found: error

  journeys:
    name: Journeys (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    # Not on the build job: a shard's own setup runs beside it, and only the step that takes its build waits for it.
    needs: [plan]
    permissions:
      contents: read
      actions: read # to read the build job's state and download its build
    # The shards run even when planning failed (they fall back to Playwright's split), except a targeted run's.
    if: ${{ !cancelled() && !(needs.plan.result == 'failure' && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.journeys != '') }}
    runs-on: ubuntu-24.04
    # Setup (about 10 minutes, once 21 when the browser's system packages were slow) plus at most 60 minutes of journeys,
    # which Playwright stops itself (JOURNEY_GLOBAL_TIMEOUT_MS below), so the job's own limit is never what ends a shard
    # and a long shard still sends its report. (Failure it prevents: a shard the job limit cuts sends no report at all.)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix || '[1, 2, 3, 4, 5, 6, 7, 8]') }}
    # The owner's labelled TEST screening placeholder, for every stack command in this job (see the check step). Secrets,
    # not variables, so the logs show *** and not the list.
    env:
      INTAFACED_SANCTIONS_REGIONS: ${{ secrets.INTAFACED_SANCTIONS_REGIONS }}
      INTAFACED_SANCTIONS_LIST_SOURCE: ${{ secrets.INTAFACED_SANCTIONS_LIST_SOURCE }}
    steps:
      # A targeted run never falls back to the full suite: without its plan (a name that is not a journey file, or a
      # broken planner) it stops here.
      - name: Targeted run has its plan
        if: env.JOURNEYS_TARGET != ''
        env:
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          if [ -z "$SHARDS" ]; then
            echo "::error::the journeys input has no shard plan; see the Plan the shards job for the file it refused"
            exit 1
          fi
      # The runner context is not allowed in a job's env, so the paths under the runner's temp folder are set here.
      - name: Paths
        run: |
          echo "LOCAL_STACK_STATE=$RUNNER_TEMP/stack-state" >> "$GITHUB_ENV"
          echo "LOCAL_STACK_NATS_BIN=$RUNNER_TEMP/nats-server" >> "$GITHUB_ENV"
          echo "LOCAL_STACK_ANVIL_BIN=$RUNNER_TEMP/anvil" >> "$GITHUB_ENV"
          echo "JOURNEY_REPORT=$RUNNER_TEMP/journeys/report.json" >> "$GITHUB_ENV"
          echo "JOURNEY_BLOB_DIR=$RUNNER_TEMP/journeys/blob" >> "$GITHUB_ENV"

      # Edge refuses every money read without a screening list (edge.screening_unset), and the stack never invents one.
      # The runner takes the owner's labelled TEST placeholder from two repository secrets, never from this file.
      - name: Screening placeholder is set
        run: |
          if [ -z "$INTAFACED_SANCTIONS_REGIONS" ] || [ -z "$INTAFACED_SANCTIONS_LIST_SOURCE" ]; then
            msg="Blocked: the repository secrets INTAFACED_SANCTIONS_REGIONS and INTAFACED_SANCTIONS_LIST_SOURCE are unset, so Edge would refuse every money read (edge.screening_unset). The owner sets them once (Settings, Secrets and variables, Actions, Secrets)."
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$msg"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      # The stack refuses to start under 14 GB free; the runner image ships toolchains this job never uses. Removing them
      # took 2m20s of every shard (run 1138) on runners that already had far more free than the stack needs (101 GB after,
      # 44 GB used of 145), so they go only when the disk is short.
      - name: Free disk space (only when short)
        run: |
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$avail" -lt 30 ]; then
            echo "only ${avail} GB free: removing the toolchains this job never uses"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
            df -h /
          else
            echo "${avail} GB free: nothing to remove"
          fi

      # The stack runs its builds with a clean PATH that holds node's own folder, not the folder pnpm/action-setup uses.
      - name: Put pnpm next to node
        run: ln -sf "$(command -v pnpm)" "$(dirname "$(command -v node)")/pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Get a nats-server binary
        run: |
          docker create --name nats-src nats:2.10.24-alpine
          docker cp nats-src:/usr/local/bin/nats-server "$LOCAL_STACK_NATS_BIN"
          docker rm nats-src
          chmod +x "$LOCAL_STACK_NATS_BIN"

      # The stack's LOCAL TEST chain (tooling/scripts/local-test-chain.mjs): the same pinned foundry image and the same
      # `docker run <image> "anvil ..."` form .github/actions/test-infra runs its dev chain with, behind a small launcher,
      # since the stack starts its chain as a process. Host network, so anvil binds the loopback port the stack names.
      # Dev only and ephemeral: TEST chain id 84532 on loopback, no fork, destroyed with the runner.
      - name: Get an anvil launcher
        run: |
          docker pull ghcr.io/foundry-rs/foundry:v1.5.1
          cat > "$LOCAL_STACK_ANVIL_BIN" <<'EOF'
          #!/bin/sh
          exec docker run --rm --init --network host ghcr.io/foundry-rs/foundry:v1.5.1 "anvil $*"
          EOF
          chmod +x "$LOCAL_STACK_ANVIL_BIN"

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # The run's one build (the build job), with its stamp in this shard's stack state, taken as late as possible so the
      # setup above runs beside the build. It waits for that job at most 10 minutes. Best effort: without the build (the
      # job failed or is late), or when the stamp does not vouch for this checkout, `start` builds as before.
      - name: Take the run's build
        continue-on-error: true
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=""
          for _ in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select(.name == "Build the stack once") | "\(.status) \(.conclusion)"' | head -1)
            case "$state" in completed\ *) break ;; esac
            sleep 10
          done
          echo "build job: ${state:-not found}"
          if [ "$state" != "completed success" ]; then
            echo "::warning::no build from this run (${state:-not found}); this shard builds the stack itself"
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name real-app-journeys-build --dir "$RUNNER_TEMP/stack-build"
          tar -xf "$RUNNER_TEMP/stack-build/outputs.tar"
          mkdir -p "$LOCAL_STACK_STATE"
          chmod 700 "$LOCAL_STACK_STATE"
          cp "$RUNNER_TEMP/stack-build/build-stamp.json" "$LOCAL_STACK_STATE/"
          rm -f "$RUNNER_TEMP/stack-build/outputs.tar"

      - name: Start the local test stack (TEST funds only)
        run: |
          df -h /
          node tooling/scripts/local-test-stack.mjs start

      # A fresh stack trades only after the TEST gates open the markets and verify the market maker's two TEST accounts
      # (docs/LOCAL-TEST-STACK.md, "A fresh stack"). Matching reads its operator seats when it starts, so it restarts
      # after the founders enrolled. The market maker refuses to start on closed markets and creates its accounts when it
      # starts, so `verify` runs after it. It stops again before `verify`, so no market trades before `history`: that
      # writes the TEST tape history the chart journeys read (real TEST trades whose times svc-trade moves into the past,
      # docs/LOCAL-TEST-STACK.md, "Chart history"), and it only writes on a market with no trades yet. It exits non-zero
      # when any market comes up short, and that fails this step on purpose: chart journeys on a partial history would
      # fail later for a reason the log no longer shows.
      - name: Open the TEST markets, write TEST chart history, start the TEST market maker
        run: |
          node tooling/scripts/local-test-stack.mjs restart matching
          node tooling/scripts/local-test-gates.mjs apply
          node tooling/scripts/local-test-market.mjs
          # The market maker registers its accounts in the background; verify only once both exist.
          for _ in $(seq 1 30); do
            grep -Eq 'taker (created|existing) \(test_taker\)' "$LOCAL_STACK_STATE/logs/market.log" 2>/dev/null && break
            sleep 2
          done
          node tooling/scripts/local-test-market.mjs stop
          node tooling/scripts/local-test-gates.mjs verify
          node tooling/scripts/local-test-market.mjs history
          node tooling/scripts/local-test-market.mjs

      # Labelled TEST rows (earn pools, loan products, a TEST P2P method) so those rooms show working, after the gates
      # published the limits they need (docs/LOCAL-TEST-STACK.md, "Local test content"). Production stays blank.
      - name: Load the TEST content
        run: LOCAL_TEST=1 node tooling/scripts/local-test-seed.mjs apply --state "$LOCAL_STACK_STATE"

      - name: Wait for the first BTC/USDT trade
        run: |
          for _ in $(seq 1 60); do
            grep -q 'BTC/USDT crossing trade by test_taker: .* -> HTTP 201' "$LOCAL_STACK_STATE/logs/market.log" 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::no BTC/USDT trade from the TEST market maker within 5 minutes"
          tail -40 "$LOCAL_STACK_STATE/logs/market.log"
          exit 1

      # No traces: they would carry the run's TEST session and password into a public artifact. Screenshots stay.
      # The plan's files for this shard, or Playwright's own split when the plan is missing.
      - name: Journeys in the running app (this shard)
        env:
          # A full run on a push or by hand fails fast on the plan's list: the baseline's unbuilt steps that passed in
          # no finished run read (tooling/scripts/journey-fail-fast.mjs). The daily scheduled run keeps the ordinary
          # limits, so a step built since the baseline was written passes on main under them; a targeted run, where a
          # builder proves a step, keeps them too.
          JOURNEY_FAIL_FAST: ${{ env.JOURNEYS_TARGET == '' && github.event_name != 'schedule' && '1' || '0' }}
          JOURNEY_FAIL_FAST_STEPS: ${{ needs.plan.outputs.fast_steps }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          config=apps/customer/tests/real-app/real-app.playwright.config.mjs
          split=()
          if [ -z "$SHARDS" ]; then
            echo "::warning::no shard plan (see the Plan the shards job), so Playwright splits the journeys by count"
            split=(--shard "$SHARD/$TOTAL")
          else
            if [ "$(jq length <<<"$SHARDS")" != "$TOTAL" ]; then
              echo "::error::the plan has $(jq length <<<"$SHARDS") shards and the matrix $TOTAL; change both together"
              exit 1
            fi
            JOURNEY_FILES=$(jq -r --argjson n "$SHARD" '.[$n - 1]' <<<"$SHARDS")
            echo "$JOURNEY_FILES" | tr ' ' '\n'
            export JOURNEY_FILES
          fi
          code=0
          pnpm exec playwright test --config "$config" --trace off "${split[@]}" || code=$?
          # Playwright's own limit ended the journeys: name it the way Main trust's post-merge job finds a time limit, so
          # it opens the time-limit issue that says to split the shards further.
          if jq -e '[.errors[]?.message // ""] | any(test("Timed out waiting [0-9.]+s for the"))' "$JOURNEY_REPORT" >/dev/null 2>&1; then
            echo "::error::this shard's journeys reached their time limit ($((JOURNEY_GLOBAL_TIMEOUT_MS / 60000)) minutes); the journeys it did not reach count as not run"
          fi
          exit "$code"

      # The stack serves the Customer app under its production security headers with a report-uri (local-test-stack.mjs,
      # customerSecurityHeaders), so anything a journey's browser was refused (an inline script, a font or a connect to an
      # origin the policy does not list) is recorded. Any violation fails the shard: it would fail in production too.
      - name: No Content-Security-Policy violation (the production policy)
        if: success() || failure()
        run: node tooling/scripts/local-test-stack.mjs csp-report --fail

      # The shard's blob (merged by the scoreboard job) and its failure screenshots; the run's TEST account files stay
      # on the runner.
      - name: Keep the shard's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-app-journeys-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/journeys/blob
            /tmp/intafaced-real-app/results
          if-no-files-found: warn
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: |
          for f in "$LOCAL_STACK_STATE"/logs/*.log; do echo "::group::$f"; tail -40 "$f"; echo "::endgroup::"; done

      - name: Stop the stack
        if: always()
        run: node tooling/scripts/local-test-stack.mjs stop || true

  # Merges the shards into one report: the scoreboard in the summary, and the `real-app-journeys` artifact with
  # report.json that Main trust's post-merge job compares run to run. Red when any shard was red.
  scoreboard:
    name: Real-app journeys
    needs: [plan, journeys]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # to download this run's shard artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scoreboard counts merged slice PRs from history
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Merge the shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD_COUNT: ${{ needs.plan.outputs.count || 8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/shards" "$RUNNER_TEMP/blobs" "$RUNNER_TEMP/journeys"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'real-app-journeys-shard-*' --dir "$RUNNER_TEMP/shards" || true
          # One folder per shard artifact; the blob keeps its own name, prefixed so two shards never collide.
          for d in "$RUNNER_TEMP"/shards/real-app-journeys-shard-*; do
            [ -d "$d" ] || continue
            find "$d" -name '*.zip' | while read -r z; do cp "$z" "$RUNNER_TEMP/blobs/$(basename "$d")-$(basename "$z")"; done
          done
          found=$(find "$RUNNER_TEMP/blobs" -name '*.zip' | wc -l)
          echo "shard reports found: $found of $SHARD_COUNT"
          if [ "$found" -gt 0 ]; then
            PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/journeys/report.json" pnpm exec playwright merge-reports --reporter json "$RUNNER_TEMP/blobs" > /dev/null
          fi

      - name: Scoreboard
        if: always()
        env:
          SHARD_COUNT: ${{ needs.plan.outputs.count || 8 }}
        run: |
          report="$RUNNER_TEMP/journeys/report.json"
          if [ -n "$JOURNEYS_TARGET" ]; then
            echo "**Targeted run:** only the journey files named in the manual run ran; every other journey counts as not run below. This run is not main's scoreboard." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$report" ]; then
            node tooling/scripts/roadmap.mjs --progress --results "$report" >> "$GITHUB_STEP_SUMMARY"
            missing=$((SHARD_COUNT - $(find "$RUNNER_TEMP/blobs" -name '*.zip' | wc -l)))
            if [ "$missing" -gt 0 ]; then
              echo "Note: $missing of $SHARD_COUNT shards sent no report (their stack or browser did not start); their journeys count as not passing." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No journey report: no shard's stack or browser started. See the shard jobs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-app-journeys
          path: ${{ runner.temp }}/journeys/report.json
          if-no-files-found: warn

      - name: Red when a shard was red
        if: needs.journeys.result != 'success'
        run: |
          echo "::error::at least one journeys shard did not pass (${{ needs.journeys.result }}); see the shard jobs and the scoreboard"
          exit 1
