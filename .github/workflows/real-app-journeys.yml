name: Real-app journeys
# PROBE C: run-name static, concurrency as on main
run-name: probe C static
on:
  workflow_dispatch:
    inputs:
      journeys:
        required: false
        default: ''
        type: string
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'real-app-journeys-main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && format('real-app-journeys-runs-nothing-{0}', github.run_id) || (github.event_name == 'pull_request' && github.event.action == 'ready_for_review') && format('real-app-journeys-ready-{0}', github.run_id) || format('real-app-journeys-{0}:{1}', github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref, inputs.journeys) }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  JOURNEYS_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.journeys || '' }}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${#JOURNEYS_TARGET} chars"
