name: Real-app journeys
# PROBE B: run-name as on main, concurrency group static
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Real-app journeys by hand, {0}', github.ref != 'refs/heads/main' && inputs.journeys != '' && inputs.journeys || 'full') || '' }}
on:
  workflow_dispatch:
    inputs:
      journeys:
        required: false
        default: ''
        type: string
concurrency:
  group: probe-static-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  JOURNEYS_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.journeys || '' }}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${#JOURNEYS_TARGET} chars"
