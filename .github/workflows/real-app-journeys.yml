# Journeys in the running app (apps/customer/tests/real-app): the local test stack built from main, the customer app
# in Chromium, nothing mocked. Runs after merge (push to main) and on workflow_dispatch, never on pull requests, and is
# not a required check. Main trust watches only CI, so a journey that does not pass yet opens no "Main is red" issue;
# the job goes red and the step summary shows the scoreboard from `roadmap.mjs --progress --results`.
name: Real-app journeys

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'tooling/scripts/local-test-*.mjs'
      - 'tooling/scripts/roadmap.mjs'
      - '.github/workflows/real-app-journeys.yml'

# The scoreboard reads the newest main, so a newer push replaces a run still going.
concurrency:
  group: real-app-journeys-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  journeys:
    name: Real-app journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LOCAL_STACK_STATE: ${{ runner.temp }}/stack-state
      LOCAL_STACK_NATS_BIN: ${{ runner.temp }}/nats-server
      JOURNEY_REPORT: ${{ runner.temp }}/journeys/report.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scoreboard counts merged slice PRs from history
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      # The stack refuses to start under 14 GB free; the runner image ships toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      # The stack runs its builds with a clean PATH that holds node's own folder, not the folder pnpm/action-setup uses.
      - name: Put pnpm next to node
        run: ln -sf "$(command -v pnpm)" "$(dirname "$(command -v node)")/pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Get a nats-server binary
        run: |
          docker create --name nats-src nats:2.10.24-alpine
          docker cp nats-src:/usr/local/bin/nats-server "$LOCAL_STACK_NATS_BIN"
          docker rm nats-src
          chmod +x "$LOCAL_STACK_NATS_BIN"

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the local test stack (TEST funds only)
        run: |
          df -h /
          node tooling/scripts/local-test-stack.mjs start

      # No traces: they would carry the run's TEST session and password into a public artifact. Screenshots stay.
      - name: Journeys in the running app
        run: pnpm exec playwright test --config apps/customer/tests/real-app/real-app.playwright.config.mjs --trace off

      - name: Scoreboard
        if: always()
        run: |
          if [ -f "$JOURNEY_REPORT" ]; then
            node tooling/scripts/roadmap.mjs --progress --results "$JOURNEY_REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No journey report: the stack or the browser did not start. See the steps above." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The report and the failure screenshots only; the run's TEST account file stays on the runner.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-app-journeys
          path: |
            ${{ runner.temp }}/journeys/report.json
            /tmp/intafaced-real-app/results
          if-no-files-found: warn

      - name: Stack logs on failure
        if: failure()
        run: |
          for f in "$LOCAL_STACK_STATE"/logs/*.log; do echo "::group::$f"; tail -40 "$f"; echo "::endgroup::"; done

      - name: Stop the stack
        if: always()
        run: node tooling/scripts/local-test-stack.mjs stop || true
