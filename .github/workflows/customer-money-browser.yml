# Money screen browser checks (Playwright, mocked API, no services). Runs after merge (push to main) when the customer app,
# or what it is built from, changes, and on workflow_dispatch, not on pull requests: runner capacity was the merge bottleneck
# and this is not a required check (owner decision 2026-10-20). The ceiling then was the free plan's 20 concurrent jobs;
# on 9 Nov 2026 it measured about 180 concurrent jobs, peaks to 230 (project-state#1906). A screen and its browser check
# drifted apart once and nothing noticed because no job ran this suite.
name: Customer Money browser checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'packages/ui/**'
      - 'packages/i18n/**'
      - 'packages/exchange-contract/**'
      - 'packages/contracts/**'
      - '.github/workflows/customer-money-browser.yml'

concurrency:
  group: customer-money-browser-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  money:
    name: Money browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the packages the customer app imports
        run: pnpm exec turbo run build --filter=@intafaced/customer^...

      # The system libraries come from Ubuntu's package mirror, which is an outside host (failure it prevents: on 11 Nov
      # run 43034265923 went red on main because `apt-get` could not resolve the mirror for 10 minutes, before any test
      # ran; #7997). The install gets 5 minutes; if the mirror is down, the browser alone is installed and runs on the
      # libraries GitHub's runner image already has. A missing library still fails the next step, never this one quietly.
      - name: Install the browser
        timeout-minutes: 8
        run: |
          if timeout --kill-after=30 300 pnpm exec playwright install --with-deps chromium; then exit 0; fi
          echo "::warning::system libraries could not be installed (the Ubuntu mirror); installing the browser alone"
          pnpm exec playwright install chromium

      - name: Money screen in the harness
        run: pnpm exec playwright test --config apps/customer/src/screens/money/money.playwright.config.mjs
