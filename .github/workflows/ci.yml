name: CI

on:
  # RESTORED 2026-08-07: push:main is back.
  #
  # It was removed on 2026-08-04 as a thrift measure, to stop "double-billing"
  # a merge out of "a 2,000-minute monthly pool". That pool was a private-repo
  # quota. This repo is public — the bill is zero — but free runners are not
  # permission to ignore a 403 or 429 from GitHub; that is a stop.
  #
  # What it cost while it was off: nothing verified main after a merge. Two PRs
  # that each passed independently could land and leave the trunk red, on a repo
  # that moves money. That is exactly what #901 ("main is red") and #221 were.
  # A PR check proves the branch was green; only a push check proves the trunk is.
  #
  # Docs-only PRs run this workflow so the required "Doctrine gates" job
  # reports. A path filter that skipped docs/** and **/*.md left that check
  # missing, and a required check that never reports cannot merge. Test shards
  # still skip docs and markdown: tooling/ci/ci-affected.mjs ignores them.
  # INTAFACED_DEFINITIVE_BUILD.md stays listed because coverage-check reads it.
  # Agent-rule markdown stays listed so a rules-only change cannot be treated
  # as docs-only. tooling/scripts/merge-gate.mjs mirrors this list and its
  # test fails on drift. The last matching pattern wins.
  push:
    branches: [main]
  pull_request:
    paths:
      - '**'
      - INTAFACED_DEFINITIVE_BUILD.md
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '**/AGENT_PROTOCOL.md'
      - '**/SKILL.md'
      - 'tooling/agent-protocol/**'
      - '.agents/**'
      - '.cursor/rules/**'
  workflow_dispatch:

# CONCURRENCY — main vs PR (law 2026-08-09, Denon+Nitro greenlit)
#
# Group is still per-ref. That means concurrent runs on *different* PR branches
# never cancel each other; only a new push to the *same* ref can.
#
# `cancel-in-progress` is **false on main**, true everywhere else:
# - On `refs/heads/main`, a swarm merge burst used to cancel ~95% of trunk CI
#   runs before they finished. Intermediate tips never got a real green/red
#   signal; defects landed via cancelled post-merge checks (worked example:
#   #1466 → cancelled main CI → brand-scan red tip → fleet freeze → #1471).
#   The bill is zero on a public repo — finishing every main run is the point
#   of push:main, not a cost trade. A 403 or 429 is still a stop.
# - On PR refs, still cancel: force-push / tip-bump on one branch supersedes
#   the prior run. That is the only legitimate thrift leftover.
#
# Other workflows in this repo are pull_request-only (or deploy), so they keep
# their own cancel settings. Only this file is the trunk signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default; a job that needs more declares its own block.
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

# Every job carries a timeout-minutes of 2-3x its healthy run. The GitHub default
# is 360 minutes: one hung svc-bank file held Tests (full) for an hour on
# 2026-10-13 (run 38354707403) before this was set.
jobs:
  gates:
    name: Doctrine gates
    runs-on: ubuntu-latest
    timeout-minutes: 10 # healthy run: 1 min
    steps:
      # fetch-depth: 0 — the value-gate step at the end of this job needs
      # `origin/main` and ten ancestor subjects. The default is 1, which gives
      # it neither, and a gate that can see nothing must never print clean.
      # 49 MiB of pack for 818 commits; the pnpm install below costs more.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ONE STEP, ON PURPOSE — and this is the point of the change.
      #
      # This was eleven hand-written steps. `pnpm verify` kept its own separate
      # list in package.json, and the two were maintained by nobody in
      # particular. They drifted: `scan:dual-book-door-paths` and `scan:test-db`
      # ran here and nowhere local, so an engineer could run `pnpm verify`
      # green, push, and land red on a gate they had no local way of running.
      # AGENTS.md tells every human and every agent that verify is the
      # pre-flight check. That promise only holds if verify runs what this job
      # runs, and the only way to guarantee that is one list.
      #
      # `tooling/ci/gates.mjs` is that list. It fails if this workflow stops
      # calling it, and it fails if a scan appears in tooling/ci/ that neither
      # the gate list nor the documented exclusions claim — which is how
      # a scan once sat wired to nothing for weeks. Individual scans keep
      # their `pnpm scan:*` scripts for running one at a time.
      #
      # It also de-duplicates: six of these scans used to run twice per CI run,
      # once here and again inside dod-gate.mjs.
      #
      # Still first, still its own job: a branding leak or a custody violation
      # is not something to discover after a ten-minute test run. The runner
      # does not stop at the first failure, so every broken gate shows up in one
      # run rather than one per push.
      - name: Doctrine gates (the same list `pnpm verify` runs)
        run: pnpm gates

      # Runs main's copy of the guard, never the PR's, so a PR cannot loosen
      # the rules it is judged by. Falls back to the PR copy only while main
      # has none (the PR that introduces it).
      - name: Test-diff guard (rules from main)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        # look-baselines.mjs is the guard's one import (what a look baseline is); it comes from main the same way.
        run: |
          for f in test-diff-guard.mjs look-baselines.mjs; do
            if git cat-file -e "origin/main:tooling/ci/$f" 2>/dev/null; then
              git show "origin/main:tooling/ci/$f" > "$RUNNER_TEMP/$f"
            else
              cp "tooling/ci/$f" "$RUNNER_TEMP/$f"
            fi
          done
          node "$RUNNER_TEMP/test-diff-guard.mjs"

      # The redesign's drift lint, from main like the guard above: changed lines in apps/customer and packages/ui/src/lit take
      # their look from role tokens (no raw colours, pixel sizes or left/right sides). It ratchets: lines already on
      # main are not judged. Owner decision 2026-10-26 (redesign plan v2, lane B0). It runs when the guard above fails
      # too, so one run names both kinds of finding.
      - name: Look drift (rules from main)
        if: github.event_name == 'pull_request' && !cancelled()
        run: |
          if git cat-file -e origin/main:tooling/ci/look-drift.mjs 2>/dev/null; then
            git show origin/main:tooling/ci/look-drift.mjs > "$RUNNER_TEMP/look-drift.mjs"
          else
            cp tooling/ci/look-drift.mjs "$RUNNER_TEMP/look-drift.mjs"
          fi
          node "$RUNNER_TEMP/look-drift.mjs"

      # The per-service Definition of Done (`pnpm gate`) used to be its own
      # `dod` job: a second runner and a second install for a two-second
      # script. It never blocked a merge (it ran after the seal and was not
      # required), and it has been red on main. It runs here now, reported
      # but not blocking, so its findings stay visible without the extra job.
      - name: Definition of Done (reported, not blocking)
        if: always()
        continue-on-error: true
        run: pnpm gate

  changes:
    name: Affected tests
    runs-on: ubuntu-latest
    timeout-minutes: 10 # healthy run: under 1 min; a slow registry install passed 5 min on three PRs on 2026-10-22
    outputs:
      full: ${{ steps.cls.outputs.full }}
      affected: ${{ steps.cls.outputs.affected }}
      shards: ${{ steps.cls.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tooling/ci/ci-affected.mjs --self-test
      - run: node tooling/ci/review-marker.mjs --self-test
      - run: node tooling/ci/review-signoff.mjs --self-test
      - run: node tooling/ci/main-trust.mjs --self-test
      - run: node tooling/ci/post-merge-trust.mjs --self-test
      - run: node tooling/ci/bisect-main.mjs --self-test
      - run: node tooling/ci/test-shards.mjs --self-test
      - run: node tooling/ci/test-diff-guard.mjs --self-test
      - run: node tooling/ci/look-drift.mjs --self-test
      - run: node tooling/ci/cross-package-reads.mjs --self-test
      - run: node tooling/ci/boundary-scan.mjs --self-test
      - run: node tooling/ci/why-red.mjs --self-test
      - run: node tooling/ci/migration-check.mjs --self-test
      - id: cls
        name: Classify changed paths
        run: node tooling/ci/ci-affected.mjs --github-output

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10 # healthy run: 1-2 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: format:check
        run: pnpm format:check

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20 # healthy run: 4-11 min
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 — an affected run diffs against origin/main (turbo --filter '...[origin/main]').
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same selection as the tests (tooling/ci/ci-affected.mjs): a run-everything change (and every push to main)
      # builds and typechecks the whole repo; any other change builds and typechecks the changed packages and their
      # dependents, turbo's ^build covering their dependencies, plus what a selected reader's tests read (--build-filters:
      # apps/admin's next build types its tests, which import other services' sources); docs only has nothing to build. Measured: the whole
      # repo took 3m50s to build plus 5m50s to typecheck, the slowest job of a PR run.
      - name: Build
        env:
          FULL: ${{ needs.changes.outputs.full }}
          AFFECTED: ${{ needs.changes.outputs.affected }}
        run: |
          set -o pipefail
          {
          if [ "$FULL" = true ]; then pnpm build
          elif [ "$AFFECTED" = true ]; then
            filters=()
            while IFS= read -r f; do filters+=("--filter=$f"); done < <(node tooling/ci/ci-affected.mjs --build-filters)
            pnpm turbo run build "${filters[@]}"
          else echo "docs only: nothing to build"; fi
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Typecheck
        env:
          FULL: ${{ needs.changes.outputs.full }}
          AFFECTED: ${{ needs.changes.outputs.affected }}
        run: |
          set -o pipefail
          {
          if [ "$FULL" = true ]; then pnpm typecheck
          elif [ "$AFFECTED" = true ]; then
            filters=()
            while IFS= read -r f; do filters+=("--filter=$f"); done < <(node tooling/ci/ci-affected.mjs --filters)
            pnpm turbo run typecheck "${filters[@]}"
          else echo "docs only: nothing to typecheck"; fi
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      # The Customer app's deployment tests (nginx config, env validation, the security headers and the built
      # index.html's scripts) are node:test files outside vitest, and need the build above. They run whenever this job
      # built the Customer app.
      - name: Customer deployment tests
        run: |
          if [ -f apps/customer/dist/index.html ]; then pnpm --filter @intafaced/customer test:deployment
          else echo "the Customer app was not built: nothing to test"; fi
      # turbo prefixes every line with its task, so setup-node's tsc matcher never fires and a red job said only
      # "pnpm run typecheck exited (1)". This turns the first ten type errors (GitHub keeps ten per step) into annotations, so tooling/ci/why-red.mjs
      # names them without the job log. Output only: it changes no result.
      - name: Name the type errors
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/build.log" | { grep -E 'error TS[0-9]+' || true; } | sed -E 's/^@intafaced\///' |
            sort -u | head -n 10 | cut -c1-300 | sed 's/^/::error title=Type error::/'

  test-full:
    # A run-everything change (full, and every push to main) splits the suite eight ways, one job each, by the package
    # lists in tooling/ci/test-shards.mjs. Any other change is one job, `changed`: the changed packages, their
    # dependents and the readers in tooling/ci/test-read-edges.json. The seal reads the matrix as one job (green only
    # when every shard is) and fails a skipped one unless the classifier said there was nothing to test.
    name: Tests (${{ matrix.shard }})
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.affected == 'true'
    needs: [changes]
    strategy:
      fail-fast: false # a red shard must not hide what the others found
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45 # healthy run: 11-20 min

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intafaced
          POSTGRES_PASSWORD: intafaced
          POSTGRES_DB: intafaced
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U intafaced"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 — the diff-based steps read origin/main history.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/test-infra

      - id: pick
        name: Pick this job's packages
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = changed ]; then
            node tooling/ci/ci-affected.mjs --filters > "$RUNNER_TEMP/filters.txt"
            echo 'protocol=true' >> "$GITHUB_OUTPUT"
          else
            node tooling/ci/test-shards.mjs --shard "$SHARD" > "$RUNNER_TEMP/filters.txt"
            if grep -qx '@intafaced/svc-protocol' "$RUNNER_TEMP/filters.txt"; then echo 'protocol=true' >> "$GITHUB_OUTPUT"; fi
          fi
          echo "packages for $SHARD:"; cat "$RUNNER_TEMP/filters.txt"
          # An empty list would make the build and `pnpm test` below run unfiltered, i.e. the whole suite again.
          if [ ! -s "$RUNNER_TEMP/filters.txt" ]; then echo "::error::no packages for $SHARD"; exit 1; fi

      # Runs the compiled factory against the TypeScript derivation and prints
      # both. The suite re-proves this hermetically; this step also proves the
      # deploy script itself still works, which nothing else exercises.
      - name: Deploy the smart-account suite and cross-check CREATE2
        if: steps.pick.outputs.protocol == 'true'
        run: pnpm --filter @intafaced/svc-protocol chain:deploy

      # S-A8 — forge fuzz + gas ceilings. Does not compile committed artefacts
      # (solc-js still owns contracts/out/). Uses the same foundry image as anvil.
      - name: Foundry fuzz (S-A8)
        if: steps.pick.outputs.protocol == 'true'
        run: pnpm --filter @intafaced/svc-protocol test:forge
        env:
          CI: 'true'

      # Every shard builds only what it tests: its packages' own dist (some tests start their own compiled output,
      # e.g. svc-notify's relay boot, svc-ops, svc-trade, svc-pay, telemetry) and, through turbo's ^build, their
      # dependencies. Apps are left out: their tests run from source. A full `pnpm build` in each shard
      # repeated the same 3-4 minutes four times (measured on run 39314334555: 3m50s to 4m00s of each shard's
      # 8-12 minutes).
      - name: Build this job's packages
        run: |
          filters=()
          while IFS= read -r f; do filters+=("--filter=$f"); done < "$RUNNER_TEMP/filters.txt"
          pnpm turbo run build "${filters[@]}" '--filter=!./apps/*'
      # --continue: keep running after a failing package so one run lists every
      # failure instead of stopping at the first (the job is still red if any fail).
      # --concurrency=3: turbo's default is 10 packages at once, each with its own vitest worker pool, on a 4-core
      # runner sharing one Postgres, Redis, NATS and anvil. Under that load a different package timed out at vitest's
      # 5 s default on each run (svc-p2p, svc-ws, svc-pay, the svc-protocol lending test), none of them touched by the
      # PRs that went red. Fewer packages at a time removes the contention; no timeout is raised.
      # The filters are this shard's packages (test-shards.mjs) or, for a `changed` run, the dependents of the changed
      # packages plus the readers in test-read-edges.json (ci-affected.mjs --filters); turbo builds what those tests
      # depend on (^build).
      - name: Run pnpm test --continue
        run: |
          set -o pipefail
          filters=()
          while IFS= read -r f; do filters+=("--filter=$f"); done < "$RUNNER_TEMP/filters.txt"
          pnpm test --continue --concurrency=3 "${filters[@]}" 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      # Makes a red run readable without the full log. The Postgres service
      # container dumps its own log after the last step, so the tail of the job
      # log is database noise and the failing tests sit far above it. This
      # collects turbo's failed tasks and vitest's FAIL lines, prints them, and
      # puts the first few in the next step's name (through env), which the jobs API returns.
      # Reads output only; it changes no result and no test.
      - name: Collect failing tests
        if: failure()
        run: |
          out="$RUNNER_TEMP/test-output.log"
          [ -f "$out" ] || exit 0
          sed -E 's/\x1b\[[0-9;]*m//g' "$out" > "$out.clean"
          {
            { grep -E '^ *Failed: ' "$out.clean" || true; } | sed 's#@intafaced/##g' | head -n 1
            { grep -E '(^|[: ]) FAIL  ' "$out.clean" || true; } | sed 's#@intafaced/##' | cut -c1-110 | sort -u | head -n 40
          } | tee "$RUNNER_TEMP/failures.txt" | sed 's/^/::error::/'
          {
            echo "## Failing tests"
            echo '```'
            cat "$RUNNER_TEMP/failures.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          short=$(tr '\n' ';' < "$RUNNER_TEMP/failures.txt" | cut -c1-900)
          echo "FAILED_SHORT=$short" >> "$GITHUB_ENV"
          # The first error line vitest printed under each failing test (assertion, timeout, revert), so the reason is
          # readable too. One line per test, test file name first, up to four.
          awk '/(^|[: ]) FAIL  /{n=$0; sub(/^.*FAIL  /,"",n); sub(/ >.*$/,"",n); sub(/^.*\//,"",n); sub(/\.test\.ts.*$/,"",n); f=1; next}
               f && /^ *(AssertionError|[A-Za-z]*Error): /{if(!(n in seen)){seen[n]=1; sub(/^ +/,""); print n ": " $0}; f=0}' "$out.clean" | cut -c1-110 | head -n 4 > "$RUNNER_TEMP/why.txt"
          i=0
          while IFS= read -r line; do
            i=$((i + 1))
            echo "FAILED_ERR$i=$line" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/why.txt"
      - name: 'Failing: ${{ env.FAILED_SHORT }}'
        if: failure() && env.FAILED_SHORT != ''
        run: 'true'
      - name: 'Why: ${{ env.FAILED_ERR1 }}'
        if: failure() && env.FAILED_ERR1 != ''
        run: 'true'
      - name: 'Why: ${{ env.FAILED_ERR2 }}'
        if: failure() && env.FAILED_ERR2 != ''
        run: 'true'
      - name: 'Why: ${{ env.FAILED_ERR3 }}'
        if: failure() && env.FAILED_ERR3 != ''
        run: 'true'
      - name: 'Why: ${{ env.FAILED_ERR4 }}'
        if: failure() && env.FAILED_ERR4 != ''
        run: 'true'

      # The backstop. REQUIRE_POSTGRES / REQUIRE_EVM_CHAIN make the shared probes
      # throw, which turns most missing infrastructure into a red suite before
      # this step runs. What they cannot cover is a suite whose own required-gate
      # is narrower than the run's — svc-pay's crypto rail gates on
      # REQUIRE_PAY_EVM, which is not set here, so until now it could skip on CI
      # and be counted as a pass. This reads the journal every probe writes and
      # fails the job when something did not execute.
      #
      # `always()` because a red suite is the moment you most want to know how
      # much of the rest was real — the exact question the agent who reported
      # "92 successful, 92 total" could not answer.
      - name: Every infrastructure-backed suite actually ran
        if: always()
        run: node tooling/ci/infra-verdict.mjs

  merge-seal:
    name: CI merge seal
    runs-on: ubuntu-latest
    # healthy run: seconds; up to 20 minutes when it waits for the independent review (tooling/ci/review-marker.mjs)
    timeout-minutes: 25
    if: always()
    permissions:
      contents: read
      statuses: read # the `Independent review` status
      issues: read # the review comment itself, so the seal does not wait for the sign-off runner
      pull-requests: read # the changed files, to tell whether this change needs the independent review
    needs: [changes, gates, format, build, test-full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require needed jobs
        env:
          FULL: ${{ needs.changes.outputs.full }}
          AFFECTED: ${{ needs.changes.outputs.affected }}
          CHANGES: ${{ needs.changes.result }}
          GATES: ${{ needs.gates.result }}
          FORMAT: ${{ needs.format.result }}
          BUILD: ${{ needs.build.result }}
          T_FULL: ${{ needs.test-full.result }}
        run: node tooling/ci/ci-affected.mjs --seal
      - name: Require the independent review sign-off
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        # The default branch's copy decides which changes need the review. Editing this step is a .github/ change, which needs it.
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          node "$RUNNER_TEMP/base/tooling/ci/review-marker.mjs"
