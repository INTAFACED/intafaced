  merge-seal:
    name: CI merge seal
    runs-on: ubuntu-latest
    timeout-minutes: 5 # healthy run: seconds
    if: always()
    needs:
      [
        changes,
        gates,
        format,
        build,
        test-full,
        test-protocol,
        test-money,
        test-trade,
        test-paybank,
      ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require needed jobs
        env:
          FULL: ${{ needs.changes.outputs.full }}
          PROTOCOL: ${{ needs.changes.outputs.protocol }}
          MONEY: ${{ needs.changes.outputs.money }}
          TRADE: ${{ needs.changes.outputs.trade }}
          PAYBANK: ${{ needs.changes.outputs.paybank }}
          REST: ${{ needs.changes.outputs.rest }}
          CHANGES: ${{ needs.changes.result }}
          GATES: ${{ needs.gates.result }}
          FORMAT: ${{ needs.format.result }}
          BUILD: ${{ needs.build.result }}
          T_FULL: ${{ needs.test-full.result }}
          T_PROTOCOL: ${{ needs.test-protocol.result }}
          T_MONEY: ${{ needs.test-money.result }}
          T_TRADE: ${{ needs.test-trade.result }}
          T_PAYBANK: ${{ needs.test-paybank.result }}
        run: node tooling/ci/ci-affected.mjs --seal

  # Not the merge seal. A red seal is the case where main is already red, and
  # tying DoD to that seal skipped it. A skipped DoD plus an excused seal would pass.
  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    timeout-minutes: 15 # healthy run: about 2 min
    needs: [changes, gates, format, build]
    if: always() && needs.changes.result == 'success' && needs.gates.result == 'success' && needs.format.result == 'success' && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # §0.1 — never half done. This is the gate that decides whether a module
      # ships, and it runs on every PR so nothing "temporary" reaches main.
      - run: pnpm gate
