# Headers for the /api/ proxy only. svc-edge already sends nosniff, a denied
# frame ancestry and its own referrer policy, and a few of its documents set
# their own framing and CSP (the embeddable /api/widget/ramp removes
# X-Frame-Options on purpose). So this location adds only what svc-edge says
# belongs at the TLS terminator: HSTS. Over plain http browsers ignore it.
# See security-headers.conf for why this is an include and not a server-level
# add_header.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
