<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Your money, trading and payments in one place." />
    <title>Intafaced</title>
    <style>
      /*
       * Home's frame: drawn from this file alone while the app's code downloads, only where the boot script
       * (src/app/boot.ts) marks the page as Simple Home. It holds no figures and no words but the wordmark; the script
       * takes the mark off as soon as the app draws anything beyond its loading state.
       */
      #boot-frame,
      html[data-boot='home'] #root {
        display: none;
      }
      html[data-boot='home'] #boot-frame {
        display: block;
      }
      /* sizes are the kit's tokens (index.css, render-blocking, so they are set before this paints) or rem */
      #boot-frame {
        min-block-size: 100dvh;
        background: var(--if-bg);
      }
      #boot-frame .bf-top {
        display: flex;
        align-items: center;
        block-size: 3rem;
        padding-inline: var(--if-space-4);
        border-block-end: 1px solid var(--if-line);
        color: var(--if-text);
        /* the system face: the app's web font would start downloading here and slow the app's own code */
        font:
          700 1.0625rem / 1 system-ui,
          sans-serif;
        letter-spacing: -0.02em;
      }
      #boot-frame .bf-top span {
        color: var(--if-accent-text);
      }
      #boot-frame .bf-body {
        display: grid;
        gap: var(--if-space-3);
        max-inline-size: 75rem;
        margin-inline: auto;
        padding: var(--if-space-6) var(--if-space-4);
      }
      #boot-frame i {
        display: block;
        block-size: 1rem;
        border-radius: var(--if-r-xs);
        background: var(--if-panel);
      }
      #boot-frame .bf-figure {
        inline-size: min(70%, 18.75rem);
        block-size: 3rem;
      }
      #boot-frame .bf-label {
        inline-size: min(45%, 11.25rem);
      }
      #boot-frame .bf-line {
        inline-size: min(60%, 15rem);
      }
      #boot-frame .bf-keys {
        display: flex;
        flex-wrap: wrap;
        gap: var(--if-space-2);
        margin-block-start: var(--if-space-1);
      }
      #boot-frame .bf-keys i {
        inline-size: 4.5rem;
        block-size: 2.5rem;
        border-radius: var(--if-r-pill);
      }
      #boot-frame .bf-head {
        inline-size: 8.75rem;
        block-size: 1.5rem;
        margin-block-start: var(--if-space-7);
      }
      #boot-frame .bf-card {
        block-size: 9rem;
        border-radius: var(--if-r-lg);
      }
      @media (prefers-reduced-motion: no-preference) {
        #boot-frame i {
          animation: bf-pulse 1.6s ease-in-out infinite;
        }
      }
      @keyframes bf-pulse {
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-frame" aria-hidden="true">
      <div class="bf-top">intafaced<span>·</span></div>
      <div class="bf-body">
        <i class="bf-label"></i>
        <i class="bf-figure"></i>
        <i class="bf-line"></i>
        <div class="bf-keys"><i></i><i></i><i></i><i></i><i></i></div>
        <i class="bf-head"></i>
        <i class="bf-card"></i>
        <i class="bf-head"></i>
        <i class="bf-card"></i>
      </div>
    </div>
    <div id="root"></div>
    <script src="/assets/no-eval-v1.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
