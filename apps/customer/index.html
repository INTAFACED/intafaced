<!doctype html>
<html lang="en" data-look="lit">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A09" />
    <meta name="description" content="Your money, trading and payments in one place." />
    <title>INTAFACED</title>
    <!-- The brand's files: packages/ui/brand, copied here by packages/ui/scripts/brand-sync.mjs. -->
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:site_name" content="INTAFACED" />
    <meta property="og:title" content="INTAFACED" />
    <meta property="og:description" content="Your money, trading and payments in one place." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/brand/og-image.png" />
    <style>
      /*
       * Home's frame, shown while the app's code downloads, only where the boot script (src/app/boot.ts) marks the page
       * as Simple Home. It holds no figures and no words but the wordmark, and puts each block where Volt's Home draws
       * its loading state: the page is drawn with the kit's page grid and Home's own classes (screens/home/command.css,
       * in the entry stylesheet), so the hand-over moves nothing. The
       * script takes the mark off once Home's root is in the page. Sizes are the kit's tokens and classes (the entry
       * stylesheet, render-blocking, so they are set before this paints) or rem; the app's root size is 14 pixels, so
       * a rem here is 14 pixels.
       */
      #boot-frame,
      html[data-boot='home'] #root {
        display: none;
      }
      html[data-boot='home'] #boot-frame {
        display: block;
      }
      #boot-frame {
        min-block-size: 100dvh;
        background: var(--if-bg);
      }
      #boot-frame .bf-top {
        display: flex;
        align-items: center;
        box-sizing: border-box;
        block-size: var(--if-space-12);
        padding-inline: var(--if-space-6);
        border-block-end: 1px solid transparent;
        background: var(--lit-page);
      }
      /* the bar's brand, as the app bar draws it: the top-bar lockup, 24 pixels tall; the mark alone on a phone. The
         kit's own files paint through a mask, so the colour is the text token */
      #boot-frame .bf-brand {
        display: block;
        block-size: 1.7143rem;
        inline-size: 10.8183rem;
        background: var(--if-text);
        -webkit-mask: url(/brand/lockup-topbar.svg) center / contain no-repeat;
        mask: url(/brand/lockup-topbar.svg) center / contain no-repeat;
      }
      #boot-frame * {
        box-sizing: border-box;
      }
      /* the page, its panels and its loading placeholders are the kit's and Home's own classes (lt-page, lit-surface,
         hm-*, lt-ghost, from the entry stylesheet), so each block sits where Home's loading state puts it; only what
         holds words in Home is drawn here, as a bar the height of its line */
      #boot-frame .bf-line {
        display: block;
        border-radius: var(--lit-radius-tile);
        background: var(--lit-solid-bg-raised);
      }
      /* the label row: its words beside the 48-pixel keys that hide and explain the total */
      #boot-frame .bf-label {
        display: flex;
        align-items: center;
        block-size: 3.4286rem;
      }
      #boot-frame .bf-label .bf-line {
        inline-size: 6.9286rem;
        block-size: 1rem;
      }
      /* a section head: one line of its title */
      #boot-frame .bf-head {
        inline-size: 6.25rem;
        block-size: 1.5714rem;
      }
      /* a side panel's head: one line of its title (Home's side titles, 1.0625rem on a 1.4 line) */
      #boot-frame .bf-side-head {
        inline-size: 6.25rem;
        block-size: 1.4875rem;
      }
      /* one column (under the kit's 64rem): the side panels come after the markets, below the fold, where the frame
         draws nothing */
      @container lt-page (max-width: 63.99rem) {
        #boot-frame .bf-side {
          display: none;
        }
      }
      /* the range switch, empty at its drawn size (four short words in pills) */
      #boot-frame .bf-ranges {
        inline-size: 11.7143rem;
        block-size: 2.2857rem;
      }
      #boot-frame .bf-doors {
        display: none;
      }
      /* the phone: the mark alone in the bar and the doors bar at the foot */
      @media (max-width: 47.99rem) {
        #boot-frame .bf-top {
          padding-inline: var(--if-space-4);
        }
        #boot-frame .bf-brand {
          inline-size: 1.7143rem;
          -webkit-mask-image: url(/brand/mark-small.svg);
          mask-image: url(/brand/mark-small.svg);
        }
        #boot-frame .bf-doors {
          display: flex;
          justify-content: space-around;
          align-items: center;
          position: fixed;
          inset: auto 0 0;
          block-size: 4.3571rem;
          border-block-start: 1px solid var(--if-line);
          background: var(--if-bg);
        }
        #boot-frame .bf-doors i {
          display: block;
          inline-size: 1.4286rem;
          block-size: 1.4286rem;
          border-radius: var(--if-r-sm);
          background: var(--if-panel);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        #boot-frame .bf-line,
        #boot-frame .bf-doors i {
          animation: bf-pulse 1.6s ease-in-out infinite;
        }
      }
      @keyframes bf-pulse {
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-frame" aria-hidden="true">
      <div class="bf-top"><span class="bf-brand"></span></div>
      <div class="hm">
        <div class="lt-page" data-scale="auto">
          <div class="lt-page-grid" data-layout="split">
            <div class="lt-page-col hm-main">
              <div class="lit-surface hm-hero" data-layer="content" data-material="solid">
                <div class="hm-hero-top">
                  <div class="hm-hero-figure">
                    <div class="hm-label bf-label"><span class="bf-line"></span></div>
                    <div>
                      <div class="bf-total">
                        <div class="lt-ghost" data-ghost="figure" data-busy=""><span class="lt-ghost-item"></span></div>
                      </div>
                      <div class="bf-change">
                        <div class="lt-ghost" data-ghost="text" data-busy=""><span class="lt-ghost-item"></span></div>
                      </div>
                    </div>
                  </div>
                  <div class="lt-segmented bf-ranges"></div>
                </div>
                <div class="hm-chart">
                  <div class="lt-ghost" data-ghost="chart" data-busy=""><span class="lt-ghost-item"></span></div>
                </div>
                <div class="hm-keys bf-keys">
                  <div class="lt-ghost" data-ghost="keys" data-busy="">
                    <span class="lt-ghost-item"></span><span class="lt-ghost-item"></span><span class="lt-ghost-item"></span
                    ><span class="lt-ghost-item"></span>
                  </div>
                </div>
              </div>
              <div class="lit-surface hm-markets" data-layer="content" data-material="solid">
                <div class="lt-panel-head"><span class="bf-line bf-head bf-markets-head"></span></div>
              </div>
            </div>
            <div class="lt-page-col hm-side bf-side">
              <div class="lit-surface hm-side-panel" data-layer="content" data-material="solid">
                <div class="lt-stack">
                  <span class="bf-line bf-side-head"></span>
                  <div class="lt-ghost" data-ghost="rows" data-busy="">
                    <span class="lt-ghost-item"></span><span class="lt-ghost-item"></span>
                  </div>
                </div>
              </div>
              <div class="lit-surface hm-side-panel" data-layer="content" data-material="solid">
                <div class="lt-stack">
                  <span class="bf-line bf-side-head"></span>
                  <div class="lt-ghost" data-ghost="rows" data-busy="">
                    <span class="lt-ghost-item"></span><span class="lt-ghost-item"></span><span class="lt-ghost-item"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="bf-doors"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>
    <script src="/assets/no-eval-v1.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
