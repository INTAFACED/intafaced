map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Locations that set their own add_header do not inherit this; each one
    # repeats the include below (enforced by deployment/security-headers.node-test.mjs).
    include /etc/nginx/snippets/security-headers.conf;

    # Vite gives these files content hashes. Missing chunks must return 404,
    # never index.html; an old open tab can then recover from a real load error.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /customer-deployment.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    # A transport prefix is never a customer room.
    location = /api { return 404; }
    location = /ws { return 404; }

    # The developer docs' markdown pages, agent index and machine-readable files are real files in /developers/
    # (public/developers). A missing one is a 404, never the app shell.
    location ~ ^/developers/[a-z0-9-]+\.(md|txt|json)$ {
        try_files $uri =404;
        types {
            text/markdown md;
            text/plain txt;
            application/json json;
        }
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    # Every other /developers address is an app room. The files' folder must not answer /developers or /developers/
    # itself (`$uri/` would find the folder, which has no index, and refuse it), so these go straight to the shell.
    location /developers {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Keep every customer deep link inside the same SPA. The internal fallback
    # resolves through /index.html and inherits its no-store policy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The status badge keeps the cache life svc-notify sets from its reading's age (the edge passes it through);
    # every other /api/ answer stays no-store.
    location = /api/notify/status/badge.svg {
        proxy_pass http://svc-edge:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers-api.conf;
    }

    location ^~ /api/ {
        proxy_pass http://svc-edge:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers-api.conf;
    }

    location ^~ /ws/ {
        # svc-ws owns /stream; the public /ws prefix is stripped here.
        proxy_pass http://svc-ws:4014/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
