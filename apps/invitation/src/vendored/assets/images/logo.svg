<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" width="260" height="48" role="img" aria-label="INTAFACED">
  <title>INTAFACED</title>
  <defs>
    <linearGradient id="ixMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e2e2"/>
      <stop offset="1" stop-color="#c8c8c8"/>
    </linearGradient>
  </defs>
  <!-- Mark: an aperture cut from a rounded square. Reads as a lens at 16px and
       as an "I" counterform at full size. -->
  <g transform="translate(0,6)">
    <rect x="0" y="0" width="36" height="36" rx="11" fill="url(#ixMark)"/>
    <rect x="15.5" y="7" width="5" height="22" rx="2.5" fill="#0a0a0a"/>
    <rect x="7" y="7" width="5" height="9" rx="2.5" fill="#0a0a0a" opacity="0.55"/>
    <rect x="24" y="20" width="5" height="9" rx="2.5" fill="#0a0a0a" opacity="0.55"/>
  </g>
  <text x="50" y="32"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" letter-spacing="2.6" fill="#ffffff">INTAFACED</text>
</svg>
