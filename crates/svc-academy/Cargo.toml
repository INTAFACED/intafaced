[package]
name = "svc-academy"
version = "0.0.0"
description = "svc-academy: the Academy's courses, cohorts, assessments, certificates and community. The Rust port's door."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
service-kit = { path = "../service-kit" }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
postgres = "0.19"
signal-hook = "0.3"
# Vendored with the pool fix of #9432 (crates/vendor/tiny_http/VENDORED.md).
tiny_http = { path = "../vendor/tiny_http" }
url = "2"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8"] }

[[test]]
name = "it"
path = "tests/it.rs"
