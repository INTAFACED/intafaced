[package]
name = "svc-ledger"
version = "0.0.0"
description = "svc-ledger: the one ledger. The Rust port: its doors, who may call them, their first input checks, and the book's store, migrations and binary; the TypeScript service runs until the switch."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
service-kit = { path = "../service-kit" }
getrandom = "0.3"
postgres = "0.19"
sha2 = "0.10"
signal-hook = "0.3"
# Vendored with the pool fix of #9432 (crates/vendor/tiny_http/VENDORED.md).
tiny_http = { path = "../vendor/tiny_http" }
url = "2"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8"] }
hmac = "0.12"
