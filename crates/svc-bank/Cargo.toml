[package]
name = "svc-bank"
version = "0.0.0"
description = "svc-bank: the retail and business bank. The Rust port: its door, environment, refusals and store."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
service-kit = { path = "../service-kit" }
postgres = "0.19"
sha2 = "0.10"
signal-hook = "0.3"
# Vendored with the pool fix of #9432 (crates/vendor/tiny_http/VENDORED.md).
tiny_http = { path = "../vendor/tiny_http" }
# NFKC for a holder name as `holderNameKey` compares it (already in the lockfile through `idna`).
unicode-normalization = "0.1"
url = "2"
