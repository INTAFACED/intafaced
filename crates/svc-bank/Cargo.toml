[package]
name = "svc-bank"
version = "0.0.0"
description = "svc-bank: the retail and business bank. The Rust port: its door, environment, refusals and store."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
service-kit = { path = "../service-kit" }
postgres = "0.19"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
signal-hook = "0.3"
# Vendored with the pool fix of #9432 (crates/vendor/tiny_http/VENDORED.md).
tiny_http = { path = "../vendor/tiny_http" }
url = "2"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = { version = "0.10", default-features = false }

[[test]]
name = "it"
path = "tests/it.rs"
