[package]
name = "svc-bank"
version = "0.0.0"
description = "svc-bank: the retail and business bank. The Rust port: its door, environment, refusals and store."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
service-kit = { path = "../service-kit" }
postgres = "0.19"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
base64 = "0.22"
signal-hook = "0.3"
# Vendored with the pool fix of #9432 (crates/vendor/tiny_http/VENDORED.md).
tiny_http = { path = "../vendor/tiny_http" }
url = "2"
# The bank API's webhook POST, pinned to vetted addresses (`bank_api::pinned_post`), as svc-agents sends its own.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# EIP-191 signer recovery and EIP-55 checksums (wallet ownership proofs, the address book).
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha3 = { version = "0.10", default-features = false }
# NFKC for the cardholder sanctions list's names (`String.prototype.normalize('NFKC')`); already in the lock through `url`.
icu_normalizer = "2"

[[test]]
name = "it"
path = "tests/it.rs"
