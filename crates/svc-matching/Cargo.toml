[package]
name = "svc-matching"
version = "0.0.0"
description = "svc-matching: the engine's orderbooks and matching. The Rust port's shell: its doors, who may call them, their input checks and refusals; the TypeScript service runs until the switch."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
getrandom = "0.3"
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
service-kit = { path = "../service-kit" }
sha2 = "0.10"
signal-hook = "0.3"
# Vendored with the pool fix of #9432 (crates/vendor/tiny_http/VENDORED.md).
tiny_http = { path = "../vendor/tiny_http" }
url = "2"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2"
hmac = "0.12"

[[test]]
name = "it"
path = "tests/it.rs"
