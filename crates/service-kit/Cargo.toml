[package]
name = "service-kit"
version = "0.0.0"
description = "service-kit: the generic server-side parts every Rust service shares. A library, never a service."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
getrandom = "0.3"
postgres = "0.19"
# Vendored with the pool fix of #9432 (crates/vendor/tiny_http/VENDORED.md).
tiny_http = { path = "../vendor/tiny_http" }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"

[[test]]
name = "it"
path = "tests/it.rs"
