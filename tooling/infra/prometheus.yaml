global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: intafaced
    env: dev

# The alert rules (#10211): a service down, a failed boot, a disk almost full, a failed or missing backup. Mounted
# beside this file by docker-compose.yml; promtool checks them in tooling/infra/backup/pg-backup.test.mjs.
rule_files:
  - prometheus-alerts.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: nats
    metrics_path: /metrics
    static_configs:
      - targets: ['nats:8222']

  # ── THE FRONT DOOR (§14.5) ─────────────────────────────────────────────────
  #
  # The first application target this file has ever had. Until this landed,
  # Prometheus scraped itself and NATS, so Grafana pointed at a store holding no
  # series whose name did not begin with `go_`, `net_`, `nats_` or `prometheus_`
  # — and §14's "at least one SLO dashboard panel" had nothing it could plot.
  #
  # Why the edge and not each service: §20 calls its numbers "engineering SLOs,
  # not slogans", and an SLO is a promise to a USER. It is therefore measured
  # where the user is — the front door, with every hop behind it included.
  # `svc-trade` timing its own handler cannot see the queue in front of it, and
  # would report health during exactly the incident an SLO exists to catch.
  #
  # ── Why this address resolves ──────────────────────────────────────────────
  #
  # `svc-edge` is started by `docker-compose.apps.yml`, which `include:`s the
  # compose file this config belongs to, so both containers land on the same
  # project network and Prometheus reaches the service by its compose name.
  # `HTTP_PORT: '4000'` is set on that service, and it is the CONTAINER port —
  # never the published host port, which is not what a sibling container talks
  # to. `/metrics` is `METRICS_PATH` in `services/svc-edge/src/metrics.ts`.
  #
  # All three are asserted, not hoped: `observability-wiring.test.ts` parses THIS
  # FILE and `docker-compose.apps.yml`, and fails if the host, the port or the
  # path drifts from what the service actually serves. A scrape config pointing
  # at a port nothing listens on is the classic version of a change that looks
  # complete in a diff and reports nothing.
  #
  # ── No `labels:` block, on purpose ─────────────────────────────────────────
  #
  # The exposition already carries `service="svc-edge"`. A `labels: {service: …}`
  # here would NOT overwrite it — Prometheus renames the scraped one to
  # `exported_service` and keeps both, so every dashboard query matching on
  # `service` would silently match nothing. One label, one owner; the wiring test
  # asserts this file adds none of the names the payload already emits.
  - job_name: svc-edge
    metrics_path: /metrics
    # 10s, against a per-client rate limit of 300/min. Six requests a minute is
    # 2% of the budget, and the scraper reaches the container directly so it holds
    # its own bucket rather than sharing a user's. The wiring test asserts that
    # headroom instead of leaving it as an assertion in a comment.
    scrape_interval: 10s
    static_configs:
      - targets: ['svc-edge:4000']

  # ── THE ENGINE (§5.1) ──────────────────────────────────────────────────────
  #
  # A process scrape, not the user SLO. The SLO still lives on svc-edge: the
  # user's request is measured at the front door, with this hop inside it. This
  # job exists so an operator can see THIS process's HTTP latency when the
  # engine is the thing that's slow.
  #
  # Matching is not a proxy. The exposition's `module` label is always `_local`.
  #
  # Why this address resolves: `svc-matching` is started by
  # `docker-compose.apps.yml`, which `include:`s the compose file this config
  # belongs to. `HTTP_PORT: '4005'` is the CONTAINER port — not the env.rs
  # default of 4004, and never a published host port. `/metrics` is
  # `METRICS_PATH` in `crates/service-kit/src/metrics.rs`.
  #
  # All three are asserted by `crates/svc-matching/tests/boot.rs`
  # against THIS FILE and the real compose block. A scrape config pointing at
  # the code default (4004) would miss the container entirely.
  #
  # ── No `labels:` block, on purpose ─────────────────────────────────────────
  #
  # The exposition already carries `service="svc-matching"`. A `labels:`
  # `{service: …}` here would NOT overwrite it — Prometheus renames the scraped
  # one to `exported_service` and keeps both, so every dashboard query matching
  # on `service` would silently match nothing.
  - job_name: svc-matching
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['svc-matching:4005']

  # ── THE BOOK (§4.2) ────────────────────────────────────────────────────────
  #
  # A process scrape, not the user SLO. The SLO still lives on svc-edge: the
  # user's request is measured at the front door, with this hop inside it. This
  # job exists so an operator can see THIS process's HTTP latency when the
  # book is the thing that's slow.
  #
  # Ledger is not a proxy. The exposition's `module` label is always `_local`.
  #
  # Why this address resolves: `svc-ledger` is started by
  # `docker-compose.apps.yml`, which `include:`s the compose file this config
  # belongs to. `HTTP_PORT: '4001'` is the CONTAINER port — not a published
  # host port. `/metrics` is `METRICS_PATH` in
  # `crates/svc-ledger/src/metrics.rs`.
  #
  # All three are asserted by `crates/svc-ledger/tests/metrics.rs`
  # against THIS FILE and the real compose block. A scrape config pointing at
  # localhost would miss the container entirely.
  #
  # ── No `labels:` block, on purpose ─────────────────────────────────────────
  #
  # The exposition already carries `service="svc-ledger"`. A `labels:`
  # `{service: …}` here would NOT overwrite it — Prometheus renames the scraped
  # one to `exported_service` and keeps both, so every dashboard query matching
  # on `service` would silently match nothing.
  - job_name: svc-ledger
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['svc-ledger:4001']

  # ── THE HOST (#10211) ──────────────────────────────────────────────────────
  #
  # node-exporter runs only in compose profile `beta` (the hosted beta): the host's disks for `DiskAlmostFull`, and
  # the nightly backup's result file (textfile collector) for the backup alerts. On a dev machine without that
  # profile this target is down and `ServiceDown` names it on the Alerts page; nothing is sent anywhere.
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
