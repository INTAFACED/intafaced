map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Locations that set their own add_header do not inherit this; each one
    # repeats the include below (enforced by deployment/security-headers.node-test.mjs).
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-report-only.conf;

    # Vite gives these files content hashes. Missing chunks must return 404,
    # never index.html; an old open tab can then recover from a real load error.
    # --- local preview additions (not in the shipped nginx.conf) ---
    location = /__csp-report { proxy_pass http://host.docker.internal:18083/__csp-report; }
    location = /__csp-preview/violations { proxy_pass http://host.docker.internal:18083/violations; add_header Cache-Control "no-store" always; }
    location = /__csp-preview/clear { proxy_pass http://host.docker.internal:18083/clear; }
    location ^~ /__csp-preview/ {
        alias /preview/checklist/;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-report-only.conf;
    }
    # --- end local preview additions ---

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-report-only.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-report-only.conf;
    }
    location = /customer-deployment.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-report-only.conf;
    }
    # A transport prefix is never a customer room.
    location = /api { return 404; }
    location = /ws { return 404; }

    # Keep every customer deep link inside the same SPA. The internal fallback
    # resolves through /index.html and inherits its no-store policy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-report-only.conf;
    }

    location ^~ /api/ {
        proxy_pass http://host.docker.internal:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers-api.conf;
    }

    location ^~ /ws/ {
        # svc-ws owns /stream; the public /ws prefix is stripped here.
        proxy_pass http://host.docker.internal:18082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
