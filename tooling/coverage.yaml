      note: >-
        A named svc-core-ops surface with no row. DELIBERATELY LEFT AS A GAP on 2026-08-08, when the
        other twenty-two on this list were boarded, and the reason is worth writing down rather than
        leaving as an omission. Every other capability boarded that day had either a real dependency
