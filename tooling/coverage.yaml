# ── THE RATCHET ──────────────────────────────────────────────────────────────
# Both lists must EQUAL, BY NAME, what the gate finds.
#
#   a gap not in this list  → new drift. This is the failure the gate exists for.
#   a line no longer a gap  → you closed something. Delete the line in the same
#                             PR. A baseline parked above the truth is a window
#                             left open, and it is how allowlists rot into
#                             wallpaper.
#
# NAMED, NOT COUNTED — and this is not a formatting preference. These were two
# integers, `gaps: 41` and `orphans: 1`, and an integer cannot tell "nothing
# changed" from "one closed and one opened in the same PR". A swap leaves the
# count at 41 and the gate goes green over precisely the new drift it was built
# to stop. Identity has no such hole. It also makes the debt legible: `41` names
# nobody, and a reviewer cannot see which one a PR is moving.
#
# Landing note: a strict gate would be red on main the hour it merged — forty
# missing rows is forty failures — and a gate that arrives red gets switched off
# within a day. So today's gaps are written down, named, and frozen. New drift
# fails immediately; the existing backlog is visible and shrinking rather than
# blocking everyone. Precedent: BASELINE in tooling/ci/fabricated-money-scan.mjs,
# where each frozen finding is likewise held by its exact text rather than a tally.
baseline:
  # Law capabilities with no tracker row and no exemption decision.
  #
  # The audit counted 40 by hand. This file lists 41, and the difference is
  # three deliberate bookkeeping decisions, none of them a new finding:
  #
  #   −1  §25:740 itself — coverage.yaml and coverage-check — was audit gap #19.
  #       It is the one gap this PR closes.                            → 39
  #   +1  The no-KYC lane is written in two places the gate cites separately:
  #       §22:585 (the doctrine) and §25:642 (the matrix row). Audit item #1
  #       counted it once. One law line, one capability, so it is two.  → 40
  #   +1  Audit item #28 is "Strategy Studio + Code SDK". §29 gives them
  #       separate lines and §30:797 puts the sandbox-escape suite only on the
  #       SDK, so they are split — the sandbox is its own security surface. → 41
  #
  # 2026-08-08: this list went from twenty-three entries to one, across two PRs
  # that overlapped by accident and are worth distinguishing here.
  #
  #   · #1167 closed dod.slo-dashboards by BUILDING it — /metrics on svc-edge, a
  #     scrape target verified UP against real prom/prometheus, a provisioned
  #     Grafana dashboard whose panels return live series. `infra.slo-dashboards`
  #     is `done` on that evidence, and its own note records the honest residual:
  #     1 of 19 services instrumented, 18 to go.
  #   · This PR closed the remaining twenty-one by BOARDING them — a tracker row
  #     each, expressing the real dependency edge and letting `blocked` compute.
  #     Twenty-one rows for twenty-one capabilities is not the row count, because
  #     the v2 agent fleet is five rows and two capabilities share one row.
  #
  # Both directions of the ratchet did their job during that overlap: this branch
  # had also written a `ready` row for dod.slo-dashboards, and rebasing surfaced it
  # as a duplicate id against #1167's `done` one. The `ready` row was dropped — a
  # capability that has shipped must not be re-boarded as claimable, which is the
  # same failure mode as a baseline sitting above the truth, arriving from the
  # opposite side.
  #
  # m.core.site-builder stays a gap DELIBERATELY, and its capability note says why
  # at length. Short version: every other capability boarded that day had either a
  # real dependency edge on an existing row, so `blocked` computed honestly, or a
  # written decision that made its status honest. The site builder has neither — no
  # edge to express, so it would render `ready` and invite a claim on a product
  # nobody decided to build, and `socket` would assert a not-in-v1 decision that
  # does not exist. It needs an owner scope ruling. A gap honestly recorded says
  # more than a row that misrepresents what is decided, and this list is where that
  # stays visible.
  gaps:
    - m.core.site-builder
  # Tracker rows with no law basis and no written decision anywhere.
  # The audit's headline says 18 extra-legal rows; its own class breakdown
  # (1 orphan · 1 contradiction · 13 §13-extensions · 3 decided evolutions)
  # double-counts socket.social-recovery, which is both the contradiction and
  # one of the thirteen. The distinct count is 17, which is what tracker_extra
  # carries. Only the orphan class is ratcheted — a §13 extension with a
  # written reason is evolution; an orphan is nobody having decided.
  orphans:
    - trade.ccxt-api
