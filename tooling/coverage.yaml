  # ── §31 GAP CLOSURES · v2.2, 0% tracked ────────────────────────────────────
  - id: v22.auto-invest
    capability: Auto-invest — DCA schedules, card round-ups, threshold sweeps, both planes
    law: '31:805'
    tracker: [bank.auto-invest]
    note: >-
      Gap closed 2026-08-08. Table stakes against every neobank, phased 5 by the law, and no row on the
      board. The row says plainly that the FIAT half is buildable today — bank.accounts, bank.cards,
      bank.earn and trade.convert are all done, so scheduled buys, card round-ups and threshold sweeps
      are ordinary ledger-recipe work — and that it still reads blocked because §31:805 specifies BOTH
      planes and the sovereign half funds from a vault via standing session-key allowance, which is
      protocol.smart-accounts and not done. A standing allowance simulated custodially would be the
      opposite of what the law asked for. Nothing here needs an owner magnitude: round-up granularity
      and sweep thresholds are user settings, so D-S-14 does not gate this one.
  - id: v22.tax-engine
    capability: svc-tax — per-jurisdiction reporting, lot accounting, export packs, owned not vendored
    law: '31:807'
    tracker: [tax.engine]
    note: >-
      Gap closed 2026-08-08. A new service named in the law, owned not vendored. The advantage the law
      claims — nothing to re-import, because it reads the ledger and the data lake directly — is exactly
      what is missing: the ledger half is done, connect.data-lake does not exist, and on-chain history
      needs indexer.readmodels, so the row is blocked on the two reads that make it worth building. It
      also records that the load-bearing half is COUNSEL, not engineering: which lot method applies in
      which jurisdiction, and what a spend-disposal is when a card converts crypto at the till, are legal
      determinations of the same class as the sanctions list. An agent may build the lot-accounting
      engine and the export format; a wrong jurisdiction mapping shipped confidently is worse than no
      tax product, so the honest v1 boundary refuses by name outside a small mapped set.
  - id: v22.alerts
    capability: Alerts and watchlists — price, funding, liquidation proximity, whale flow, portfolio digests
    law: '31:809'
    tracker: [v22.alerts]
    note: >-
      Gap closed 2026-08-08. The law phases the ALERTS CORE at Phase 2 — the phase being worked — while
      ops.notifications is fan-out, not alerting: nothing evaluated a condition and decided to notify,
      and nothing said so. The row keeps the two halves apart (core at 2, intelligence tiers at 5) and
      carries the refusal rule: an alert compared against a price the platform cannot source refuses
      rather than firing on a stale number. DEPENDENCY CORRECTED the same day: the row had depended on
      ops.notifications, which is phase 5, so a phase-5 prerequisite stood in front of a capability the
      law phases at 2. §31:809 is explicit on the phase and §38:854 repeats it, so the edge was argued
      down rather than the phase moved. What separates ops.notifications from done is out-of-app gateway
      credentials the owner must obtain — a done-bar residual on a supplier, not a start-bar dependency
      on the alerts core — and it now sits on this row's own done bar instead: no `done` while an alert
      can only reach an in-app inbox.
  - id: v22.business-banking
    capability: svc-bank-biz — corporate accounts, maker/checker, expense cards, invoicing, crypto payroll
    law: '31:811'
    tracker: [bank.business]
    note: >-
      Gap closed 2026-08-08, and this one is the clearest case on the list for why the gate exists:
      §38:854 added a payroll-run integrity test (multi-recipient atomicity) to the DoD, and there is no
      svc-bank-biz, so the law has carried a TEST FOR A SERVICE THAT DOES NOT EXIST since the day it was
      written. A DoD condition with no capability under it is a condition nobody can fail. The row says
      so on its face. Blocked on pay.gateway because §31:811 wires invoicing to Pay; bank.accounts and
      bank.cards are done and are what it builds on. Two things are written onto the row now rather than
      discovered later: under §0.6 a payroll run is one ledger movement or it is refused, because a run
      that pays 40 of 50 and reports success is precisely the failure §38:854 names; and §31:811 requires
      KYB per Lane B, which exists nowhere on the board — identity.kyc is individual KYC, and a corporate
      account holder is not a person.

  # ── §32 MODULE XII · INTAFACED PREDICT ─────────────────────────────────────
  - id: v22.predict
    capability: INTAFACED PREDICT — prediction markets as a first-class INTACORE market type
    law: '32:815'
    tracker: [predict.markets]
    note: >-
      Gap closed 2026-08-08. An entire named module of the product — the twelfth room — with zero board
      presence: §38:853 records the module count moving 11 to 12 and the tracker did not know it existed.
      Phase 5P and plane P are the law's. The owner is the chain owner because an accepted ADR says so
      rather than by inference: D-S-18 states "§32 Predict — Phase 5P. Not agent work, and not mine" and
      lists every §32 decision under what needs the owner, so agents babysit only. Blocked on
      chain.mainnet, because prediction markets are an INTACORE market type and INTACORE does not exist.
      The row carries the two properties D-S-18 fixed so they are not decided by whoever writes the first
      line: RESOLUTION IS THE PRODUCT and is specced before the market type is built, and every bond and
      slashing magnitude is owner-only. §38:854's resolution-dispute game-theory test suite is the second
      DoD addition on this list with nothing to attach to.

