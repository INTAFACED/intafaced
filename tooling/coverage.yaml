      is NOT re-opened: packages/venue-adapter already ranks on effective price with one bounded, tested
      5 bps internal tie-break (D-S-06 accepted), and this capability extends that cost model with
      impact, latency grade and transfer cost rather than proposing a second thumb on the scale. No
      services/svc-execution is authorised by the row existing.
