        registrar and ACME dependency on an external party, which is a second thing nobody has chosen.
        NEEDS AN OWNER SCOPE RULING, and until then a gap honestly recorded says more than a row that
        misrepresents what is decided. The ratchet keeps it visible and keeps the set from growing.
