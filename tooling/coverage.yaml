  # ── §29 INTAFACED QUANT · v2.1, 0% tracked ─────────────────────────────────
  - id: quant.studio
    capability: Strategy Studio — no-code visual builder with mandatory risk blocks, Blueprint-aware defaults
    law: '29:783'
    tracker: [quant.studio]
    note: >-
      Gap closed 2026-08-08. The law calls this the surface no exchange ships properly and it had no row
      and no service. Phase 5 comes from §30:793 verbatim, not from convenience. The blocker is not
      inferred either: `docs/adr/2026-08-04-predict-quant-connect-law.md` (D-S-18, Accepted) rules that
      §29 is blocked on §27's data lake, which is blocked on §27's adapters — so the row depends on
      connect.data-lake. The row also records what the same ADR leaves open under "what still needs the
      owner": WHETHER QUANT SHIPS TO USERS AT ALL. Boarding it stops the capability being invisible; it
      does not assert the product is going ahead, and no svc-quant should be scaffolded off it.
  - id: quant.sdk
    capability: Code SDK — TypeScript and Python against a sandboxed strategy runtime, deterministic replay
    law: '29:784'
    tracker: [quant.sdk]
    note: >-
      Gap closed 2026-08-08. Listed with the studio in the audit and kept separate here because the
      sandbox is its own security surface — §30:797 adds a sandbox-escape test suite to the DoD for it,
      and §29:787 requires V8 isolates or WASM with no raw network, which means a runtime that can reach
      the network is not a sandbox with a gap. Blocked on quant.studio and execution.sor, because
      §29:784 executes "via the same OMS" and svc-execution does not exist. §30:793 phases SDK and
      Marketplace at "5+" while §30:795 lists the SDK at 5; the row sits at 5 and records the
      inconsistency rather than inventing a 5+ phase key the by-phase render has no bucket for. The row
      also keeps the Venue Vault as a DONE-BAR condition for the external-venue half rather than a
      blocking edge, and states how that differs from the inverted edge removed from venue.aggregation.
  - id: quant.backtest
    capability: Backtest engine — event-level on the data lake, walk-forward, Monte Carlo, overfitting honesty
    law: '29:785'
    tracker: [quant.backtest]
    note: >-
      Gap closed 2026-08-08. It depends on the §27 data lake, which now has a row of its own, so the
      edge is expressed rather than described. The honesty regime finally has somewhere to live, and the
      row carries it verbatim from D-S-18 because this is the surface where the doctrine is under the
      most pressure: a TRUTHFUL number computed over real history can still be the most misleading thing
      on the screen, so the dishonesty is in the framing rather than the arithmetic. Binding from line
      one and not re-openable by a claimant: no out-of-sample verdict means the result does not render;
      unmodelled fees or slippage means the run is refused rather than caveated; the variant count is
      displayed; live P&L is never shown beside a backtest unlabelled; and no leaderboard ranked by
      historical return, in any room. §30:797 adds a backtest determinism test to the DoD.
  - id: quant.marketplace
    capability: Strategy marketplace and compute tiers — subscriptions, profit share, token-gated tiers
    law: '29:788'
    tracker: [quant.marketplace]
    note: >-
      Gap closed 2026-08-08. Copy-trading generalised to systems, commissioned per §8.7, and neither
      market.commerce nor trade.copy claimed it. Blocked on quant.studio and market.commerce — a second
      commerce path would be a second answer to the same question. FLAGGED, because a contradiction the
      board already carries once arrives here a second time: §29:788 offers publication as subscriptions
      "or profit-share", while SPEC-SOVEREIGN-ROUTING-AND-COPY forbids any fee computed from follower
      P&L in v1 in any form, and audit §B5 #1 records the law being stale the same way for trade.copy.
      If leaders may not charge on P&L, a strategy marketplace that does is the same structure with a
      different noun, and nobody has ruled that systems differ from leaders. An ADR settles it, not a
      PR. D-S-18's ban on ranking by historical return also removes the obvious ranking signal, so it
      has to be designed rather than defaulted. Compute-tier magnitudes are owner-only under D-S-14.

