# The tester profile's own wiring (HM-desks-03, J-home-ia-11 #1), layered over docker-compose.yml and
# docker-compose.apps.yml only by a tester's compose up:
#
#   node tooling/scripts/local-test-compose-env.mjs --out "$LOCAL_STACK_STATE/tester.env.local"
#   docker compose --env-file .env.example --env-file "$LOCAL_STACK_STATE/tester.env.local" \
#     -f docker-compose.yml -f docker-compose.apps.yml -f docker-compose.tester.yml --profile tester up seed
#
# LOCAL TEST only. A deployment never names this file, so nothing here reaches staging or production. Every value comes
# from compose-env (LOCAL_STACK_STATE, the state folder the tester profile shares with the host, the host user that
# owns it, and the stack id it wrote into the folder's compose marker), never a default: a missing one refuses by name.
services:
  # svc-identity reads the rest of what its `pnpm local:stack` service runs with (its email-confirm limits, for one)
  # from an env file compose-env writes into the state folder (tester-identity.env, mode 600): LOCAL TEST settings no
  # compose block lists. Compose's own `environment` wins over it.
  # Postgres starts with this stack's id as a server setting: the ownership proof the LOCAL TEST tools check against the
  # compose marker (local-test-state.mjs assertComposeOwnership). The other flags are docker-compose.yml's, repeated
  # because an overlay replaces the whole command.
  postgres:
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - default_transaction_isolation=read committed
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - intafaced.tester_stack_id=${LOCAL_TESTER_STACK_ID:?run local-test-compose-env.mjs}

  # The seed shares the host's network and reaches each service the LOCAL TEST tools call on its own loopback port, as
  # the compose marker lists them; never on another address.
  # The edge keeps its kill-switch state in the state folder, where compose-env records "nothing is killed" once, as
  # `pnpm local:stack` does: on a new volume it would halt every module until an operator wrote that. A file the edge or
  # an operator changed later is never overwritten. It runs as the folder's owner, so it can write its own switch.
  svc-edge:
    user: '${LOCAL_TESTER_UID:?run local-test-compose-env.mjs}:${LOCAL_TESTER_GID:?run local-test-compose-env.mjs}'
    environment:
      IDENTITY_OWNERSHIP_SECRET: ${IDENTITY_EDGE_AUTHORITY_SECRET:?run local-test-compose-env.mjs}
      EDGE_KILL_STATE_PATH: ${LOCAL_STACK_STATE:?LOCAL_STACK_STATE names the tester state folder}/edge-kill-state.json
    volumes:
      - ${LOCAL_STACK_STATE:?LOCAL_STACK_STATE names the tester state folder}:${LOCAL_STACK_STATE:?LOCAL_STACK_STATE names the tester state folder}

  svc-ledger:
    ports: ['127.0.0.1:4001:4001']
  svc-trade:
    ports: ['127.0.0.1:4004:4004']
    environment:
      IDENTITY_ADMISSION_SECRET: ${IDENTITY_TRADE_ADMISSION_SECRET:?run local-test-compose-env.mjs}
  svc-pay:
    environment:
      IDENTITY_ADMISSION_SECRET: ${IDENTITY_PAY_ADMISSION_SECRET:?run local-test-compose-env.mjs}
  svc-ws:
    environment:
      IDENTITY_OWNERSHIP_SECRET: ${IDENTITY_WS_AUTHORITY_SECRET:?run local-test-compose-env.mjs}
  svc-matching:
    ports: ['127.0.0.1:4005:4005']

  # Identity mails each sign-in code and confirm link to the LOCAL TEST outbox in the state folder (the transport
  # compose-env copies from the stack, `local-outbox`), where the founder seed reads the confirm links, as
  # `pnpm local:stack` does. It runs as the folder's owner, so it can write there.
  # It starts under local-tester-identity.mjs, which gives it the founder pair's invites and, once both founders are
  # enrolled, their user ids from the vault in the state folder, and starts it again when those change (the restart
  # `pnpm local:stack` makes, planFounderIdentityRestart).
  svc-identity:
    env_file:
      # Optional only so compose-env can read this file before it writes the env file; the tester's up has it.
      - path: '${LOCAL_STACK_STATE:?LOCAL_STACK_STATE names the tester state folder}/tester-identity.env'
        required: false
    command:
      ['node', 'tooling/scripts/local-tester-identity.mjs', 'services/svc-identity/dist/index.js']
    ports: ['127.0.0.1:4002:4002']
    user: '${LOCAL_TESTER_UID:?run local-test-compose-env.mjs}:${LOCAL_TESTER_GID:?run local-test-compose-env.mjs}'
    environment:
      LOCAL_STACK_STATE: ${LOCAL_STACK_STATE:?LOCAL_STACK_STATE names the tester state folder}
      # The keys identity answers each caller's authority and admission questions with, one per caller, as
      # docker-compose.outreach.yml and `pnpm local:stack` pass them; compose-env fills them from this stack's secrets.
      # Without the edge's, the edge cannot confirm a session is live, so every signed-in call is refused.
      IDENTITY_EDGE_AUTHORITY_SECRET: ${IDENTITY_EDGE_AUTHORITY_SECRET:?run local-test-compose-env.mjs}
      IDENTITY_WS_AUTHORITY_SECRET: ${IDENTITY_WS_AUTHORITY_SECRET:?run local-test-compose-env.mjs}
      IDENTITY_PAY_ADMISSION_SECRET: ${IDENTITY_PAY_ADMISSION_SECRET:?run local-test-compose-env.mjs}
      IDENTITY_TRADE_ADMISSION_SECRET: ${IDENTITY_TRADE_ADMISSION_SECRET:?run local-test-compose-env.mjs}
      IDENTITY_LOCAL_MAIL_OUTBOX: ${LOCAL_STACK_STATE:?LOCAL_STACK_STATE names the tester state folder}/email-outbox.log
    volumes:
      - ${LOCAL_STACK_STATE:?LOCAL_STACK_STATE names the tester state folder}:${LOCAL_STACK_STATE:?LOCAL_STACK_STATE names the tester state folder}

  # The seed writes the founder vault and the TEST wallet into the state folder, so it runs as the folder's owner too.
  # Its image adds svc-bank's binary to the app image (tooling/infra/tester-seed.Dockerfile), for the content seed's
  # `svc-bank test-seed`.
  seed:
    image: intafaced/tester-seed:dev
    build:
      context: .
      dockerfile: tooling/infra/tester-seed.Dockerfile
      target: seed
      additional_contexts:
        app: service:svc-identity
        bank: service:svc-bank
    # The content seed opens svc-bank's TEST products and posts through the ledger, so both are up first.
    depends_on:
      svc-bank:
        condition: service_healthy
      svc-ledger:
        condition: service_healthy
    user: '${LOCAL_TESTER_UID:?run local-test-compose-env.mjs}:${LOCAL_TESTER_GID:?run local-test-compose-env.mjs}'
